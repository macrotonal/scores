<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ensemble Score Explorer — Sam Annand</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#014b4a; --text:#d4e8d8; --accent:#2e8b57; --head:#e8f5ec;
  --ink:#111; --paper:#fff;
  --sbw:270px;                 /* sidebar width; user-resizable, persisted */
}
/* WARM: takes the blue edge off the white paper. Screen only. */
body.warm{
  --paper:#fbf8f1;
  --bar-h:52px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Observer Cover','Futura','Century Gothic','Trebuchet MS',sans-serif;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button{font:inherit;cursor:pointer}

/* ---------------------------------------------------------------- top bar */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:8px 12px; min-height:var(--bar-h);
  background:var(--bg); border-bottom:1px solid rgba(212,232,216,0.18);
  flex-wrap:wrap;
}
.tb-group{display:flex; align-items:center; gap:6px}
.tb-spacer{flex:1 1 auto}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:44px; padding:0 14px;
  background:#fff; border:2px solid var(--ink); color:var(--ink); border-radius:4px;
  font-family:'Raleway',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:0.14em; text-transform:uppercase;
  transition:background .18s,color .18s,border-color .18s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent; border-color:rgba(212,232,216,0.45); color:var(--text)}
.btn.ghost:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.on{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.icon{min-width:44px; padding:0 10px; font-size:13px; letter-spacing:0}
.btn.perform{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.perform:hover{background:#fff; color:var(--accent); border-color:#fff}
.tabs{display:flex; gap:6px; flex-wrap:wrap}
.tab{
  min-height:44px; padding:0 14px; border-radius:4px;
  background:transparent; border:2px solid rgba(212,232,216,0.35); color:var(--text);
  font-family:'Raleway',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:0.14em; text-transform:uppercase;
}
.tab.on{background:#fff; border-color:#fff; color:var(--ink)}
.zoom{display:flex; align-items:center; gap:4px}
.zoom .val{
  font-family:'Raleway',sans-serif; font-size:9px; letter-spacing:.08em;
  color:rgba(212,232,216,0.75); min-width:42px; text-align:center;
}

/* ---------------------------------------------------------------- annotation tools */
.anntools{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  width:100%; padding:7px 2px 1px; border-top:1px solid rgba(212,232,216,0.14);
}
.inkdot{
  width:44px; min-height:44px; border:0; background:transparent; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.inkdot span{
  width:17px; height:17px; border-radius:50%; display:block;
  border:1px solid rgba(255,255,255,.6);
}
.inkdot.sel span{outline:2px solid #fff; outline-offset:2px}
.wbtn{
  min-width:44px; min-height:44px; padding:0 10px; border-radius:4px;
  border:1px solid rgba(212,232,216,0.4); background:transparent; color:var(--text);
  font-family:'Raleway',sans-serif; font-size:9px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase;
}
.wbtn.sel{background:#fff; color:#111; border-color:#fff}
/* ---- stamp palette ---- */
.stamptray{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  width:100%; padding:6px 2px 2px; border-top:1px solid rgba(212,232,216,0.14);
}
.stampbtn{
  min-width:44px; min-height:44px; padding:0 6px; border-radius:4px;
  border:1px solid rgba(212,232,216,0.4); background:transparent; color:var(--text);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.stampbtn.sel{background:#fff; color:#111; border-color:#fff}
.stampbtn svg{display:block}
body[data-dev="phone"] .stamptray{display:none !important}  /* the mode bar owns it */
body.drawing .sys, body.drawing #pfpage, body.drawing .sys svg{touch-action:none}
/* Fingers place stamps on a phone (two fingers pan), so the browser's own
   gestures have to step aside there - and only there: on tablet/desktop touch
   is not an ink input, so it must keep scrolling the page. */
body[data-dev="phone"].stamping .sys,
body[data-dev="phone"].stamping #pfpage,
body[data-dev="phone"].stamping .sys svg{touch-action:none}
body.stamping{user-select:none; -webkit-user-select:none}
/* Ink must be free to live in the header, the top/side margins and below the last
   system. An <svg> clips to its viewBox by default, which sliced any stroke that
   left its anchor system's box; overflow:visible lifts that. Systems carrying ink
   are raised so a downward stroke is not painted under the next system. */
.sys svg, #pfpage svg, .prpage svg{overflow:visible}
.sys{position:relative; z-index:1}
.sys.hasink{z-index:5}
body.drawing, body.texting{user-select:none; -webkit-user-select:none}
/* the paper is the ink surface: let strokes sit over the header block too */
#paper{position:relative}
.schead{position:relative; z-index:0}
/* performance-mode mini toolbar */
.pfann{
  position:absolute; bottom:max(12px,env(safe-area-inset-bottom)); left:50%;
  transform:translateX(-50%); z-index:530; display:flex; gap:6px; align-items:center;
  background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.18); border-radius:24px;
  padding:5px 10px; opacity:.55; transition:opacity .25s;
}
.pfann:hover{opacity:1}
.pfann .inkdot span{border-color:rgba(0,0,0,.35)}
.pfann .wbtn{border-color:rgba(0,0,0,.3); color:#333}
.pfann .wbtn.sel{background:#111; color:#fff; border-color:#111}
.pfdraw{
  position:absolute; top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left)); z-index:520;
  width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(0,0,0,.25); background:rgba(255,255,255,.85); color:#333;
  font-size:17px; line-height:1; opacity:.28; transition:opacity .25s;
}
.pfdraw:hover,.pfdraw.on{opacity:1}
.pfdraw.on{background:#2e8b57; color:#fff; border-color:#2e8b57}

/* ---------------------------------------------------------------- shell */
.shell{display:flex; align-items:stretch; min-height:calc(100vh - var(--bar-h))}
.sidebar{
  position:relative;
  width:var(--sbw); flex:0 0 var(--sbw); padding:14px 12px 60px;
  border-right:1px solid rgba(212,232,216,0.18);
  overflow-y:auto; max-height:calc(100vh - var(--bar-h)); position:sticky; top:var(--bar-h);
}
/* drag handle on the sidebar's right edge (mouse + touch) */
.sb-resize{
  position:absolute; top:0; right:-3px; width:12px; height:100%;
  cursor:col-resize; touch-action:none; z-index:70;
  background:transparent;
}
.sb-resize::after{
  content:''; position:absolute; top:0; bottom:0; left:5px; width:2px;
  background:rgba(212,232,216,0.18); transition:background .15s;
}
.sb-resize:hover::after, body.sbdrag .sb-resize::after{background:var(--accent)}
body.sbdrag{cursor:col-resize; user-select:none; -webkit-user-select:none}
body.nosidebar .sidebar{display:none}
.scorewrap{flex:1 1 auto; min-width:0; padding:18px 16px 120px}

.grp{margin-bottom:14px; border:1px solid rgba(212,232,216,0.2); border-radius:6px; overflow:hidden}
.grp-head{
  display:flex; align-items:center; gap:6px; padding:8px 10px 6px;
  background:rgba(46,139,87,0.16); flex-wrap:wrap;
}
/* the group name takes a full row so its controls never get clipped */
.grp-head .grp-name{flex:1 1 100%; order:-1}
/* Names of music are Observer Text Italic; structural chrome stays in the UI fonts. */
.grp-name{
  flex:1 1 auto; font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:15px; letter-spacing:.01em; color:var(--head);
}
.prow{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:5px 10px}
/* Controls travel together, so they wrap BELOW the name rather than squeezing it. */
.prow-ctrls, .grp-ctrls{
  display:flex; align-items:center; gap:6px; flex:0 0 auto; margin-left:auto;
}
.prow:nth-child(even){background:rgba(255,255,255,0.03)}
.pname{
  /* abbreviated shortName, never truncated: the distinguishing number must stay
     visible, so long names wrap to a second line instead of ellipsizing */
  /* min-width stops flexbox crushing the name to one character per line (the harp
     rows carry the most controls and hit this first); normal word breaking means
     text can never render vertically at any sidebar width. */
  flex:1 1 5.5em; min-width:5em; font-family:'Raleway',sans-serif; font-size:11.5px;
  color:var(--text); line-height:1.25;
  overflow-wrap:normal; word-break:normal; hyphens:none; white-space:normal;
}
/* lane colour swatch + picker */
.pdot{
  width:44px; min-height:44px; flex:0 0 auto; border:0; background:transparent;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.pdot i{
  display:block; width:15px; height:15px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.55);
}
.pdot.mixed i{background:linear-gradient(135deg,#c0392b 0 33%,#1e8449 33% 66%,#2f57c9 66%)}
.bwbtn{
  flex:0 0 auto; min-width:32px; min-height:44px; padding:0 6px; border-radius:4px;
  border:1px solid rgba(212,232,216,0.35); background:transparent;
  color:rgba(212,232,216,0.6);
  font-family:'Raleway',sans-serif; font-size:8px; font-weight:700;
  letter-spacing:.08em;
}
.bwbtn.on{background:#fff; color:#111; border-color:#fff}
.picker{
  position:fixed; z-index:120; background:#fff; border:2px solid #111; border-radius:6px;
  padding:10px; box-shadow:0 10px 40px rgba(0,0,0,.45); width:212px;
}
.picker .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:9px}
.picker .grid button{
  width:100%; aspect-ratio:1; border-radius:50%; border:1px solid rgba(0,0,0,.25); padding:0;
}
.picker .grid button.sel{outline:2px solid #111; outline-offset:2px}
.picker .row{display:flex; align-items:center; gap:7px}
.picker input[type=color]{width:40px; height:32px; padding:0; border:1px solid #ccc; background:#fff}
.picker input[type=text]{
  flex:1 1 auto; min-width:0; height:32px; border:1px solid #ccc; border-radius:3px;
  padding:0 7px; font-family:'Raleway',sans-serif; font-size:11px;
}
.picker .rst{
  width:100%; margin-top:8px; min-height:34px; border:1px solid #111; background:#fff;
  color:#111; border-radius:3px;
  font-family:'Raleway',sans-serif; font-size:9px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase;
}
/* tri-state control */
.tri{display:flex; flex:0 0 auto; border:1px solid rgba(212,232,216,0.35); border-radius:4px; overflow:hidden}
.tri button{
  min-width:34px; min-height:44px; padding:0 6px; border:0; background:transparent;
  color:rgba(212,232,216,0.7);
  font-family:'Raleway',sans-serif; font-size:8px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
}
.tri button + button{border-left:1px solid rgba(212,232,216,0.25)}
.tri button.on{background:#fff; color:var(--ink)}
.tri button.on.g{background:var(--accent); color:#fff}
.tri button.mixed{background:rgba(255,255,255,0.35); color:var(--ink)}
.sb-note{
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:12px; color:rgba(212,232,216,0.62); line-height:1.55; margin:2px 0 12px;
}

/* ---------------------------------------------------------------- paper */
.paper{
  background:var(--paper); color:#000; border-radius:8px; border:2px solid var(--ink);
  padding:26px 22px 34px; margin:0 auto; max-width:100%;
}
.schead{text-align:center; margin-bottom:20px}
.sc-title{
  font-family:'Observer Cover','Futura',sans-serif; font-size:34px; font-weight:400;
  color:#000; letter-spacing:.5px; line-height:1.1;
}
.sc-sub{
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:17px; color:#222; margin-top:6px;
}
.sc-comp{font-family:'Observer Text','Georgia',serif; font-size:12px; color:#333; margin-top:8px}
.sc-meta{
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:12.5px; letter-spacing:.02em; color:#555; margin-top:8px;
}
.sysbox{width:100%}
.sys{display:block; width:100%}
.sys svg{display:block; width:100%; height:auto}
.sys.ph{background:repeating-linear-gradient(0deg,#fafafa,#fafafa 2px,#fff 2px,#fff 12px)}
.empty-hint{
  text-align:center; padding:70px 20px; color:#888;
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic; font-size:16px;
}

/* ------------------------------------------------------- page marks (screen) */
.pagemark{
  display:flex; align-items:center; gap:10px;
  margin:26px 0 10px; padding-top:2px;
  border-top:1px solid rgba(0,0,0,0.16);
}
.pagemark.first{margin-top:6px; border-top:0}
.pagenum{
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:12px; color:#8a8a8a; letter-spacing:.02em;
}
.pagehint{
  position:fixed; right:18px; bottom:18px; z-index:90;
  background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.18); border-radius:18px;
  padding:5px 13px; color:#444;
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic; font-size:12px;
  pointer-events:none;
}
@media print{ .pagemark, .pagehint{display:none !important} }
body.performing .pagehint{display:none !important}

/* ---------------------------------------------------------------- text tool */
.annedit{
  position:fixed; z-index:180; min-width:180px; padding:6px 9px;
  border:2px solid var(--accent); border-radius:4px; background:#fff; color:#111;
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic; font-size:15px;
  box-shadow:0 6px 24px rgba(0,0,0,.3);
}
body.texting .sys svg, body.texting #pfpage svg{cursor:text}
body.earing .sys svg, body.earing #pfpage svg{cursor:pointer}

/* ---------------------------------------------------------------- tuner panel */
.tunerpanel{
  position:fixed; z-index:600; display:flex; flex-direction:column;
  background:#fff; border:2px solid var(--ink); border-radius:8px; overflow:hidden;
  box-shadow:0 14px 50px rgba(0,0,0,.45); width:min(420px,90vw);
}
.tp-bar{
  display:flex; align-items:center; gap:8px; padding:6px 8px;
  background:var(--bg); color:var(--text); cursor:move; touch-action:none;
}
.tp-title{
  flex:0 0 auto; font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:13px; color:var(--head);
}
.tp-op{flex:1 1 auto; min-width:60px; accent-color:var(--accent)}
.tp-x{
  flex:0 0 auto; width:32px; height:32px; border-radius:4px; border:1px solid rgba(212,232,216,.4);
  background:transparent; color:var(--text); font-size:13px; line-height:1;
}
.tp-body{position:relative; height:min(520px,60vh); background:#fff}
.tp-body iframe{width:100%; height:100%; border:0; display:block}
.tp-fail{
  position:absolute; inset:0; padding:18px; background:#fff; color:#333;
  font-family:'Raleway',sans-serif; font-size:12px; line-height:1.6;
}

/* ---------------------------------------------------------------- toast */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:#fff; color:#111; border:2px solid #111; border-radius:4px;
  padding:11px 18px; font-family:'Raleway',sans-serif; font-size:11px;
  z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; max-width:80vw;
}
.toast.show{opacity:1}

/* ------------------------------------------------- device modes (Auto/Phone/Tablet/Desktop)
   Layout is driven by body[data-dev], not by viewport width alone, so the user's
   override is authoritative. Auto sets the attribute from the viewport. */
.scrim{display:none}

/* ---- TABLET and PHONE share the overlay-sidebar behaviour ---- */
body[data-dev="tablet"] .sidebar,
body[data-dev="phone"] .sidebar{
  position:fixed; top:0; left:0; bottom:0; z-index:60; width:300px; flex-basis:300px;
  max-height:100vh; background:var(--bg); border-right:2px solid rgba(212,232,216,0.3);
  transform:translateX(-105%); transition:transform .24s ease;
  box-shadow:0 0 40px rgba(0,0,0,.5); padding-top:18px;
}
body[data-dev="tablet"].drawer .sidebar,
body[data-dev="phone"].drawer .sidebar{transform:translateX(0)}
body[data-dev="tablet"]:not(.nosidebar) .sidebar,
body[data-dev="phone"]:not(.nosidebar) .sidebar{display:block}
body[data-dev="tablet"] .scrim,
body[data-dev="phone"] .scrim{
  display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .24s;
}
body[data-dev="tablet"].drawer .scrim,
body[data-dev="phone"].drawer .scrim{opacity:1; pointer-events:auto}
body[data-dev="tablet"] .scorewrap,
body[data-dev="phone"] .scorewrap{padding:14px 10px 120px}
body[data-dev="tablet"] .paper,
body[data-dev="phone"] .paper{padding:20px 14px 26px}
body[data-dev="tablet"] .sc-title,
body[data-dev="phone"] .sc-title{font-size:28px}
/* the drag handle is meaningless for an overlay sidebar */
body[data-dev="tablet"] .sb-resize,
body[data-dev="phone"] .sb-resize{display:none}

/* Sheet header. The overlay sidebar covers the toolbar - including the very
   button that opened it - and on phone it is 100vw wide, so the scrim behind it
   cannot be tapped either. #tbfold cannot rescue it: .topbar is a stacking
   context (position:sticky, z-index:40), so the fold menu's z-index:120 is
   scoped INSIDE z-40 and still paints under the z-60 sheet. The sheet therefore
   carries its own exit, sticky at the top, always thumb-reachable. */
.sb-head{display:none}
body[data-dev="tablet"] .sb-head,
body[data-dev="phone"] .sb-head{
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:3;
  margin:0 -12px 12px; padding:8px 12px 6px;
  background:var(--bg); border-bottom:1px solid rgba(212,232,216,0.22);
  touch-action:none;
}
/* the sticky header supplies the sheet's top spacing, so drop the drawer padding
   that would otherwise offset it and let the note slide under it */
body[data-dev="tablet"].drawer .sidebar,
body[data-dev="phone"].drawer .sidebar{padding-top:0}
.sb-head .sb-title{
  flex:1 1 auto; font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:15px; color:var(--head);
}
.sb-done{
  flex:0 0 auto; min-width:44px; min-height:44px; padding:0 14px; border-radius:4px;
  background:#fff; border:2px solid #fff; color:var(--ink);
  font-family:'Raleway',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
}
/* grab bar: the affordance for swipe-down-to-dismiss */
.sb-grab{
  position:absolute; left:50%; top:2px; transform:translateX(-50%);
  width:38px; height:4px; border-radius:2px; background:rgba(212,232,216,0.35);
}

/* ---- PHONE: compact, must not be broken ---- */
body[data-dev="phone"]{overflow-x:hidden}
body[data-dev="phone"] .topbar{
  gap:6px; padding:6px 8px; min-height:0; flex-wrap:nowrap; align-items:center;
}
/* one row: piece tabs scroll, everything else folds into the menu */
body[data-dev="phone"] .tabs{
  flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden;
  flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
body[data-dev="phone"] .tabs::-webkit-scrollbar{display:none}
body[data-dev="phone"] .tab{flex:0 0 auto; padding:0 10px; font-size:8.5px}
body[data-dev="phone"] .tb-spacer{display:none}
body[data-dev="phone"] .zoom{display:none}
body[data-dev="phone"] .tb-group.fold{
  display:none; position:fixed; top:52px; right:6px; left:6px; z-index:120;
  background:var(--bg); border:2px solid rgba(212,232,216,.35); border-radius:8px;
  padding:8px; gap:6px; flex-wrap:wrap; box-shadow:0 12px 40px rgba(0,0,0,.5);
}
body[data-dev="phone"].menu .tb-group.fold{display:flex}
body[data-dev="phone"] .tb-group.fold .btn{flex:1 1 44%}
body[data-dev="phone"] #btnPerform{order:-2; flex:1 1 100%}
body[data-dev="phone"] .phone-only{display:inline-flex}
body[data-dev="phone"] .anntools{padding:6px 2px 2px}
/* score surface: fit the width, never scroll sideways */
body[data-dev="phone"] .scorewrap{padding:8px 4px 90px; min-width:0}
body[data-dev="phone"] .paper{padding:12px 6px 18px; border-radius:4px; max-width:100%}
body[data-dev="phone"] .sc-title{font-size:22px}
body[data-dev="phone"] .sc-sub{font-size:14px}
body[data-dev="phone"] .sc-comp,body[data-dev="phone"] .sc-meta{font-size:10px}
body[data-dev="phone"] .sys svg{max-width:100%}
body[data-dev="phone"] .sidebar{width:100vw; flex-basis:100vw; border-right:0}
body[data-dev="phone"] .pagehint{right:8px; bottom:8px; font-size:11px}
.phone-only{display:none}
/* the fold menu is desktop/tablet-irrelevant: buttons stay inline there */
body[data-dev="desktop"] .tb-group.fold,
body[data-dev="tablet"] .tb-group.fold{display:flex}

/* ---- PHONE mode bar (DRAW / TEXT / EAR) ----
   The shared .anntools strip wraps inside the top bar, which on a phone squashed
   the piece tabs into a tall moosh and buried the DRAW toggle, leaving no exit.
   On phone each mode instead replaces the chrome with this compact bottom bar:
   one non-wrapping scrollable row of that mode's tools plus a fixed EXIT at the
   end. Bottom = thumb-reachable, and it leaves the top of the page readable. */
.modebar{display:none}
body[data-dev="phone"] .anntools{display:none !important}   /* never wrap into the tabs */
body[data-dev="phone"].modeon .modebar{
  display:flex; align-items:center; gap:6px;
  position:fixed; left:0; right:0; bottom:0; z-index:130;
  padding:6px 8px; padding-bottom:calc(6px + env(safe-area-inset-bottom));
  background:var(--bg); border-top:2px solid rgba(212,232,216,0.35);
  box-shadow:0 -10px 30px rgba(0,0,0,.45);
}
/* the main toolbar steps aside while a mode is active; the shell takes over its
   height so nothing on the page shifts when a mode is entered or left */
body[data-dev="phone"].modeon .topbar{display:none}
body[data-dev="phone"].modeon .shell{padding-top:var(--modepad, var(--bar-h))}
body.performing .modebar{display:none !important}
.mb-tools{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:6px;
  flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.mb-tools::-webkit-scrollbar{display:none}
/* The row scrolls rather than squeezing: with the stamp palette in it there are
   enough controls that flex would otherwise shrink the colour dots to ~17px,
   well under the 44px touch target the rest of the phone UI keeps to. */
.mb-tools .inkdot, .mb-tools .wbtn, .mb-tools .stampbtn{flex:0 0 auto}
.mb-label{
  flex:0 0 auto; padding-right:2px;
  font-family:'Observer Text Italic','Georgia',serif; font-style:italic;
  font-size:12px; color:rgba(212,232,216,0.75); white-space:nowrap;
}
.mb-exit{
  flex:0 0 auto; min-width:74px; min-height:44px; padding:0 14px; border-radius:4px;
  background:var(--accent); border:2px solid var(--accent); color:#fff;
  font-family:'Raleway',sans-serif; font-size:9px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
}
/* touch targets on a phone: the tuner's ✕ was 32px and could sit off-screen */
body[data-dev="phone"] .tp-x{width:44px; height:44px}

/* ---------------------------------------------------------------- perform */
#perform{
  position:fixed; inset:0; z-index:500; background:var(--paper); display:none;
  touch-action:pan-y; overflow:hidden;
}
body.performing{overflow:hidden}
body.performing #perform{display:block}
/* chrome is removed from the page in performance mode, not merely covered */
body.performing .topbar,
body.performing .shell,
body.performing .scrim,
body.performing .picker{display:none !important}
#perform .pfpage{
  position:absolute; inset:0; display:flex; align-items:flex-start;
  justify-content:center; padding:0; overflow:hidden;
}
#perform .pfexit{
  position:absolute; top:max(10px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right));
  z-index:520; width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(0,0,0,.25); background:rgba(255,255,255,.85); color:#333;
  font-size:17px; line-height:1; opacity:.28; transition:opacity .25s;
}
#perform .pfexit:hover,#perform .pfexit:focus{opacity:1}
/* A touch screen has no hover, so a control resting at 0.28 opacity is close to
   invisible and reads as "no way out". Keep the fading controls findable there. */
@media (pointer:coarse){
  #perform .pfexit, .pfdraw{opacity:.62}
}
#perform .pfind{
  position:absolute; bottom:max(12px,env(safe-area-inset-bottom)); left:50%;
  transform:translateX(-50%); z-index:520;
  font-family:'Raleway',sans-serif; font-size:11px; letter-spacing:.16em; color:#444;
  background:rgba(255,255,255,.9); border:1px solid rgba(0,0,0,.15); border-radius:20px;
  padding:6px 16px; opacity:0; transition:opacity .5s; pointer-events:none;
}
#perform .pfind.show{opacity:.9; transition:opacity .12s}

/* ---------------------------------------------------------------- print */
.printonly{display:none}
@media print{
  @page{size:A4 portrait; margin:12mm 10mm 14mm}
  body{background:#fff !important; color:#000 !important}
  .topbar,.sidebar,.scrim,.toast,#perform{display:none !important}
  .shell{display:block}
  .scorewrap{padding:0}
  .paper{border:0; border-radius:0; padding:0; max-width:none; background:#fff !important}
  body.warm{--paper:#fff}
  .printonly{display:block}
  .prpage{page-break-after:always; break-after:page; position:relative; overflow:visible}
  .prpage .sys, .prpage svg{overflow:visible}
  .prpage:last-child{page-break-after:auto; break-after:auto}
  .prfoot{
    position:absolute; bottom:0; left:0; right:0;
    font-family:'Observer Text Italic','Georgia',serif; font-style:italic; font-size:9px; color:#555;
    display:flex; justify-content:space-between; border-top:.5px solid #ccc; padding-top:3px;
  }
  .sys{break-inside:avoid; page-break-inside:avoid}
}
</style>
