<script>
"use strict";
/* ==========================================================================
   Ensemble Score Explorer
   Custom SVG engraver over MuseScore-derived data. No external libraries.
   ========================================================================== */

/* ---------------------------------------------------------------- fonts */
(function injectFonts(){
  if(!window.FONTS) return;
  var css = '';
  function face(fam, style, b64){
    return '@font-face{font-family:"'+fam+'";font-style:'+style+';font-weight:400;'+
           'src:url(data:font/otf;base64,'+b64+') format("opentype");font-display:swap}';
  }
  css += face('Observer Cover','normal',FONTS.cover);
  css += face('Observer Text','normal',FONTS.text);
  css += face('Observer Text Italic','italic',FONTS.italic);
  var s=document.createElement('style'); s.textContent=css; document.head.appendChild(s);
})();

/* ---------------------------------------------------------------- consts */
var D = window.SCORE_DATA, GL = window.GLYPHS;
var UPEM = GL.upem, GSCALE_DEN = UPEM/4;   /* font units per staff space */

var DURS  = ['whole','half','quarter','eighth','16th','32nd','64th','128th','breve'];
var DURV  = [1, .5, .25, .125, .0625, .03125, .015625, .0078125, 2];
var ACCG  = [null,'accidentalSharp','accidentalFlat','accidentalNatural',
             'accidentalDoubleSharp','accidentalDoubleFlat'];
var LETT  = 'CDEFGAB';
var SEMIS = [0,2,4,5,7,9,11];

/* clef -> diatonic step sitting on the TOP staff line */
var CLEF_TOP = {G:38, F:26, C3:32, C1:28+4, C2:28+2, C4:28-2, C5:28-4};
var CLEF_GLYPH = {G:'gClef', F:'fClef', C3:'cClef', C1:'cClef', C2:'cClef', C4:'cClef', C5:'cClef'};
/* y of the glyph anchor line, in staff-space units from the top line */
var CLEF_ANCHOR = {G:3, F:1, C3:2, C1:0, C2:1, C4:3, C5:4};

/* Key-signature accidental placement.
   The first sharp is the highest F at or below the top staff line; the first flat
   the highest B at or below it. Successive accidentals follow a fixed interval
   pattern, which reproduces the classical positions in every clef (including
   G#5 sitting above the treble staff). */
var KS_DELTA_SHARP = [-3, 4, -3, -3, 4, -3];
var KS_DELTA_FLAT  = [ 3,-4,  3, -4, 3, -4];
function keySigSteps(key, clef){
  var top = CLEF_TOP[clef] != null ? CLEF_TOP[clef] : 38;
  var n = Math.abs(key), sharp = key > 0;
  if(!n) return [];
  var startLetter = sharp ? 3 : 6;                 /* F or B */
  var s = top - (((top - startLetter) % 7) + 7) % 7;
  var deltas = sharp ? KS_DELTA_SHARP : KS_DELTA_FLAT;
  var out = [s];
  for(var i=0; i<n-1; i++) out.push(out[i] + deltas[i % deltas.length]);
  return out.slice(0, n);
}

/* layout constants, in staff spaces */
var LC = {
  staffH: 4, staffGap: 5.2, groupGap: 3.4, systemGap: 7.5,
  laneH: 2.6, laneGap: 0.7, laneTop: 2.2,
  labelW: 13, bracketW: 1.6,
  barPad: 1.5, noteMin: 2.1, noteK: 1.55,
  clefW: 3.2, keyStep: 1.15, timeW: 2.8,
  stemLen: 3.5, beamH: 0.5, beamGap: 0.32,
  headW: 1.18, accW: 1.15, dotW: .62,
  headerH: 0, barnumH: 1.6
};

/* Curated categorical lane palette — 14 well-separated hues at similar mid-dark
   lightness, legible on white paper. Assigned in sidebar order so adjacent parts
   never look alike (the MacroColour degree colours repeat too much to tell lanes
   apart). Any lane can be overridden from the sidebar swatch. */
/* Ordered so CONSECUTIVE entries jump across the hue wheel: parts are assigned in
   sidebar order over the whole piece (across groups), so neighbours never collide. */
var LANE_PALETTE = [
  '#c0392b',  /* red        */
  '#1e8449',  /* green      */
  '#2f57c9',  /* blue       */
  '#d35f00',  /* orange     */
  '#6a3fc0',  /* violet     */
  '#00857a',  /* teal       */
  '#c02e7a',  /* magenta    */
  '#a67c00',  /* amber      */
  '#0f7bb5',  /* cyan blue  */
  '#9b2fa8',  /* purple     */
  '#5f8b1e',  /* olive      */
  '#8c5a2b',  /* brown      */
  '#4a6572',  /* slate      */
  '#7a7d1f'   /* citron     */
];

var state = {
  piece: 0,
  sel: {},          /* pieceId -> { partIndex: 1(score) | 2(guide) } */
  colors: {},       /* pieceId -> { partIndex: '#rrggbb' } lane colour overrides */
  bw: {},           /* pieceId -> { partIndex: 1 } render this part's noteheads black */
  annots: {},       /* pieceId -> [stroke] in musical coordinates */
  zoom: 100,        /* percent; 100 = fit width */
  warm: false,      /* warm paper tint (screen only) */
  sidebarW: 270,    /* resizable sidebar width, persisted */
  device: 'auto',   /* auto | phone | tablet | desktop */
  sp: 7.2
};

/* Zoom stops — clean fixed ladder including exactly 100%. */
var ZOOM_STOPS = [50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 250];

/* 100% = fit width: staff size derives from the available score width, so the
   default view fills the page without any manual zooming. Recomputed on every
   render, which covers sidebar toggles and window resizes. */
function baseSP(contentW){
  return Math.max(5, Math.min(13, contentW / 78));
}
function spFor(contentW){
  return baseSP(contentW) * (state.zoom / 100);
}

function laneColour(p, pi){
  var o = state.colors[p.id];
  if(o && o[pi]) return o[pi];
  return LANE_PALETTE[pi % LANE_PALETTE.length];
}
/* The monochrome opt-out exists for the harp parts only (Sam's harpist reads the
   "Monochrome" harp engravings). Every other instrument always carries MacroColour. */
function isHarp(p, pi){
  var part = p.parts[pi];
  return !!part && part.instr === 'pluck.harp';
}
function isBW(p, pi){
  if(!isHarp(p, pi)) return false;
  var b = state.bw[p.id];
  return !!(b && b[pi]);
}
/* notehead / stem colour for a part, honouring the per-part B/W toggle */
function inkFor(p, pi, paletteIdx){
  return isBW(p, pi) ? '#000000' : (D.palette[paletteIdx] || '#000000');
}

/* ---------------------------------------------------------------- utils */
function el(tag, attrs, kids){
  var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) for(var k in attrs){ if(attrs[k]!=null) n.setAttribute(k, attrs[k]); }
  if(kids) kids.forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function h(tag, cls, txt){
  var n=document.createElement(tag); if(cls) n.className=cls;
  if(txt!=null) n.textContent=txt; return n;
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]; }); }
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2600);
}
function piece(){ return D.pieces[state.piece]; }
function selOf(p){ if(!state.sel[p.id]) state.sel[p.id]={}; return state.sel[p.id]; }

/* ---------------------------------------------------------------- model helpers */
function measureOf(staff, bar){       /* bar is 1-based */
  var m = staff.m[bar-1];
  if(m === undefined) return null;     /* staff shorter than the piece */
  return m === 0 ? 0 : m;
}
/* clef in effect for a staff at a given bar */
function clefAt(staff, bar){
  var c = staff.clef0;
  for(var k in staff.clefs){
    var b = (+k)+1;
    if(b <= bar) { /* keys are unordered; take the latest <= bar */ }
  }
  var best = -1;
  for(var k2 in staff.clefs){
    var b2 = (+k2)+1;
    if(b2 <= bar && b2 > best){ best = b2; c = staff.clefs[k2]; }
  }
  return c;
}
function clefChangeAt(staff, bar){
  var k = String(bar-1);
  return Object.prototype.hasOwnProperty.call(staff.clefs, k) ? staff.clefs[k] : null;
}
function tsAt(p, bar){
  var n=p.ts[0], d=p.ts[1];
  for(var i=0;i<p.tsChanges.length;i++){
    var c=p.tsChanges[i];
    if(c[0]+1 <= bar){ n=c[1]; d=c[2]; }
  }
  return [n,d];
}
function tsChangeAt(p, bar){
  for(var i=0;i<p.tsChanges.length;i++){ if(p.tsChanges[i][0]+1===bar) return [p.tsChanges[i][1],p.tsChanges[i][2]]; }
  return null;
}
function barDur(p, bar){ var t=tsAt(p,bar); return t[0]/t[1]; }

/* is this measure a full-bar rest (all voices silent)? */
function isBarRest(staff, bar){
  var m = measureOf(staff, bar);
  if(m === null || m === 0) return true;
  for(var v=0; v<m.length; v++){
    for(var i=0;i<m[v].length;i++){ if(m[v][i][0] === 2) return false; }
  }
  return true;
}

/* ---------------------------------------------------------------- selection */
function scoreParts(p){
  var s = selOf(p), out=[];
  for(var i=0;i<p.parts.length;i++) if(s[i]===1) out.push(i);
  return out;
}
function guideParts(p){
  var s = selOf(p), out=[];
  for(var i=0;i<p.parts.length;i++) if(s[i]===2) out.push(i);
  return out;
}
/* staves to engrave, in score order, with their part + group */
function scoreStaves(p){
  var out=[];
  scoreParts(p).forEach(function(pi){
    p.parts[pi].staves.forEach(function(si, k){
      out.push({staff:p.staves[si], si:si, part:pi, group:p.parts[pi].group,
                first:k===0, last:k===p.parts[pi].staves.length-1,
                nst:p.parts[pi].staves.length});
    });
  });
  return out;
}

/* ---------------------------------------------------------------- title */
function selectionTitle(p){
  var sp = scoreParts(p);
  if(sp.length === 0) return null;
  if(sp.length === 1) return p.parts[sp[0]].display;
  var byGroup = {}, order=[];
  sp.forEach(function(pi){
    var g = p.parts[pi].group;
    if(!byGroup[g]){ byGroup[g]=[]; order.push(g); }
    byGroup[g].push(pi);
  });
  var full = p.parts.every(function(_,i){ return selOf(p)[i]===1; });
  if(full) return 'Full Score';
  if(order.length === 1) return p.groups[order[0]].name;
  order.sort(function(a,b){
    var d = byGroup[b].length - byGroup[a].length;
    return d !== 0 ? d : a - b;
  });
  return order.map(function(g){ return p.groups[g].name; }).join(' + ');
}

/* ==========================================================================
   EVENT FLATTENING — turn a measure into timed events
   ========================================================================== */
function flattenVoice(events, p, bar){
  var out=[], t=0;
  for(var i=0;i<events.length;i++){
    var e = events[i], dur;
    if(e[0] === 1){                                     /* measure rest */
      out.push({t:0, d:barDur(p,bar), type:'mrest', e:e});
      t += barDur(p,bar);
      continue;
    }
    var di = e[1], dots = e[2];
    dur = DURV[di];
    if(dots) dur *= (2 - Math.pow(2,-dots));
    var tup = (e[0]===2) ? e[3] : -1;
    if(tup >= 0){ var T = D.tuplets[tup]; dur = dur * T[1] / T[0]; }
    out.push({
      t:t, d:dur, di:di, dots:dots, tup:tup,
      type: e[0]===2 ? 'chord' : 'rest',
      art: e[0]===2 ? e[4] : 0,
      stemCol: e[0]===2 ? e[5] : 0,
      notes: e[0]===2 ? e[6] : null,
      e:e
    });
    t += dur;
  }
  return out;
}
function flattenMeasure(staff, p, bar){
  var m = measureOf(staff, bar);
  if(m === null || m === 0) return [[{t:0, d:barDur(p,bar), type:'mrest'}]];
  return m.map(function(v){ return flattenVoice(v, p, bar); });
}

/* ==========================================================================
   BEAMING — derived (no <Beam> in source)
   ========================================================================== */
function beamGroups(voice, p, bar){
  /* returns array of arrays of indices into `voice` that beam together */
  var ts = tsAt(p, bar), n = ts[0], d = ts[1];
  var beat = 1/d;                                    /* one beat in whole notes */
  var groupLen = (n===4 && d===4) ? 0.5 : beat;      /* half-bar in 4/4, else per beat */
  var groups=[], cur=[];
  function flush(){ if(cur.length>1) groups.push(cur); cur=[]; }
  for(var i=0;i<voice.length;i++){
    var ev = voice[i];
    if(ev.type !== 'chord' || ev.di < 3 || ev.di > 7){ flush(); continue; }
    if(cur.length){
      var prev = voice[cur[cur.length-1]];
      var boundary = Math.floor(ev.t/groupLen + 1e-9) !== Math.floor(prev.t/groupLen + 1e-9);
      var tupEdge  = prev.tup !== ev.tup;
      var contiguous = Math.abs(prev.t + prev.d - ev.t) < 1e-9;
      /* 16ths and shorter regroup per beat, not per half-bar */
      if(ev.di >= 4){
        boundary = Math.floor(ev.t/beat + 1e-9) !== Math.floor(prev.t/beat + 1e-9);
      }
      if(boundary || tupEdge || !contiguous) flush();
    }
    cur.push(i);
  }
  flush();
  return groups;
}

/* ==========================================================================
   PITCH -> STAFF POSITION
   ========================================================================== */
function stepY(step, clef){            /* y in staff spaces below the TOP line */
  return (CLEF_TOP[clef] - step) / 2;
}

/* ==========================================================================
   HORIZONTAL SPACING
   ========================================================================== */
function spaceFor(d){
  var u = Math.log(d/(1/64)) / Math.LN2;
  return LC.noteMin + LC.noteK * Math.max(0, u);
}

/* width (in staff spaces) needed by one bar for a set of staves */
function barWidth(staves, p, bar){
  var onsets = {};
  var extra = 0;
  staves.forEach(function(s){
    var vs = flattenMeasure(s.staff, p, bar);
    vs.forEach(function(v){
      v.forEach(function(ev){
        var key = ev.t.toFixed(6);
        onsets[key] = Math.max(onsets[key]||0, 0);
        if(ev.type==='chord'){
          var acc=0;
          ev.notes.forEach(function(nt){ if(nt[3]) acc++; });
          if(acc) onsets[key] = Math.max(onsets[key], LC.accW*acc + 0.3);
        }
        if(ev.dots) onsets[key] = Math.max(onsets[key], LC.dotW*ev.dots);
      });
    });
    var cc = clefChangeAt(s.staff, bar);
    if(cc) extra = Math.max(extra, LC.clefW);
  });
  var ks = Object.keys(onsets).map(parseFloat).sort(function(a,b){return a-b;});
  if(!ks.length) return 8 + extra;
  var total = LC.barPad*2 + extra;
  var bd = barDur(p, bar);
  for(var i=0;i<ks.length;i++){
    var next = (i+1 < ks.length) ? ks[i+1] : bd;
    total += spaceFor(Math.max(1/128, next - ks[i])) + (onsets[ks[i].toFixed(6)]||0);
  }
  return total;
}

/* ==========================================================================
   MULTIMEASURE RESTS
   ========================================================================== */
function buildColumns(p, staves, nbars){
  /* column = {bar, count}  count>1 => multirest */
  var cols=[], i=1;
  while(i <= nbars){
    var canRest = staves.length > 0 && staves.every(function(s){ return isBarRest(s.staff, i); });
    if(canRest){
      var j=i;
      while(j+1 <= nbars &&
            staves.every(function(s){ return isBarRest(s.staff, j+1); }) &&
            !staves.some(function(s){ return clefChangeAt(s.staff, j+1); }) &&
            !tsChangeAt(p, j+1)){
        j++;
      }
      if(j > i){ cols.push({bar:i, count:j-i+1}); i = j+1; continue; }
    }
    cols.push({bar:i, count:1});
    i++;
  }
  return cols;
}

/* ==========================================================================
   LAYOUT  (pure function of selection + content width + staff size)
   ========================================================================== */
function layout(p, contentW, SP){
  var staves = scoreStaves(p);
  var guides = guideParts(p);
  var nbars  = p.bars;

  /* Label gutter. Staff labels always use the part's shortName (Sam's spec) so the
     margin stays narrow; guide lanes prefer the long name but fall back to short. */
  var labelFont = SP*1.5, laneFont = SP*1.15;
  var longest = 0;
  staves.forEach(function(s){
    if(!s.first) return;
    longest = Math.max(longest, textW(staffLabel(p.parts[s.part]), labelFont));
  });
  guides.forEach(function(pi){
    var pt = p.parts[pi];
    longest = Math.max(longest, Math.min(textW(pt.display, laneFont),
                                         textW(staffLabel(pt), laneFont) + 4*SP));
  });
  var labelW = (staves.length || guides.length)
    ? Math.max(5*SP, Math.min(contentW*0.24, longest + 1.8*SP)) : 0;
  var availW = Math.max(120, contentW - labelW);

  var cols = buildColumns(p, staves, nbars);

  /* measure natural widths */
  cols.forEach(function(c){
    if(c.count > 1){ c.w = Math.max(9, 7 + Math.log(c.count+1)*2.2); }
    else c.w = barWidth(staves, p, c.bar);
  });

  /* group columns into systems (the clef/key/time block is reserved up front) */
  var systems=[], cur=[], curW=0, curExtra=0;
  for(var i=0;i<cols.length;i++){
    var c = cols[i];
    if(cur.length === 0){ curExtra = systemStartWidth(p, staves, c.bar, SP); curW = 0; }
    if(cur.length && curExtra + curW + c.w*SP > availW){
      systems.push({cols:cur, w:curW, startExtra:curExtra});
      cur=[]; curExtra = systemStartWidth(p, staves, c.bar, SP); curW = 0;
    }
    cur.push(c); curW += c.w*SP;
  }
  if(cur.length) systems.push({cols:cur, w:curW, startExtra:curExtra});

  /* geometry */
  var staffTops=[], y=0;
  var lastGroup=null;
  staves.forEach(function(s, i){
    if(i>0){
      var prev = staves[i-1];
      y += LC.staffH*SP;
      if(prev.part === s.part) y += LC.staffGap*SP*0.85;         /* grand staff */
      else if(prev.group === s.group) y += LC.staffGap*SP;
      else y += (LC.staffGap+LC.groupGap)*SP;
    }
    staffTops.push(y);
  });
  var staffBlockH = staves.length ? (staffTops[staffTops.length-1] + LC.staffH*SP) : 0;

  var laneH = guides.length ? (LC.laneTop*SP + guides.length*(LC.laneH+LC.laneGap)*SP) : 0;

  /* Vertical extent of the notation actually drawn in a system, in root-group
     coordinates (0 = top staff line of the first staff). Notes above/below the
     staves, their stems/beams/ties and the bar-number and multirest-count labels
     all live outside the staff rectangle, so system bounds must follow content
     rather than the staff block, or they get sliced. */
  function contentExtent(sys){
    var minY = 0, maxY = staffBlockH;
    sys.cols.forEach(function(c){
      if(c.count > 1) return;                       /* multirest: labels only */
      staves.forEach(function(s, si){
        var top = staffTops[si];
        var clef = clefAt(s.staff, c.bar);
        var vs = flattenMeasure(s.staff, p, c.bar);
        vs.forEach(function(v){
          v.forEach(function(ev){
            if(ev.type !== 'chord') return;
            ev.notes.forEach(function(n){
              var y = top + stepY(n[0], clef)*SP;
              if(y < minY) minY = y;
              if(y > maxY) maxY = y;
            });
          });
        });
      });
    });
    /* headroom/footroom for stems, beams, ties, ledger lines and articulations */
    var pad = 4.2*SP;
    return {min: minY - pad, max: maxY + pad};
  }

  systems.forEach(function(sys, i){
    sys.index = i;
    var ext = contentExtent(sys);
    /* space above the top staff line: notation overflow, or the bar number /
       multirest count, whichever needs more */
    sys.topPad = Math.max(LC.barnumH*SP, 2.9*SP, -ext.min);
    var bottomOverflow = Math.max(0, ext.max - staffBlockH);
    sys.bottomOverflow = bottomOverflow;
    sys.height = sys.topPad + staffBlockH + bottomOverflow + laneH + LC.systemGap*SP;
    /* justify: distribute slack across columns */
    var natural = sys.cols.reduce(function(a,c){ return a + c.w*SP; }, 0);
    var target = availW - sys.startExtra;
    var isLast = (i === systems.length-1);
    var scale = natural > 0 ? target/natural : 1;
    if(isLast && scale > 1.35) scale = Math.min(scale, 1.35);
    var x = labelW + sys.startExtra;
    sys.musicStart = x;
    sys.colX = [];
    sys.cols.forEach(function(c){
      var w = c.w*SP*scale;
      sys.colX.push({bar:c.bar, count:c.count, x:x, w:w});
      x += w;
    });
    sys.right = x;
    sys.labelW = labelW;
  });

  return {
    systems: systems, staves: staves, guides: guides,
    staffTops: staffTops, staffBlockH: staffBlockH,
    laneH: laneH, SP: SP, labelW: labelW,
    contentW: contentW, piece: p
  };
}

/* width in px of the clef + key signature (+ time signature) block at a system start */
function systemStartWidth(p, staves, bar, SP){
  if(!staves.length) return 0;
  var w = 0.6 + LC.clefW;
  var maxKey = 0;
  staves.forEach(function(s){ maxKey = Math.max(maxKey, Math.abs(s.staff.key)); });
  w += maxKey * LC.keyStep + (maxKey ? 0.5 : 0);
  if(bar === 1 || tsChangeAt(p, bar)) w += LC.timeW;
  return w * SP;
}

/* staff margin label: the part's shortName from the mscx, on every system */
function staffLabel(part){
  return (part.short && part.short.trim()) ? part.short.trim() : part.display;
}

/* rough text width without touching the DOM (labels are short) */
var _measCanvas = null;
function textW(str, px){
  if(!str) return 0;
  if(!_measCanvas){
    var c = document.createElement('canvas');
    _measCanvas = c.getContext('2d');
  }
  _measCanvas.font = 'italic ' + px + 'px "Observer Text Italic", Georgia, serif';
  return _measCanvas.measureText(str).width;
}

/* ==========================================================================
   RENDERING
   ========================================================================== */
function glyph(name, x, y, SP, fill, opacity){
  var g = GL.g[name];
  if(!g) return null;
  var s = SP/GSCALE_DEN;
  return el('path', {
    d: g.d, fill: fill||'#000', opacity: opacity||null,
    transform: 'translate('+r2(x)+','+r2(y)+') scale('+r4(s)+','+r4(-s)+')'
  });
}
function glyphW(name, SP){
  var g = GL.g[name];
  return g ? g.w * SP/GSCALE_DEN : 0;
}
var chordSeq = 0;
function r2(v){ return Math.round(v*100)/100; }
function r4(v){ return Math.round(v*10000)/10000; }
function col(i){ return D.palette[i] || '#000'; }

function renderSystem(L, sys){
  var p = L.piece, SP = L.SP;
  var W = L.contentW, H = sys.height;
  var svg = el('svg', {
    viewBox:'0 0 '+r2(W)+' '+r2(H)+'', width:'100%',
    preserveAspectRatio:'xMinYMin meet',
    'shape-rendering':'geometricPrecision'
  });
  var root = el('g', {transform:'translate(0,'+r2(sys.topPad)+')'});
  svg.appendChild(root);

  var ties = [];      /* collected note anchors for tie drawing */
  var noteIndex = {}; /* key -> {x,y,step} for tie resolution */

  /* ---- staff lines + left furniture */
  L.staves.forEach(function(s, si){
    var top = L.staffTops[si];
    var x0 = L.labelW, x1 = sys.right;
    for(var k=0;k<5;k++){
      root.appendChild(el('line', {
        x1:r2(x0), y1:r2(top+k*SP), x2:r2(x1), y2:r2(top+k*SP),
        stroke:'#000', 'stroke-width':r2(Math.max(0.7, SP*0.11))
      }));
    }
    /* part label */
    var part = p.parts[s.part];
    if(s.first){
      var label = staffLabel(part);   /* shortName on every system, incl. the first */
      var t = el('text', {
        x:r2(L.labelW - 0.9*SP), y:r2(top + (s.nst>1 ? LC.staffH*SP*0.5 + (LC.staffH*SP+LC.staffGap*SP*0.85)*0.5 : LC.staffH*SP*0.5) + SP*0.35),
        'text-anchor':'end', 'font-family':'Observer Text Italic, Georgia, serif',
        'font-style':'italic', 'font-size':r2(SP*1.5), fill:'#111'
      });
      t.textContent = label;
      root.appendChild(t);
    }
  });

  /* group brackets + harp braces + barline spans */
  drawBrackets(root, L, sys, SP);

  /* ---- per-staff clef / key / time in the reserved start block */
  var startX = L.labelW + 0.6*SP;
  var ts0 = (sys.cols[0].bar === 1) ? tsAt(p,1) : tsChangeAt(p, sys.cols[0].bar);
  var tsX = sys.musicStart - (ts0 ? LC.timeW*SP : 0);
  L.staves.forEach(function(s, si){
    var top = L.staffTops[si];
    var bar = sys.cols[0].bar;
    var clef = clefAt(s.staff, bar);
    var x = startX;
    var cg = CLEF_GLYPH[clef] || 'gClef';
    root.appendChild(glyph(cg, x, top + CLEF_ANCHOR[clef]*SP, SP, '#000'));
    x += glyphW(cg, SP) + 0.5*SP;
    drawKeySig(root, x, top, s.staff.key, clef, SP);
    if(ts0) drawTimeSig(root, tsX, top, ts0, SP);
  });

  /* ---- bar number */
  var bn = el('text', {
    x:r2(sys.colX[0].x), y:r2(-0.6*SP),
    'font-family':'Observer Text Italic, Georgia, serif', 'font-style':'italic',
    'font-size':r2(SP*1.3), fill:'#666'
  });
  bn.textContent = String(sys.cols[0].bar);
  root.appendChild(bn);

  /* ---- columns */
  sys.colX.forEach(function(cx, ci){
    if(cx.count > 1){
      drawMultirest(root, L, cx, SP);
    } else {
      L.staves.forEach(function(s, si){
        drawMeasure(root, L, s, si, cx, SP, noteIndex, ties, sys);
      });
    }
    /* barline at the right edge of the column */
    drawBarlines(root, L, cx.x + cx.w, SP, ci === sys.colX.length-1 &&
                 sys.index === L.systems.length-1);
  });
  /* opening barline */
  drawBarlines(root, L, sys.colX[0].x, SP, false, true);

  /* ---- ties */
  drawTies(root, ties, noteIndex, sys, L, SP);

  /* ---- guide lanes */
  drawLanes(root, L, sys, SP);

  /* ---- annotation layer (always last, so it sits on top) */
  var ann = el('g', {'class':'annot'});
  root.appendChild(ann);
  drawAnnotations(ann, L, sys.index, SP);
  svg._annotG = ann;
  svg._sysIdx = sys.index;
  svg._layout = L;

  return svg;
}

/* ---------------------------------------------------------------- furniture */
function drawBrackets(root, L, sys, SP){
  var p = L.piece;
  /* group runs */
  var runs=[], cur=null;
  L.staves.forEach(function(s, i){
    if(cur && cur.group === s.group){ cur.end = i; }
    else { cur = {group:s.group, start:i, end:i}; runs.push(cur); }
  });
  runs.forEach(function(run){
    if(run.end === run.start && L.staves[run.start].nst === 1) return;
    var y0 = L.staffTops[run.start], y1 = L.staffTops[run.end] + LC.staffH*SP;
    var x = L.labelW - 0.35*SP;
    root.appendChild(el('path', {
      d:'M '+r2(x)+' '+r2(y0)+' L '+r2(x)+' '+r2(y1),
      stroke:'#000', 'stroke-width':r2(SP*0.28), fill:'none'
    }));
    [y0, y1].forEach(function(yy){
      root.appendChild(el('path', {
        d:'M '+r2(x-SP*0.14)+' '+r2(yy)+' L '+r2(x+SP*0.7)+' '+r2(yy),
        stroke:'#000', 'stroke-width':r2(SP*0.28)
      }));
    });
  });
  /* harp braces (multi-staff parts) */
  var i=0;
  while(i < L.staves.length){
    var s = L.staves[i];
    if(s.nst > 1 && s.first){
      var j = i + s.nst - 1;
      var y0 = L.staffTops[i], y1 = L.staffTops[Math.min(j, L.staffTops.length-1)] + LC.staffH*SP;
      var bg = GL.g['brace'];
      if(bg){
        var hgt = y1 - y0;
        var sx = SP/GSCALE_DEN, sy = hgt / (bg.b[3] - bg.b[1]) ;
        root.appendChild(el('path', {
          d:bg.d, fill:'#000',
          transform:'translate('+r2(L.labelW - 1.2*SP)+','+r2(y1)+') scale('+r4(sx*1.0)+','+r4(-sy)+')'
        }));
      }
      i = j+1;
    } else i++;
  }
}

function drawBarlines(root, L, x, SP, isFinal, isOpening){
  var runs=[], cur=null;
  L.staves.forEach(function(s, i){
    if(cur && cur.group === s.group){ cur.end = i; }
    else { cur = {group:s.group, start:i, end:i}; runs.push(cur); }
  });
  runs.forEach(function(run){
    var y0 = L.staffTops[run.start], y1 = L.staffTops[run.end] + LC.staffH*SP;
    if(isOpening && run.start === run.end && L.staves.length===1) return;
    if(isFinal){
      root.appendChild(el('line',{x1:r2(x-SP*0.55),y1:r2(y0),x2:r2(x-SP*0.55),y2:r2(y1),
        stroke:'#000','stroke-width':r2(SP*0.12)}));
      root.appendChild(el('line',{x1:r2(x-SP*0.14),y1:r2(y0),x2:r2(x-SP*0.14),y2:r2(y1),
        stroke:'#000','stroke-width':r2(SP*0.42)}));
    } else {
      root.appendChild(el('line',{x1:r2(x),y1:r2(y0),x2:r2(x),y2:r2(y1),
        stroke:'#000','stroke-width':r2(SP*0.12)}));
    }
  });
}

function drawKeySig(root, x, top, key, clef, SP){
  if(!key) return x;
  var gname = key > 0 ? 'accidentalSharp' : 'accidentalFlat';
  keySigSteps(key, clef).forEach(function(st){
    root.appendChild(glyph(gname, x, top + stepY(st, clef)*SP, SP, '#000'));
    x += LC.keyStep*SP;
  });
  return x + 0.5*SP;
}

function drawTimeSig(root, x, top, ts, SP){
  var num = String(ts[0]), den = String(ts[1]);
  function digits(str, cy){
    var w = 0;
    for(var i=0;i<str.length;i++) w += glyphW('timeSig'+str[i], SP);
    var xx = x + (LC.timeW*SP - w)/2 - 0.4*SP;
    for(var j=0;j<str.length;j++){
      root.appendChild(glyph('timeSig'+str[j], xx, cy, SP, '#000'));
      xx += glyphW('timeSig'+str[j], SP);
    }
  }
  digits(num, top + 1*SP);
  digits(den, top + 3*SP);
}

function drawMultirest(root, L, cx, SP){
  var x0 = cx.x + SP*1.1, x1 = cx.x + cx.w - SP*1.1;
  L.staves.forEach(function(s, si){
    var top = L.staffTops[si], mid = top + 2*SP;
    root.appendChild(el('rect', {
      x:r2(x0), y:r2(mid - SP*0.42), width:r2(Math.max(2, x1-x0)), height:r2(SP*0.84), fill:'#000'
    }));
    [x0, x1].forEach(function(xx){
      root.appendChild(el('line', {x1:r2(xx), y1:r2(mid - SP*1.05), x2:r2(xx), y2:r2(mid + SP*1.05),
        stroke:'#000', 'stroke-width':r2(SP*0.16)}));
    });
    var t = el('text', {x:r2((x0+x1)/2), y:r2(top - SP*0.9), 'text-anchor':'middle',
      'font-family':'Observer Text Italic, Georgia, serif', 'font-style':'italic',
      'font-size':r2(SP*1.7), fill:'#000'});
    t.textContent = String(cx.count);
    root.appendChild(t);
  });
}

/* ---------------------------------------------------------------- measure */
function drawMeasure(root, L, s, si, cx, SP, noteIndex, ties, sys){
  var p = L.piece, top = L.staffTops[si], bar = cx.bar;
  var voices = flattenMeasure(s.staff, p, bar);
  var clef = clefAt(s.staff, bar);
  var bd = barDur(p, bar);

  /* mid-measure clef change drawn at the measure start */
  var cc = clefChangeAt(s.staff, bar);
  var xPad = LC.barPad*SP;
  if(cc && bar !== sys.cols[0].bar){
    var cg = CLEF_GLYPH[cc] || 'gClef';
    var g = glyph(cg, cx.x + 0.35*SP, top + CLEF_ANCHOR[cc]*SP, SP*0.78, '#000');
    if(g) root.appendChild(g);
    xPad += glyphW(cg, SP*0.78) + 0.35*SP;
  }

  var innerW = cx.w - xPad - LC.barPad*SP;
  function xAt(t){ return cx.x + xPad + (bd>0 ? (t/bd)*innerW : 0); }

  voices.forEach(function(voice, vi){
    var stemUp = voices.length > 1 ? (vi === 0) : null;
    var groups = beamGroups(voice, p, bar);
    var inBeam = {};
    groups.forEach(function(g, gi){ g.forEach(function(idx){ inBeam[idx] = gi; }); });

    voice.forEach(function(ev, idx){
      var x = xAt(ev.t);
      if(ev.type === 'mrest'){
        var rw = glyphW('restWhole', SP);
        root.appendChild(glyph('restWhole', cx.x + cx.w/2 - rw/2, top + 1*SP, SP, '#000'));
        return;
      }
      if(ev.type === 'rest'){
        var rn = ['restWhole','restHalf','restQuarter','rest8th','rest16th','rest32nd','rest64th','rest128th'][ev.di] || 'restQuarter';
        var ry = top + 2*SP + (voices.length>1 ? (vi===0 ? -1*SP : 1*SP) : 0);
        if(ev.di===0) ry = top + 1*SP;
        if(ev.di===1) ry = top + 2*SP;
        root.appendChild(glyph(rn, x, ry, SP, '#000'));
        for(var dd=0; dd<ev.dots; dd++){
          root.appendChild(glyph('augmentationDot', x + glyphW(rn,SP) + (0.25+dd*0.45)*SP, ry - 0.5*SP, SP, '#000'));
        }
        return;
      }
      /* ---- chord */
      drawChord(root, L, s, si, ev, idx, x, top, clef, SP, stemUp, inBeam[idx]!=null,
                noteIndex, ties, bar, vi, sys, cx, isBW(p, s.part));
    });

    /* beams */
    groups.forEach(function(g){
      drawBeam(root, L, voice, g, xAt, top, clef, SP, stemUp, isBW(p, s.part));
    });

    /* tuplet brackets for unbeamed tuplets */
    drawTuplets(root, voice, groups, xAt, top, SP, stemUp);
  });
}

function noteX(x, SP){ return x; }

function drawChord(root, L, s, si, ev, idx, x, top, clef, SP, stemUpHint, beamed,
                   noteIndex, ties, bar, vi, sys, cx, bw){
  var notes = ev.notes.slice().sort(function(a,b){ return a[0]-b[0]; });
  ev._chordId = 'c' + (chordSeq++);
  var headName = ev.di===0 ? 'noteheadWhole' : (ev.di===1 ? 'noteheadHalf' : 'noteheadBlack');
  var hw = glyphW(headName, SP);

  /* stem direction */
  var avg = notes.reduce(function(a,n){ return a+n[0]; },0)/notes.length;
  var midStep = CLEF_TOP[clef] - 4;
  var up = (stemUpHint!=null) ? stemUpHint : (avg < midStep);

  /* accidentals first (left of the heads) */
  var accX = x;
  var accCount = notes.filter(function(n){ return n[3]; }).length;
  if(accCount){
    var ax = x - 0.35*SP;
    for(var i=notes.length-1;i>=0;i--){
      var n = notes[i];
      if(!n[3]) continue;
      var gname = ACCG[n[3]];
      var w = glyphW(gname, SP);
      ax -= w + 0.12*SP;
      root.appendChild(glyph(gname, ax, top + stepY(n[0], clef)*SP, SP, '#000'));
    }
  }

  /* seconds offsetting */
  var offs = [];
  for(var i=0;i<notes.length;i++){
    var o = 0;
    if(i>0 && Math.abs(notes[i][0]-notes[i-1][0])===1 && offs[i-1]===0) o = up ? 1 : -1;
    offs.push(o);
  }

  var minY=1e9, maxY=-1e9, headXs=[];
  notes.forEach(function(n, i){
    var y = top + stepY(n[0], clef)*SP;
    var hx = x + offs[i]*hw;
    headXs.push(hx);
    minY = Math.min(minY,y); maxY = Math.max(maxY,y);
    var headEl = glyph(headName, hx, y, SP, bw ? '#000000' : col(n[2]));
    if(headEl){
      /* EAR mode reads these; B/W harp heads keep their true colour class */
      headEl.setAttribute('data-snd', soundingMidi(L.piece, s.part, n));
      headEl.setAttribute('data-adj', (D.colourAdj && D.colourAdj[n[2]]) || 0);
      headEl.setAttribute('data-ch', ev._chordId);
      root.appendChild(headEl);
    }
    /* ledger lines */
    drawLedgers(root, hx, y, top, hw, SP);
    /* dots */
    for(var dd=0; dd<ev.dots; dd++){
      var dy = y;
      var stepIdx = (CLEF_TOP[clef]-n[0]);
      if(stepIdx % 2 === 0) dy -= SP*0.5;      /* on a line -> nudge into the space */
      root.appendChild(glyph('augmentationDot', hx + hw + (0.25+dd*0.45)*SP, dy, SP, '#000'));
    }
    /* tie bookkeeping */
    var key = si+'|'+vi+'|'+n[0];
    if(n[4] & 2){
      ties.push({type:'end', key:key, x:hx+hw/2, y:y, up:up, bar:bar});
    }
    if(n[4] & 1){
      ties.push({type:'start', key:key, x:hx+hw/2, y:y, up:up, bar:bar});
    }
  });

  /* stem + flag */
  if(ev.di >= 1 && ev.di !== 8){
    var sx = up ? (x + hw - SP*0.06) : (x + SP*0.06);
    var y0 = up ? minY : maxY;
    var y1 = up ? (minY - LC.stemLen*SP) : (maxY + LC.stemLen*SP);
    /* extend towards the staff middle for far notes */
    var mid = top + 2*SP;
    if(up && y1 > mid) y1 = mid;
    if(!up && y1 < mid) y1 = mid;
    if(up) y1 = Math.min(y1, minY - 2.4*SP); else y1 = Math.max(y1, maxY + 2.4*SP);
    var stemColour = (ev.stemCol && !bw) ? col(ev.stemCol) : '#000';
    root.appendChild(el('line', {x1:r2(sx), y1:r2(up?maxY:minY), x2:r2(sx), y2:r2(y1),
      stroke:stemColour, 'stroke-width':r2(SP*0.13)}));
    ev._stem = {x:sx, y:y1, up:up};
    if(!beamed && ev.di >= 3 && ev.di <= 7){
      var fn = ['flag8th','flag16th','flag32nd','flag64th','flag128th'][ev.di-3] + (up?'Up':'Down');
      var fg = glyph(fn, sx, y1, SP, '#000');
      if(fg) root.appendChild(fg);
    }
  }

  /* staccato */
  if(ev.art){
    var ay = up ? (maxY + 1.4*SP) : (minY - 1.4*SP);
    var an = up ? 'articStaccatoBelow' : 'articStaccatoAbove';
    root.appendChild(glyph(an, x + hw/2 - glyphW(an,SP)/2, ay, SP, '#000'));
  }
}

function drawLedgers(root, hx, y, top, hw, SP){
  var lw = hw*1.36, x0 = hx - (lw-hw)/2;
  var k;
  if(y < top - 0.01){
    for(k = -1; top + k*SP >= y - 0.01; k--){
      if(k % 2 !== 0) continue;
      root.appendChild(el('line',{x1:r2(x0),y1:r2(top+k*SP),x2:r2(x0+lw),y2:r2(top+k*SP),
        stroke:'#000','stroke-width':r2(SP*0.12)}));
    }
  } else if(y > top + 4*SP + 0.01){
    for(k = 5; top + k*SP <= y + 0.01; k++){
      if(k % 2 !== 0) continue;
      root.appendChild(el('line',{x1:r2(x0),y1:r2(top+k*SP),x2:r2(x0+lw),y2:r2(top+k*SP),
        stroke:'#000','stroke-width':r2(SP*0.12)}));
    }
  }
}

function drawBeam(root, L, voice, group, xAt, top, clef, SP, stemUpHint, bw){
  var evs = group.map(function(i){ return voice[i]; });
  if(evs.length < 2) return;
  var avg = 0, n=0;
  evs.forEach(function(e){ e.notes.forEach(function(nt){ avg += nt[0]; n++; }); });
  avg /= n;
  var up = (stemUpHint!=null) ? stemUpHint : (avg < CLEF_TOP[clef]-4);

  var pts = evs.map(function(e){
    var ys = e.notes.map(function(nt){ return top + stepY(nt[0], clef)*SP; });
    var hw = glyphW('noteheadBlack', SP);
    var x = xAt(e.t) + (up ? hw - SP*0.06 : SP*0.06);
    return {x:x, top:Math.min.apply(null,ys), bot:Math.max.apply(null,ys), e:e};
  });
  /* beam line: straight, slight slope */
  var first = pts[0], last = pts[pts.length-1];
  var yF = up ? first.top - 3.1*SP : first.bot + 3.1*SP;
  var yL = up ? last.top  - 3.1*SP : last.bot  + 3.1*SP;
  /* Clamp the beam slope hard: Sam's engraving keeps these near-horizontal even
     under wide arpeggios. Cap total rise at ~1.3 staff spaces and 0.14 px/px. */
  var span = Math.max(1e-6, last.x - first.x);
  var rise = yL - yF;
  var maxRise = Math.min(1.3*SP, span*0.14);
  if(Math.abs(rise) > maxRise){
    var mid = (yF+yL)/2, half = maxRise/2 * (rise > 0 ? 1 : -1);
    yF = mid - half; yL = mid + half;
  }
  var slope = (yL - yF)/span;
  function beamY(x){ return yF + slope*(x-first.x); }
  /* clear the noteheads */
  var adjust = 0;
  pts.forEach(function(pt){
    var need = up ? (pt.top - 2.4*SP) : (pt.bot + 2.4*SP);
    var have = beamY(pt.x);
    if(up && have > need) adjust = Math.min(adjust, need-have);
    if(!up && have < need) adjust = Math.max(adjust, need-have);
  });
  yF += adjust; yL += adjust;

  /* stems to the beam */
  pts.forEach(function(pt){
    var y = beamY(pt.x);
    var col0 = (pt.e.stemCol && !bw) ? col(pt.e.stemCol) : '#000';
    root.appendChild(el('line',{x1:r2(pt.x),y1:r2(up?pt.bot:pt.top),x2:r2(pt.x),y2:r2(y),
      stroke:col0,'stroke-width':r2(SP*0.13)}));
  });

  /* beam bars — black (matches Sam's engraving) */
  var maxLevel = Math.max.apply(null, evs.map(function(e){ return e.di - 2; }));  /* 8th=1 */
  for(var lvl=1; lvl<=maxLevel; lvl++){
    /* contiguous runs at this level */
    var run=null;
    for(var i=0;i<pts.length;i++){
      var has = (evs[i].di - 2) >= lvl;
      if(has){ if(!run) run={a:i,b:i}; else run.b=i; }
      if(!has || i===pts.length-1){
        if(run){
          var a=run.a, b=run.b;
          var xa, xb;
          if(a===b){
            /* partial beam (hook) */
            var dir = (a===0) ? 1 : -1;
            xa = pts[a].x; xb = pts[a].x + dir*SP*1.05;
            if(xb < xa){ var tmp=xa; xa=xb; xb=tmp; }
          } else { xa = pts[a].x; xb = pts[b].x; }
          var off = (lvl-1)*(LC.beamH+LC.beamGap)*SP*(up?1:-1);
          var ya = beamY(xa) + off, yb = beamY(xb) + off;
          var th = LC.beamH*SP;
          root.appendChild(el('path',{
            d:'M '+r2(xa)+' '+r2(ya)+' L '+r2(xb)+' '+r2(yb)+' L '+r2(xb)+' '+r2(yb+th)+
              ' L '+r2(xa)+' '+r2(ya+th)+' Z', fill:'#000'}));
          run=null;
        }
      }
    }
  }
}

function drawTuplets(root, voice, groups, xAt, top, SP, stemUpHint){
  var seen = {};
  voice.forEach(function(ev){
    if(ev.type!=='chord' || ev.tup < 0 || seen[ev.tup]) return;
    seen[ev.tup] = true;
    var members = voice.filter(function(e){ return e.tup === ev.tup; });
    if(!members.length) return;
    var T = D.tuplets[ev.tup];
    var xa = xAt(members[0].t), xb = xAt(members[members.length-1].t) + SP;
    var y = top - 1.6*SP;
    var t = el('text',{x:r2((xa+xb)/2), y:r2(y), 'text-anchor':'middle',
      'font-family':'Georgia, serif','font-style':'italic','font-size':r2(SP*1.35), fill:'#000'});
    t.textContent = String(T[0]);
    root.appendChild(t);
  });
}

/* ---------------------------------------------------------------- ties */
function drawTies(root, ties, noteIndex, sys, L, SP){
  var open = {};
  ties.forEach(function(t){
    if(t.type === 'end'){
      if(open[t.key]){
        var a = open[t.key];
        arc(root, a.x, a.y, t.x, t.y, a.up, SP);
        delete open[t.key];
      } else {
        /* tie continuing from the previous system: stub in from the left */
        arc(root, Math.max(L.labelW, t.x - 2.6*SP), t.y, t.x, t.y, t.up, SP, 'in');
      }
    }
    if(t.type === 'start') open[t.key] = t;
  });
  /* ties running off the end of this system */
  for(var k in open){
    var a = open[k];
    arc(root, a.x, a.y, Math.min(sys.right, a.x + 2.6*SP), a.y, a.up, SP, 'out');
  }
}
function arc(root, x1, y1, x2, y2, up, SP, kind){
  if(x2 - x1 < 0.4*SP) x2 = x1 + 0.4*SP;
  var dir = up ? -1 : 1;
  /* ties sit on the notehead side opposite the stem */
  var lift = dir * SP * 0.95;
  var yo1 = y1 + dir*SP*0.62, yo2 = y2 + dir*SP*0.62;
  var cx1 = x1 + (x2-x1)*0.25, cx2 = x1 + (x2-x1)*0.75;
  var cy = (yo1+yo2)/2 + lift;
  root.appendChild(el('path', {
    d:'M '+r2(x1)+' '+r2(yo1)+' C '+r2(cx1)+' '+r2(cy)+' '+r2(cx2)+' '+r2(cy)+' '+r2(x2)+' '+r2(yo2),
    fill:'none', stroke:'#000', 'stroke-width':r2(SP*0.11), 'stroke-linecap':'round'
  }));
}

/* ---------------------------------------------------------------- lanes */
function drawLanes(root, L, sys, SP){
  if(!L.guides.length) return;
  var p = L.piece;
  var y0 = L.staffBlockH + (sys.bottomOverflow||0) + LC.laneTop*SP;
  var barA = sys.cols[0].bar;
  var lastCol = sys.colX[sys.colX.length-1];
  var barB = lastCol.bar + lastCol.count - 1;

  L.guides.forEach(function(pi, gi){
    var part = p.parts[pi];
    var lane = laneColour(p, pi);
    var y = y0 + gi*(LC.laneH+LC.laneGap)*SP;
    var lab = el('text', {x:r2(L.labelW - 0.9*SP), y:r2(y + SP*0.45), 'text-anchor':'end',
      'font-family':'Observer Text Italic, Georgia, serif','font-style':'italic',
      'font-size':r2(SP*1.15), fill:'#555'});
    lab.textContent = (textW(part.display, SP*1.15) <= L.labelW - 1.2*SP)
      ? part.display : staffLabel(part);
    root.appendChild(lab);

    function xOfBar(b, end){
      for(var i=0;i<sys.colX.length;i++){
        var c = sys.colX[i];
        if(b >= c.bar && b <= c.bar + c.count - 1){
          if(c.count > 1){
            var f = (b - c.bar + (end?1:0)) / c.count;
            return c.x + c.w*f;
          }
          return end ? c.x + c.w : c.x;
        }
      }
      return end ? sys.right : sys.colX[0].x;
    }

    part.act.forEach(function(span){
      var a = Math.max(span[0], barA), b = Math.min(span[1], barB);
      if(a > b) return;
      var xa = xOfBar(a, false), xb = xOfBar(b, true);
      root.appendChild(el('line',{x1:r2(xa),y1:r2(y),x2:r2(xb),y2:r2(y),
        stroke:lane,'stroke-width':r2(SP*0.34),'stroke-linecap':'round'}));
      if(span[0] >= barA && span[0] <= barB){
        root.appendChild(el('line',{x1:r2(xa),y1:r2(y-SP*0.6),x2:r2(xa),y2:r2(y+SP*0.6),
          stroke:lane,'stroke-width':r2(SP*0.2)}));
        var t = el('text',{x:r2(xa+SP*0.25),y:r2(y-SP*0.85),
          'font-family':'Observer Text Italic, Georgia, serif','font-style':'italic',
          'font-size':r2(SP*1.05), fill:lane});
        t.textContent='b. '+span[0];
        root.appendChild(t);
      }
      if(span[1] >= barA && span[1] <= barB){
        root.appendChild(el('line',{x1:r2(xb),y1:r2(y-SP*0.5),x2:r2(xb),y2:r2(y+SP*0.5),
          stroke:lane,'stroke-width':r2(SP*0.2)}));
      }
    });
  });
}

/* sounding (concert) MIDI for a note of a given part — never the written pitch */
function soundingMidi(p, partIdx, note){
  var step = note[0], alter = note[1];
  var oct = Math.floor(step/7), letter = ((step % 7) + 7) % 7;
  var written = (oct+1)*12 + SEMIS[letter] + alter;
  return written + (p.parts[partIdx].transC || 0);
}

/* ==========================================================================
   EAR TRAINER — mirrors eartrainer.html's synthesis exactly.
   freq = 440 * 2^((m-69)/12) * 2^(adj/1200), m = SOUNDING midi,
   adj from the note's MacroColour class (Red 0, Yellow +25, Green -50, Blue -25).
   ========================================================================== */
var earCtx = null, earVoices = [];
function earFreq(midi, adj){
  return 440 * Math.pow(2, (midi - 69)/12) * Math.pow(2, (adj||0)/1200);
}
function earAC(){
  if(!earCtx){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    earCtx = new C();
  }
  if(earCtx.state === 'suspended') earCtx.resume();
  return earCtx;
}
function earFadeOut(fade){
  var c = earCtx; if(!c) return;
  var now = c.currentTime;
  earVoices.forEach(function(g){
    try{
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(0, now + (fade||0.06));
    }catch(e){}
  });
  earVoices = [];
}
/* clone of eartrainer's mkOsc: sine, 0 -> vol linear attack, hold, linear release */
function earOsc(freq, startT, dur, vol, fade){
  var c = earAC(); if(!c) return null;
  var osc = c.createOscillator(), g = c.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, startT);
  g.gain.linearRampToValueAtTime(vol, startT + fade);
  g.gain.setValueAtTime(vol, startT + dur - 0.08);
  g.gain.linearRampToValueAtTime(0, startT + dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(startT); osc.stop(startT + dur + 0.05);
  earVoices.push(g);
  return g;
}
/* play every notehead of one chord together */
function earPlay(notes){
  var c = earAC(); if(!c) return;
  earFadeOut(0.06);
  var t = c.currentTime + 0.01;
  notes.forEach(function(n){ earOsc(earFreq(n.midi, n.adj), t, 2.6, 0.2, 0.06); });
}
function earFlash(el){
  if(!el) return;
  var old = el.getAttribute('opacity');
  el.setAttribute('opacity', '0.35');
  setTimeout(function(){
    if(old == null) el.removeAttribute('opacity'); else el.setAttribute('opacity', old);
  }, 260);
}

/* ==========================================================================
   ANNOTATION LAYER — strokes stored in musical coordinates so they survive
   every relayout (zoom, orientation, repagination, perform mode, selection).
   stroke = {c: colour, w: base width, p: [[staffId, bar, frac, ys, pressure], ...]}
   ========================================================================== */
var ANN_COLORS = ['#111111', '#c0392b', '#2f57c9', '#2e8b57'];
var ann = {
  mode: '',                 /* '' | 'draw' | 'text' | 'ear' | 'stamp' (mutually exclusive) */
  on: false,                /* alias: draw mode active */
  erasing: false, visible: true,
  colour: '#111111', width: 1, textSize: 2,
  stamp: 'mf',              /* selected palette entry while in STAMP mode */
  selId: null,              /* stamp selected by tap: shows its drag handles */
  undo: {}, redo: {}
};

/* ==========================================================================
   STAMP PALETTE
   Glyph stamps are engraved with the SAME transform the score itself uses
   (glyph(): scale SP/GSCALE_DEN, i.e. 250 font units per staff space), so a
   stamped forte is the identical size and weight the engraver would print.
   At that natural SMuFL size Leland's dynamics stand 1.70 sp (p) to 2.47 sp
   (ff) tall - the "about two staff spaces" of published practice - so no
   correction factor is applied. Hairpins are line pairs, not glyphs.
   ========================================================================== */
var HAIRPIN_LEN = 6;      /* default length, staff spaces (brief) */
var HAIRPIN_AP  = 0.55;   /* half-aperture at the open end, staff spaces */
/* SMuFL engravingDefaults hairpinThickness; deliberately a shade heavier than
   the staff lines (SP*0.11), which is what Behind Bars asks for. */
var HAIRPIN_W   = 0.16;

var STAMPS = [
  {k:'pp',      gl:'dynamicPP',        t:'pp'},
  {k:'p',       gl:'dynamicPiano',     t:'p'},
  {k:'mp',      gl:'dynamicMP',        t:'mp'},
  {k:'mf',      gl:'dynamicMF',        t:'mf'},
  {k:'f',       gl:'dynamicForte',     t:'f'},
  {k:'ff',      gl:'dynamicFF',        t:'ff'},
  {k:'cresc',   hp: 1,                 t:'cresc.'},
  {k:'dim',     hp:-1,                 t:'dim.'},
  {k:'breath',  gl:'breathMarkComma',  t:'breath'},
  {k:'caesura', gl:'caesura',          t:'caesura'},
  {k:'fermata', gl:'fermataAbove',     t:'fermata'},
  {k:'accent',  gl:'articAccentAbove', t:'accent'},
  {k:'tenuto',  gl:'articTenutoAbove', t:'tenuto'}
];
function stampSpec(k){
  for(var i=0;i<STAMPS.length;i++) if(STAMPS[i].k === k) return STAMPS[i];
  return null;
}

/* Stable per-item ids. Needed so a markings file can be imported without
   duplicating what is already on the layer; assigned at creation and
   back-filled onto older stored items when they load. */
var _annSeq = 0;
function annId(){
  return 'i' + Date.now().toString(36) + (_annSeq++).toString(36) +
         Math.random().toString(36).slice(2, 6);
}

function modeIs(m){ return ann.mode === m; }
/* every annotation mode suspends performance-mode tap page-turns */
function tapSuspended(){
  return ann.mode === 'draw' || ann.mode === 'text' ||
         ann.mode === 'ear'  || ann.mode === 'stamp';
}
function annList(){
  var id = piece().id;
  if(!state.annots[id]) state.annots[id] = [];
  return state.annots[id];
}
function annPush(stroke){
  var id = piece().id;
  if(stroke && !stroke.id) stroke.id = annId();
  annList().push(stroke);
  (ann.undo[id] = ann.undo[id] || []).push({t:'add'});
  ann.redo[id] = [];
  saveAnnots();
}
/* Add many items as ONE undoable action (markings import). */
function annPushMany(items){
  if(!items || !items.length) return 0;
  var id = piece().id, list = annList();
  items.forEach(function(it){ if(!it.id) it.id = annId(); list.push(it); });
  (ann.undo[id] = ann.undo[id] || []).push({t:'addN', n:items.length});
  ann.redo[id] = [];
  saveAnnots();
  return items.length;
}
/* Record a stamp's geometry before a drag so the move can be undone. The op is
   a SWAP, which makes it its own inverse: undo and redo share one branch. */
function annGeoOp(idx){
  var it = annList()[idx];
  if(!it) return null;
  return {t:'geo', i:idx, a:it.a.slice(), o:it.o ? JSON.parse(JSON.stringify(it.o)) : null};
}
function annPushGeo(op){
  if(!op) return;
  var id = piece().id;
  (ann.undo[id] = ann.undo[id] || []).push(op);
  ann.redo[id] = [];
  saveAnnots();
}
function applyGeo(list, op){
  var it = list[op.i];
  if(!it) return null;
  var back = {t:'geo', i:op.i, a:it.a.slice(), o:it.o ? JSON.parse(JSON.stringify(it.o)) : null};
  it.a = op.a.slice();
  if(op.o) it.o = JSON.parse(JSON.stringify(op.o)); else delete it.o;
  return back;
}
function annUndo(){
  var id = piece().id, u = ann.undo[id] || [];
  if(!u.length) return;
  var op = u.pop();
  var list = annList();
  if(op.t === 'add'){
    var s = list.pop();
    if(s) (ann.redo[id] = ann.redo[id] || []).push({t:'add', s:s});
  } else if(op.t === 'addN'){
    var back = list.splice(Math.max(0, list.length - op.n), op.n);
    (ann.redo[id] = ann.redo[id] || []).push({t:'addN', items:back});
  } else if(op.t === 'geo'){
    var inv = applyGeo(list, op);
    if(inv) (ann.redo[id] = ann.redo[id] || []).push(inv);
  } else if(op.t === 'del'){
    list.splice(op.i, 0, op.s);
    (ann.redo[id] = ann.redo[id] || []).push({t:'del', i:op.i});
  }
  saveAnnots(); refreshAnnotations();
}
function annRedo(){
  var id = piece().id, r = ann.redo[id] || [];
  if(!r.length) return;
  var op = r.pop();
  var list = annList();
  if(op.t === 'add'){
    if(!op.s) return;
    list.push(op.s);
    (ann.undo[id] = ann.undo[id] || []).push({t:'add'});
  } else if(op.t === 'addN'){
    op.items.forEach(function(it){ list.push(it); });
    (ann.undo[id] = ann.undo[id] || []).push({t:'addN', n:op.items.length});
  } else if(op.t === 'geo'){
    var inv = applyGeo(list, op);
    if(inv) (ann.undo[id] = ann.undo[id] || []).push(inv);
  } else if(op.t === 'del'){
    var s = list.splice(op.i, 1)[0];
    (ann.undo[id] = ann.undo[id] || []).push({t:'del', i:op.i, s:s});
  }
  saveAnnots(); refreshAnnotations();
}
function annErase(idx){
  var id = piece().id, list = annList();
  var s = list.splice(idx, 1)[0];
  (ann.undo[id] = ann.undo[id] || []).push({t:'del', i:idx, s:s});
  ann.redo[id] = [];
  saveAnnots(); refreshAnnotations();
}
function saveAnnots(){
  try{ localStorage.setItem('ensembleAnnots', JSON.stringify(state.annots)); }catch(e){}
}
function loadAnnots(){
  try{
    var a = localStorage.getItem('ensembleAnnots');
    if(a) state.annots = JSON.parse(a) || {};
  }catch(e){}
  /* Items stored before ids existed get one now, so markings exchange can tell
     them apart from an incoming file's items. */
  var changed = false;
  for(var pid in state.annots){
    var list = state.annots[pid];
    if(!list || !list.length) continue;
    list.forEach(function(it){ if(it && !it.id){ it.id = annId(); changed = true; } });
  }
  if(changed) saveAnnots();
}

/* Midpoint-quadratic chaining: draws a smooth curve through the sample points
   instead of a point-to-point polyline (which reads as kinked zigzags). */
function smoothPath(pts){
  if(!pts.length) return '';
  if(pts.length === 1) return 'M '+r2(pts[0].x)+' '+r2(pts[0].y);
  if(pts.length === 2)
    return 'M '+r2(pts[0].x)+' '+r2(pts[0].y)+' L '+r2(pts[1].x)+' '+r2(pts[1].y);
  var d = 'M '+r2(pts[0].x)+' '+r2(pts[0].y);
  for(var i=1;i<pts.length-1;i++){
    var mx = (pts[i].x + pts[i+1].x)/2, my = (pts[i].y + pts[i+1].y)/2;
    d += ' Q '+r2(pts[i].x)+' '+r2(pts[i].y)+' '+r2(mx)+' '+r2(my);
  }
  d += ' L '+r2(pts[pts.length-1].x)+' '+r2(pts[pts.length-1].y);
  return d;
}

/* ---- stamp geometry, shared by the renderer, the eraser and the exports ----
   A glyph stamp is CENTRED on its anchor: the reader taps where they want the
   symbol to sit, not where its baseline origin happens to be. */
function stampBox(item, SP){
  var gd = GL.g[item.gl];
  if(!gd) return null;
  var s = SP/GSCALE_DEN * (item.s || 1);
  var b = gd.b;
  return {
    gd: gd, s: s,
    cx: (b[0]+b[2])/2, cy: (b[1]+b[3])/2,     /* bbox centre, font units, y-up */
    w: (b[2]-b[0]) * s, h: (b[3]-b[1]) * s    /* on-screen size */
  };
}
function stampNode(item, base, SP){
  var m = stampBox(item, SP);
  if(!m) return null;
  /* place the bbox centre on the anchor; the -s on y flips font y-up to SVG */
  return el('path', {
    d: m.gd.d, fill: item.c,
    transform: 'translate('+r2(base.x - m.cx*m.s)+','+r2(base.y + m.cy*m.s)+')'+
               ' scale('+r4(m.s)+','+r4(-m.s)+')'
  });
}
/* endpoints (p1,p2), apex and the two open-end corners of a hairpin */
function hairpinGeom(item, base, SP){
  var o = (item.o && item.o.length > 1) ? item.o : [[0,0],[HAIRPIN_LEN,0]];
  var p1 = {x: base.x + o[0][0]*SP, y: base.y + o[0][1]*SP};
  var p2 = {x: base.x + o[1][0]*SP, y: base.y + o[1][1]*SP};
  var ap = (item.ap == null ? HAIRPIN_AP : item.ap) * SP;
  var dx = p2.x - p1.x, dy = p2.y - p1.y;
  var len = Math.sqrt(dx*dx + dy*dy) || 1;
  var nx = -dy/len, ny = dx/len;               /* unit normal: the opening is
                                                  square to the axis at any slope */
  var apex = (item.hp > 0) ? p1 : p2;          /* cresc closes left, dim closes right */
  var open = (item.hp > 0) ? p2 : p1;
  return {
    p1:p1, p2:p2, apex:apex,
    b1:{x: open.x + nx*ap, y: open.y + ny*ap},
    b2:{x: open.x - nx*ap, y: open.y - ny*ap}
  };
}
/* distance from a point to the hairpin's axis, for hit-testing */
function segDist(px, py, a, b){
  var dx = b.x-a.x, dy = b.y-a.y;
  var l2 = dx*dx + dy*dy;
  var t = l2 ? ((px-a.x)*dx + (py-a.y)*dy)/l2 : 0;
  t = Math.max(0, Math.min(1, t));
  var qx = a.x + t*dx, qy = a.y + t*dy;
  return Math.sqrt((px-qx)*(px-qx) + (py-qy)*(py-qy));
}
function isStamp(it){ return !!(it && (it.gl || it.hp)); }
/* does a point land on this stamp? used by the eraser and by tap-to-select */
function stampHit(it, L, sysIdx, xy){
  var base = pointFor(L, sysIdx, it.a);
  if(!base) return false;
  var SP = L.SP;
  if(it.hp){
    var hp = hairpinGeom(it, base, SP);
    return segDist(xy.x, xy.y, hp.p1, hp.p2) < Math.max(2, 0.9*SP);
  }
  var m = stampBox(it, SP);
  if(!m) return false;
  var padX = Math.max(2, 0.35*SP), padY = Math.max(2, 0.35*SP);
  return Math.abs(xy.x - base.x) < m.w/2 + padX &&
         Math.abs(xy.y - base.y) < m.h/2 + padY;
}

/* Put the selected palette symbol on the paper. Stamps are ordinary annotation
   items - same anchor, same undo stack, same persistence as ink and text. */
function placeStamp(svg, a){
  var spec = stampSpec(ann.stamp);
  if(!spec) return null;
  var it = {c:ann.colour, a:a, sp:svg._layout.SP};
  if(spec.gl) it.gl = spec.gl;
  else { it.hp = spec.hp; it.o = [[0,0],[HAIRPIN_LEN,0]]; }
  annPush(it);
  /* a fresh hairpin shows its handles at once, so it can be sized immediately */
  ann.selId = it.hp ? it.id : null;
  refreshAnnotations();
  return it;
}

/* paint one system's strokes into a <g> */
function drawAnnotations(g, L, sysIdx, SP){
  while(g.firstChild) g.removeChild(g.firstChild);
  if(!ann.visible){ markInkOwners(g); return; }
  var list = state.annots[L.piece.id] || [];
  var scale = SP/7.2;                       /* ink weight tracks zoom */
  list.forEach(function(item, si){
    if(!item) return;                       /* defensive: never break a system */
    if(!item.a) return;                     /* un-migrated: skip until migrated */

    /* RIGID PLACEMENT. The item owns ONE anchor. Everything else is a fixed
       offset in staff-space units, so relayout can only translate and uniformly
       scale it - never stretch or shear it. A circle stays a circle. */
    var base = pointFor(L, sysIdx, item.a);
    if(!base) return;                       /* wrong system, hidden staff, or multirest */

    if(item.txt != null){
      var t = el('text', {
        x:r2(base.x), y:r2(base.y), fill:item.c,
        'font-family':'Observer Text Italic, Georgia, serif', 'font-style':'italic',
        'font-size':r2((item.s || 2) * SP)
      });
      t.textContent = item.txt;
      t.dataset.stroke = si;
      t.dataset.text = '1';
      g.appendChild(t);
      return;
    }

    /* ---- STAMP: a music glyph, engraved at the score's own scale ---- */
    if(item.gl){
      var node = stampNode(item, base, SP);
      if(!node) return;
      node.dataset.stroke = si;
      node.dataset.stamp = '1';
      g.appendChild(node);
      return;
    }

    /* ---- STAMP: hairpin, a line pair with two draggable ends ---- */
    if(item.hp){
      var hp = hairpinGeom(item, base, SP);
      var line = el('path', {
        d:'M '+r2(hp.b1.x)+' '+r2(hp.b1.y)+' L '+r2(hp.apex.x)+' '+r2(hp.apex.y)+
          ' L '+r2(hp.b2.x)+' '+r2(hp.b2.y),
        fill:'none', stroke:item.c, 'stroke-width':r2(Math.max(0.5, SP*HAIRPIN_W)),
        'stroke-linecap':'round', 'stroke-linejoin':'round'
      });
      line.dataset.stroke = si;
      line.dataset.stamp = '1';
      g.appendChild(line);
      /* handles only while STAMP mode is live and this hairpin is selected */
      if(ann.mode === 'stamp' && ann.selId && ann.selId === item.id){
        [hp.p1, hp.p2].forEach(function(pt, hi){
          var hnd = el('circle', {cx:r2(pt.x), cy:r2(pt.y), r:r2(Math.max(3, SP*0.5)),
            fill:'#fff', stroke:'#2e8b57', 'stroke-width':r2(Math.max(1, SP*0.14))});
          hnd.dataset.stroke = si;
          hnd.dataset.handle = hi;
          g.appendChild(hnd);
        });
      }
      return;
    }

    if(!item.o || item.o.length < 1) return;

    var pts = item.o.map(function(o){
      return {x: base.x + o[0]*SP, y: base.y + o[1]*SP, pr: o[2]==null?0.5:o[2]};
    });
    if(pts.length === 1) pts.push({x:pts[0].x+0.6, y:pts[0].y, pr:pts[0].pr});

    /* quantise pressure into 3 width bands so we emit few paths */
    function band(pr){ return pr < 0.34 ? 0 : (pr < 0.67 ? 1 : 2); }
    function emit(seg, bandIdx){
      if(seg.length < 2) return;
      var w = item.w * scale * [0.78, 1.0, 1.28][bandIdx];
      var path = el('path', {d:smoothPath(seg), fill:'none', stroke:item.c,
        'stroke-width':r2(Math.max(0.35, w)), 'stroke-linecap':'round',
        'stroke-linejoin':'round'});
      path.dataset.stroke = si;
      g.appendChild(path);
    }
    var seg = [pts[0]], b = band(pts[0].pr);
    for(var k=1;k<pts.length;k++){
      var nb = band(pts[k].pr);
      seg.push(pts[k]);
      if(nb !== b || k === pts.length-1){ emit(seg, b); seg = [pts[k]]; b = nb; }
    }
  });
  markInkOwners(g);
}

/* An anchor that is guaranteed to resolve: if the point lands on a collapsed
   multirest (or outside the columns, e.g. header/margin ink), fall back to the
   system's first engraved bar. */
function anchorForInk(L, sysIdx, x, y){
  var a = anchorAt(L, sysIdx, x, y);
  if(!a) return null;
  if(pointFor(L, sysIdx, a)) return a;
  var sys = L.systems[sysIdx];
  for(var i=0;i<sys.colX.length;i++){
    var c = sys.colX[i];
    if(c.count === 1){
      var f = Math.max(0, Math.min(0.999999, (x - c.x)/c.w));
      return [a[0], c.bar, Math.round(f*10000)/10000, a[3]];
    }
  }
  return null;
}

/* Migrate v1 strokes (per-point bar anchors, which squashed on relayout) to the
   rigid format. Resolved against the current layout so the stroke keeps the shape
   it has on screen right now, then frozen as offsets. Runs once per item. */
function migrateAnnots(L){
  if(!L) return;
  var list = state.annots[L.piece.id];
  if(!list || !list.length) return;
  var changed = false;
  list.forEach(function(it){
    if(isStamp(it)) return;                   /* stamps are born in rigid form */
    if(!it || it.o || (it.txt != null && it.a && it.sp)) return;
    if(it.txt != null){                       /* text already had a single anchor */
      if(!it.sp){ it.sp = L.SP; changed = true; }
      return;
    }
    if(!it.p || !it.p.length) return;
    var sysIdx = -1, base = null;
    for(var sN=0; sN<L.systems.length && sysIdx<0; sN++){
      var b = pointFor(L, sN, it.p[0]);
      if(b){ sysIdx = sN; base = b; }
    }
    if(sysIdx < 0) return;                    /* not visible now; migrate later */
    var offs = [];
    it.p.forEach(function(pt){
      var q = pointFor(L, sysIdx, pt);
      if(q) offs.push([ Math.round((q.x-base.x)/L.SP*1000)/1000,
                        Math.round((q.y-base.y)/L.SP*1000)/1000,
                        pt[4]==null?0.5:pt[4] ]);
    });
    if(offs.length){
      it.a = it.p[0].slice(0,4);
      it.sp = L.SP;
      it.o = offs;
      delete it.p;
      changed = true;
    }
  });
  if(changed) saveAnnots();
}

function refreshAnnotations(){
  document.querySelectorAll('.sys svg, #pfpage svg').forEach(function(svg){
    if(svg._annotG && svg._layout) drawAnnotations(svg._annotG, svg._layout, svg._sysIdx, svg._layout.SP);
  });
}
/* raise systems that carry ink so overflowing strokes are never painted under a
   neighbouring system */
function markInkOwners(g){
  if(!g) return;
  var svg = g.ownerSVGElement;
  var host = svg && svg.parentNode;
  if(host && host.classList && host.classList.contains) {
    host.classList.toggle('hasink', g.childNodes.length > 0);
  }
}

/* ==========================================================================
   LAYOUT QUERY API — the single source of bar/staff geometry.
   Every consumer (annotations, pagination, exports) goes through these two.
   ========================================================================== */

/* screen-space point (in a system's root-group coords) -> musical anchor
   anchor = [staffId, bar, fracWithinBar, yInStaffSpacesFromMidline]           */
function anchorAt(L, sysIdx, x, y){
  var sys = L.systems[sysIdx];
  if(!sys || !L.staves.length) return null;
  var SP = L.SP;
  /* nearest staff by midline */
  var best = 0, bestD = Infinity;
  for(var i=0;i<L.staves.length;i++){
    var mid = L.staffTops[i] + 2*SP;
    var d = Math.abs(y - mid);
    if(d < bestD){ bestD = d; best = i; }
  }
  var staffId = L.staves[best].si;
  var ys = (y - (L.staffTops[best] + 2*SP)) / SP;

  /* column -> bar + fraction */
  var cols = sys.colX, c = null;
  for(var k=0;k<cols.length;k++){
    if(x >= cols[k].x && x <= cols[k].x + cols[k].w){ c = cols[k]; break; }
  }
  if(!c) c = (x < cols[0].x) ? cols[0] : cols[cols.length-1];
  var f = c.w > 0 ? (x - c.x)/c.w : 0;
  f = Math.max(0, Math.min(0.999999, f));
  var bar, frac;
  if(c.count > 1){
    var t = f * c.count;
    bar = c.bar + Math.floor(t);
    frac = t - Math.floor(t);
  } else { bar = c.bar; frac = f; }
  return [staffId, bar, Math.round(frac*10000)/10000, Math.round(ys*1000)/1000];
}

/* musical anchor -> point in this system, or null if it does not live here */
function pointFor(L, sysIdx, a){
  var sys = L.systems[sysIdx];
  if(!sys) return null;
  var SP = L.SP;
  var si = -1;
  for(var i=0;i<L.staves.length;i++){ if(L.staves[i].si === a[0]){ si = i; break; } }
  if(si < 0) return null;                       /* anchor staff not selected: hide */
  var cols = sys.colX;
  for(var k=0;k<cols.length;k++){
    var c = cols[k];
    if(a[1] >= c.bar && a[1] <= c.bar + c.count - 1){
      /* Anchor bar swallowed by a collapsed multirest: hide the item (never
         delete, never squash it into the compressed bar). It returns as soon as
         its music is engraved again. */
      if(c.count > 1) return null;
      return {x: c.x + c.w * a[2], y: L.staffTops[si] + 2*SP + a[3]*SP};
    }
  }
  return null;
}

/* ==========================================================================
   PAGINATION — first-class, shared by print / SVG export / performance mode
   ========================================================================== */
function paginate(L, pageH, firstPageOffset){
  /* returns [[systemIndex,...], ...] */
  var pages=[], cur=[], y = firstPageOffset||0;
  L.systems.forEach(function(sys, i){
    if(cur.length && y + sys.height > pageH){ pages.push(cur); cur=[]; y=0; }
    cur.push(i); y += sys.height;
  });
  if(cur.length) pages.push(cur);
  return pages;
}

/* ==========================================================================
   SCREEN RENDER
   ========================================================================== */
var currentLayout = null;

function contentWidth(){
  var wrap = document.getElementById('paper');
  var cs = getComputedStyle(wrap);
  return Math.max(320, wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
}

function renderHeader(p){
  var head = document.getElementById('schead');
  head.textContent='';
  var title = h('div','sc-title');
  if(p.id === 'rgb'){
    var cols = {R:'#ff6b55', G:'#4ed87a', B:'#5ab4ff'};
    'RGB'.split('').forEach(function(ch){
      var s = h('span',null,ch); s.style.color = cols[ch]; title.appendChild(s);
    });
  } else title.textContent = p.title;
  head.appendChild(title);

  var sub = selectionTitle(p);
  var subEl = h('div','sc-sub', sub || 'select parts to build a score');
  head.appendChild(subEl);
  head.appendChild(h('div','sc-comp','Sam Annand / Macrotonal Ensemble'));
  head.appendChild(h('div','sc-meta', p.tempo + ' bpm  ·  ' + p.ts[0] + '/' + p.ts[1] +
    '  ·  ' + p.bars + ' bars'));
  head.setAttribute('data-piece', p.title);
}

/* Keep the reader where they were across a rebuild.
   render() replaces the whole #sysbox subtree. Any forced layout taken while that
   subtree is empty collapses the document height, and the browser then CLAMPS the
   scroll position to the top - measured: scrollY 9000 -> 5. Chrome's scroll
   anchoring usually put it back, mobile Safari did not, which is why pages
   "jumped back to 1" mid-scroll. Two defences: never measure while empty (see
   render below), and explicitly re-anchor afterwards. */
function captureScrollAnchor(){
  if(document.body.classList.contains('performing')) return null;
  var box = document.getElementById('sysbox');
  if(!box) return null;
  var nodes = box.querySelectorAll('.sys');
  for(var i=0;i<nodes.length;i++){
    var r = nodes[i].getBoundingClientRect();
    if(r.bottom > 0) return {sys:+nodes[i].dataset.sys, top:r.top};
  }
  return null;
}
function restoreScrollAnchor(k){
  if(!k || document.body.classList.contains('performing')) return;
  var node = document.querySelector('#sysbox .sys[data-sys="'+k.sys+'"]');
  if(!node){
    var all = document.querySelectorAll('#sysbox .sys');
    if(!all.length) return;
    node = all[Math.min(k.sys, all.length-1)];   /* selection shrank: nearest system */
  }
  var delta = node.getBoundingClientRect().top - k.top;
  if(Math.abs(delta) > 0.5){
    window.scrollBy(0, delta);
    ensureRendered();          /* the corrected viewport may expose new systems */
  }
}

function render(){
  var p = piece();
  var anchor = captureScrollAnchor();     /* before a single DOM mutation */
  renderHeader(p);
  var box = document.getElementById('sysbox');

  if(!scoreParts(p).length && !guideParts(p).length){
    box.textContent='';
    box.appendChild(h('div','empty-hint','Choose parts from the panel to build a score.'));
    currentLayout = null;
    currentPages = [];
    updatePageHint();
    return;
  }
  /* Measure and lay out BEFORE emptying the box: contentWidth() reads clientWidth,
     which forces a synchronous layout, and doing that with #sysbox already empty is
     exactly what threw the reader back to page 1. */
  var cw = contentWidth();
  var L = layout(p, cw, spFor(cw));
  box.textContent='';
  currentLayout = L;
  migrateAnnots(L);

  /* Page identity comes from the same paginate() the print and performance
     paths use, applied to this layout with an A4-portrait page aspect. */
  var pageH = Math.round(cw * (297-26) / (210-20));
  var pages = paginate(L, pageH, SCREEN_HEADER_H);
  currentPages = pages;
  var pageOfSystem = {};
  pages.forEach(function(pg, pi){ pg.forEach(function(si){ pageOfSystem[si] = pi; }); });

  L.systems.forEach(function(sys, i){
    if(pageOfSystem[i] != null && (i === 0 || pageOfSystem[i] !== pageOfSystem[i-1])){
      var mark = h('div','pagemark' + (i === 0 ? ' first' : ''));
      mark.appendChild(h('span','pagenum', 'page ' + (pageOfSystem[i]+1) + ' / ' + pages.length));
      mark.dataset.page = pageOfSystem[i]+1;
      box.appendChild(mark);
    }
    var d = h('div','sys ph');
    d.dataset.sys = i;
    d.style.height = sys.height + 'px';
    box.appendChild(d);
  });
  ensureRendered();
  restoreScrollAnchor(anchor);
  updatePageHint();
}
var SCREEN_HEADER_H = 150;
var currentPages = [];

/* floating hint showing the page currently under the reader */
function updatePageHint(){
  var hint = document.getElementById('pagehint');
  if(!hint) return;
  var marks = document.querySelectorAll('#sysbox .pagemark');
  if(!marks.length || !currentPages.length){ hint.style.display='none'; return; }
  var cur = 1;
  for(var i=0;i<marks.length;i++){
    if(marks[i].getBoundingClientRect().top <= 120) cur = +marks[i].dataset.page;
  }
  hint.textContent = cur + ' / ' + currentPages.length;
  hint.style.display = 'block';
}

/* Lazy rendering: render any system inside the viewport (plus a margin).
   A plain viewport test rather than IntersectionObserver — the observer proved
   unreliable across the rapid re-renders that selection/zoom changes cause. */
function ensureRendered(){
  if(!currentLayout) return;
  if(document.body.classList.contains('performing')) return;   /* shell is hidden */
  var box = document.getElementById('sysbox');
  if(!box || box.style.display === 'none' || !box.offsetParent) return;
  var vh = window.innerHeight, margin = 900;
  Array.prototype.forEach.call(box.children, function(node){
    if(node._done || !node.dataset || node.dataset.sys == null) return;
    var r = node.getBoundingClientRect();
    if(r.bottom > -margin && r.top < vh + margin){
      var idx = +node.dataset.sys;
      var sys = currentLayout.systems[idx];
      if(!sys) return;
      node._done = true;
      node.textContent = '';
      node.classList.remove('ph');
      try{
        var svgNode = renderSystem(currentLayout, sys);
        node.appendChild(svgNode);
        if(svgNode._annotG) markInkOwners(svgNode._annotG);   /* now in the DOM */
      }catch(e){
        node._done = false;
        console.error('renderSystem failed for system', idx, e);
      }
    }
  });
}
var _scrollTick = false;
window.addEventListener('scroll', function(){
  if(_scrollTick) return;
  _scrollTick = true;
  requestAnimationFrame(function(){ _scrollTick = false; ensureRendered(); updatePageHint(); });
}, {passive:true});

function renderAllSync(L){
  /* used by print / export: force every system into the DOM */
  var box = document.getElementById('sysbox');
  Array.prototype.forEach.call(box.children, function(node){
    if(node._done || !node.dataset || node.dataset.sys == null) return;  /* skip page marks */
    var sys = L.systems[+node.dataset.sys];
    if(!sys) return;
    node._done = true;
    node.classList.remove('ph');
    node.textContent='';
    var svgNode = renderSystem(L, sys);
    node.appendChild(svgNode);
    if(svgNode._annotG) markInkOwners(svgNode._annotG);
  });
}

/* lane colour swatch; on a group row it sets every member's lane */
function swatch(p, idxs, isGroup){
  var b = h('button','pdot');
  b.appendChild(document.createElement('i'));
  b.setAttribute('aria-label','Lane colour');
  b._sync = function(){
    var cols = idxs.map(function(pi){ return laneColour(p, pi); });
    var same = cols.every(function(c){ return c === cols[0]; });
    b.className = 'pdot' + (same ? '' : ' mixed');
    b.firstChild.style.background = same ? cols[0] : '';
  };
  b._sync();
  b.addEventListener('click', function(ev){
    ev.stopPropagation();
    openPicker(b, laneColour(p, idxs[0]), function(hex){
      if(!state.colors[p.id]) state.colors[p.id] = {};
      idxs.forEach(function(pi){
        if(hex) state.colors[p.id][pi] = hex;
        else delete state.colors[p.id][pi];
      });
      commit();
    });
  });

  return b;
}

/* per-part monochrome toggle */
function bwToggle(p, idxs){

    var on = idxs.every(function(pi){ return isBW(p, pi); });

  };
  b._sync();
  b.addEventListener('click', function(ev){
    ev.stopPropagation();
    var on = idxs.every(function(pi){ return isBW(p, pi); });
    if(!state.bw[p.id]) state.bw[p.id] = {};

/* colour picker popover: palette grid + free colour input + reset */

function closePicker(){ if(openPickerEl){ openPickerEl.remove(); openPickerEl = null; } }
