function groupState(p, g){
  var s = selOf(p);
  var vals = g.parts.map(function(pi){ return s[pi]||0; });
  var first = vals[0];
  return vals.every(function(v){ return v===first; }) ? first : -1;
}
function triControl(get, set){
  var wrap = h('div','tri');
  ['Off','Score','Guide'].forEach(function(lbl, i){
    var b = h('button',null,lbl);
    b.dataset.v = i;
    b.addEventListener('click', function(){ set(i); });
    wrap.appendChild(b);
  });
  wrap._sync = function(){
    var v = get();
    Array.prototype.forEach.call(wrap.children, function(b, i){
      b.className = '';
      if(v === -1){ if(i===0) b.className='mixed'; }
      else if(i === v) b.className = 'on' + (i===2?' g':'');
    });
  };
  wrap._sync();
  registry.push(wrap);
  return wrap;
}
var registry = [];
function syncSidebar(){ registry.forEach(function(w){ if(w.isConnected) w._sync(); }); }

/* ==========================================================================
   STATE  (localStorage + URL hash)
   ========================================================================== */
/* Hash format:  #<piece>/<selection digits>[/b<idx,idx>][/c<idx-hex,idx-hex>]
   Selection digits are 0 off / 1 score / 2 guide, in part order. */
function encodeHash(){
  var p = piece(), s = selOf(p), parts=[];
  for(var i=0;i<p.parts.length;i++) parts.push(s[i]||0);
  while(parts.length && parts[parts.length-1]===0) parts.pop();
  var out = '#' + p.id + (parts.length ? '/' + parts.join('') : '/');
  var bw = state.bw[p.id] || {};
  var bwIdx = Object.keys(bw).filter(function(k){ return bw[k]; });
  if(bwIdx.length) out += '/b' + bwIdx.join(',');
  var co = state.colors[p.id] || {};
  var cIdx = Object.keys(co).filter(function(k){ return co[k]; });
  if(cIdx.length){
    out += '/c' + cIdx.map(function(k){ return k + '-' + String(co[k]).replace('#',''); }).join(',');
  }
  return out;
}
function applyHash(){
  var hsh = location.hash.replace(/^#/,'');
  if(!hsh) return false;
  var bits = hsh.split('/');
  var pi = D.pieces.findIndex(function(p){ return p.id === bits[0]; });
  if(pi < 0) return false;
  state.piece = pi;
  var p = D.pieces[pi];
  state.sel[p.id] = {};
  state.bw[p.id] = {};
  state.colors[p.id] = {};
  if(bits[1]){
    for(var i=0;i<bits[1].length && i<p.parts.length;i++){
      var v = +bits[1][i];
      if(v===1||v===2) state.sel[p.id][i]=v;
    }
  }
  for(var k=2;k<bits.length;k++){
    var seg = bits[k];
    if(seg[0] === 'b'){
      seg.slice(1).split(',').forEach(function(t){
        var n = parseInt(t,10);
        if(!isNaN(n) && n>=0 && n<p.parts.length) state.bw[p.id][n]=1;
      });
    } else if(seg[0] === 'c'){
      seg.slice(1).split(',').forEach(function(t){
        var m = /^(\d+)-([0-9a-fA-F]{6})$/.exec(t);
        if(m && +m[1] < p.parts.length) state.colors[p.id][+m[1]] = '#'+m[2].toLowerCase();
      });
    }
  }
  return true;
}
function saveLocal(){
  try{
    localStorage.setItem('ensembleSel', JSON.stringify(state.sel));
    localStorage.setItem('ensembleColors', JSON.stringify(state.colors));
    localStorage.setItem('ensembleBW', JSON.stringify(state.bw));
    localStorage.setItem('ensemblePiece', piece().id);
    localStorage.setItem('ensembleZoom', String(state.zoom));
  }catch(e){}
}
function loadLocal(){
  try{
    var s = localStorage.getItem('ensembleSel');
    if(s) state.sel = JSON.parse(s) || {};
    var c = localStorage.getItem('ensembleColors');
    if(c) state.colors = JSON.parse(c) || {};
    var b = localStorage.getItem('ensembleBW');
    if(b) state.bw = JSON.parse(b) || {};
    var z = parseFloat(localStorage.getItem('ensembleZoom'));
    if(!isNaN(z)){
      if(z <= 5) z = z * 100;                /* migrate old fractional zoom */
      var near = ZOOM_STOPS[0];
      ZOOM_STOPS.forEach(function(v){ if(Math.abs(v-z) < Math.abs(near-z)) near = v; });
      state.zoom = near;
    }
    state.warm = localStorage.getItem('ensembleWarm') === '1';
    var sbw = parseInt(localStorage.getItem('ensembleSidebarW'), 10);
    if(!isNaN(sbw)) state.sidebarW = sbw;
    var dev = localStorage.getItem('ensembleDevice');
    if(dev && DEVICE_MODES.indexOf(dev) >= 0) state.device = dev;
    var pid = localStorage.getItem('ensemblePiece');
    if(pid){
      var i = D.pieces.findIndex(function(p){ return p.id===pid; });
      if(i>=0) state.piece = i;
    }
  }catch(e){}
}
var suppressHash = false;
function commit(){
  syncSidebar();
  saveLocal();
  suppressHash = true;
  location.hash = encodeHash();
  setTimeout(function(){ suppressHash=false; }, 0);
  render();
  if(document.body.classList.contains('performing')) repaginatePerform();
}

/* ==========================================================================
   EXPORTS
   ========================================================================== */
function fileBase(){
  var p = piece();
  return p.title + ' — ' + (selectionTitle(p) || 'Score');
}
function download(name, mime, text){
  var blob = new Blob([text], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
}

/* ---- SVG: one tall document, all systems, fonts embedded ---- */
function exportSVG(){
  var p = piece();
  if(!scoreParts(p).length && !guideParts(p).length){ toast('Nothing selected.'); return; }
  download(fileBase()+'.svg','image/svg+xml;charset=utf-8', buildSVG());
  toast('SVG exported');
}
function buildSVG(){
  var p = piece();
  var W = 1100;
  var SP = spFor(W);
  var L = layout(p, W, SP);
  var headH = 120;
  var totalH = headH + L.systems.reduce(function(a,s){ return a+s.height; },0) + 40;

  var NS='http://www.w3.org/2000/svg';
  var svg = el('svg',{xmlns:NS, 'xmlns:xlink':'http://www.w3.org/1999/xlink',
    width:W, height:Math.ceil(totalH), viewBox:'0 0 '+W+' '+Math.ceil(totalH)});
  var style = el('style');
  style.textContent =
    '@font-face{font-family:"Observer Cover";src:url(data:font/otf;base64,'+FONTS.cover+') format("opentype")}'+
    '@font-face{font-family:"Observer Text";src:url(data:font/otf;base64,'+FONTS.text+') format("opentype")}'+
    '@font-face{font-family:"Observer Text Italic";font-style:italic;src:url(data:font/otf;base64,'+FONTS.italic+') format("opentype")}';
  svg.appendChild(el('defs',null,[style]));
  var bg = el('rect',{x:0,y:0,width:W,height:Math.ceil(totalH),fill:'#ffffff'});
  svg.appendChild(bg);

  /* header */
  var g0 = el('g',{transform:'translate('+(W/2)+',52)'});
  var t1 = el('text',{'text-anchor':'middle','font-family':'Observer Cover, Futura, sans-serif',
    'font-size':34, fill:'#000'});
  if(p.id === 'rgb'){
    var cols={R:'#ff6b55',G:'#4ed87a',B:'#5ab4ff'};
    'RGB'.split('').forEach(function(ch){
      var ts = el('tspan',{fill:cols[ch]}); ts.textContent=ch; t1.appendChild(ts);
    });
  } else t1.textContent = p.title;
  g0.appendChild(t1);
  var t2 = el('text',{y:26,'text-anchor':'middle','font-family':'Observer Text Italic, Georgia, serif',
    'font-style':'italic','font-size':17, fill:'#222'});
  t2.textContent = selectionTitle(p) || 'select parts';
  g0.appendChild(t2);
  var t3 = el('text',{y:46,'text-anchor':'middle','font-family':'Observer Text, Georgia, serif',
    'font-size':12, fill:'#333'});
  t3.textContent='Sam Annand / Macrotonal Ensemble';
  g0.appendChild(t3);
  var t4 = el('text',{y:64,'text-anchor':'middle',
    'font-family':'Observer Text Italic, Georgia, serif','font-style':'italic',
    'font-size':12.5, fill:'#555'});
  t4.textContent = p.tempo+' bpm  ·  '+p.ts[0]+'/'+p.ts[1];
  g0.appendChild(t4);
  svg.appendChild(g0);

  var y = headH;
  L.systems.forEach(function(sys){
    var s = renderSystem(L, sys);
    var g = el('g',{transform:'translate(0,'+r2(y)+')'});
    while(s.firstChild) g.appendChild(s.firstChild);
    svg.appendChild(g);
    y += sys.height;
  });

  /* Ink is free to live in the header and the margins, so the export box must
     grow to contain it - otherwise the root viewBox re-clips exactly what the
     screen now shows. */
  var minX = 0, minY = 0, maxX = W, maxY = Math.ceil(totalH);
  if(ann.visible){
    var items = state.annots[p.id] || [];
    var yAcc = headH;
    L.systems.forEach(function(sys){
      items.forEach(function(it){
        if(!it || !it.a) return;
        var base = pointFor(L, sys.index, it.a);
        if(!base) return;
        var pad, pts;
        if(it.txt != null){ pad = (it.s || 2) * SP * 1.2; pts = [[0, 0]]; }
        else if(it.gl){
          /* a glyph stamp is centred on its anchor: pad by half its box */
          var m = stampBox(it, SP);
          pad = m ? Math.max(m.w, m.h)/2 + 2 : 2*SP;
          pts = [[0, 0]];
        }
        else if(it.hp){ pad = (HAIRPIN_AP + 0.4) * SP; pts = it.o || []; }
        else { pad = Math.max(2, (it.w || 1) * 2); pts = it.o || []; }
        for(var k = 0; k < pts.length; k++){
          var px = base.x + pts[k][0] * SP;
          var py = yAcc + sys.topPad + base.y + pts[k][1] * SP;
          if(px - pad < minX) minX = px - pad;
          if(px + pad > maxX) maxX = px + pad;
          if(py - pad < minY) minY = py - pad;
          if(py + pad > maxY) maxY = py + pad;
        }
      });
      yAcc += sys.height;
    });
  }
  var vbW = Math.ceil(maxX - minX), vbH = Math.ceil(maxY - minY);
  svg.setAttribute('viewBox', r2(minX) + ' ' + r2(minY) + ' ' + vbW + ' ' + vbH);
  svg.setAttribute('width', vbW);
  svg.setAttribute('height', vbH);
  bg.setAttribute('x', r2(minX));
  bg.setAttribute('y', r2(minY));
  bg.setAttribute('width', vbW);
  bg.setAttribute('height', vbH);

  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
         new XMLSerializer().serializeToString(svg);
}

/* ==========================================================================
   MARKINGS EXCHANGE
   A player exports their layer and sends the file on; it opens on someone
   else's machine in the right place. That works because what is stored IS
   musical coordinates - bar + fraction + staff + staff-space offsets - so a
   file written on a phone at 70% lands true on a desktop at 250%. Anchors
   travel; pixels never do. Markings are the reader's layer, so they are never
   part of the MusicXML.
   ========================================================================== */
var MARKS_FORMAT = 'ensemble-markings', MARKS_VERSION = 1;
function pad2(n){ return (n < 10 ? '0' : '') + n; }

function exportMarkings(){
  var p = piece();
  var items = state.annots[p.id] || [];
  if(!items.length){ toast('No markings on this piece yet.'); return; }
  var doc = {
    format: MARKS_FORMAT,
    version: MARKS_VERSION,
    piece: p.id,
    pieceTitle: p.title,
    exported: new Date().toISOString(),
    items: JSON.parse(JSON.stringify(items))
  };
  var d = new Date();
  var day = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  download(p.title + ' markings ' + day + '.json',
           'application/json;charset=utf-8', JSON.stringify(doc, null, 2));
  toast(items.length + ' marking' + (items.length === 1 ? '' : 's') + ' exported');
}

function importMarkings(text){
  var doc;
  try{ doc = JSON.parse(text); }
  catch(e){ toast('That file is not readable markings.'); return 0; }
  if(!doc || doc.format !== MARKS_FORMAT){ toast('Not an ensemble markings file.'); return 0; }
  if(+doc.version !== MARKS_VERSION){
    toast('Markings version ' + doc.version + ' is not supported.'); return 0;
  }
  var p = piece();
  /* Cross-piece import would put a saxophone hocket's marks on another score's
     bars. Refuse it outright and say which piece the file belongs to. */
  if(doc.piece !== p.id){
    toast('Those markings are for ' + (doc.pieceTitle || doc.piece) + ', not ' + p.title + '.');
    return 0;
  }
  if(!doc.items || !doc.items.length){ toast('That file has no markings in it.'); return 0; }
  var have = {};
  (state.annots[p.id] || []).forEach(function(it){ if(it && it.id) have[it.id] = 1; });
  var add = [], dup = 0;
  doc.items.forEach(function(it){
    if(!it || !Array.isArray(it.a) || it.a.length < 4) return;   /* unanchored: drop */
    if(it.id && have[it.id]){ dup++; return; }  /* already here: a second import adds nothing */
    if(it.id) have[it.id] = 1;
    add.push(it);
  });
  if(!add.length){
    toast(dup ? 'Already imported — nothing new to add.'
              : 'No usable markings in that file.');
    return 0;
  }
  annPushMany(add);
  refreshAnnotations();
  toast('Imported ' + add.length + ' marking' + (add.length === 1 ? '' : 's'));
  return add.length;
}

function pickMarkingsFile(){
  var inp = document.getElementById('marksfile');
  if(!inp) return;
  inp.value = '';           /* so re-picking the same file still fires change */
  inp.click();
}

/* ---- MusicXML 3.1 partwise ---- */
var XML_DUR = {0:'whole',1:'half',2:'quarter',3:'eighth',4:'16th',5:'32nd',6:'64th',7:'128th',8:'breve'};
function exportMusicXML(){
  var p = piece();
  if(!scoreParts(p).length){ toast('Select at least one Score part.'); return; }
  download(fileBase()+'.musicxml',
           'application/vnd.recordare.musicxml+xml;charset=utf-8', buildMusicXML());
  toast('MusicXML exported');
}
function buildMusicXML(){
  var p = piece();
  var sp = scoreParts(p);
  var DIV = 480;                                     /* divisions per quarter */
  var out = [];
  out.push('<?xml version="1.0" encoding="UTF-8"?>');
  out.push('<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">');
  out.push('<score-partwise version="3.1">');
  out.push('<work><work-title>'+esc(p.title)+'</work-title></work>');
  out.push('<identification><creator type="composer">Sam Annand / Macrotonal Ensemble</creator>'+
           '<encoding><software>Ensemble Score Explorer</software></encoding></identification>');
  out.push('<movement-title>'+esc(selectionTitle(p)||p.title)+'</movement-title>');
  out.push('<part-list>');
  sp.forEach(function(pi, k){
    var part = p.parts[pi];
    out.push('<score-part id="P'+(k+1)+'"><part-name>'+esc(part.display)+'</part-name>'+
             '<part-abbreviation>'+esc(part.short||part.display)+'</part-abbreviation></score-part>');
  });
  out.push('</part-list>');

  sp.forEach(function(pi, k){
    var part = p.parts[pi];
    out.push('<part id="P'+(k+1)+'">');
    var nst = part.staves.length;
    for(var bar=1; bar<=p.bars; bar++){
      out.push('<measure number="'+bar+'">');
      /* attributes */
      var attrs = [];
      if(bar === 1){
        attrs.push('<divisions>'+DIV+'</divisions>');
        attrs.push('<key><fifths>'+(p.staves[part.staves[0]].key||0)+'</fifths></key>');
        var ts = tsAt(p,bar);
        attrs.push('<time><beats>'+ts[0]+'</beats><beat-type>'+ts[1]+'</beat-type></time>');
        if(nst>1) attrs.push('<staves>'+nst+'</staves>');
        part.staves.forEach(function(si, j){
          attrs.push(clefXML(clefAt(p.staves[si],1), nst>1 ? j+1 : null));
        });
        if(part.transC || part.transD){
          attrs.push('<transpose><diatonic>'+part.transD+'</diatonic><chromatic>'+part.transC+'</chromatic></transpose>');
        }
      } else {
        var tsc = tsChangeAt(p, bar);
        if(tsc) attrs.push('<time><beats>'+tsc[0]+'</beats><beat-type>'+tsc[1]+'</beat-type></time>');
        part.staves.forEach(function(si, j){
          var cc = clefChangeAt(p.staves[si], bar);
          if(cc) attrs.push(clefXML(cc, nst>1 ? j+1 : null));
        });
      }
      if(attrs.length) out.push('<attributes>'+attrs.join('')+'</attributes>');

      var firstStaffWritten = false;
      part.staves.forEach(function(si, j){
        var staff = p.staves[si];
        var voices = flattenMeasure(staff, p, bar);
        if(firstStaffWritten){
          out.push('<backup><duration>'+Math.round(barDur(p,bar)*4*DIV)+'</duration></backup>');
        }
        voices.forEach(function(voice, vi){
          if(vi > 0){
            out.push('<backup><duration>'+Math.round(barDur(p,bar)*4*DIV)+'</duration></backup>');
          }
          voice.forEach(function(ev){
            out.push(noteXML(ev, p, bar, DIV, vi+1, nst>1 ? j+1 : null, staff, isBW(p, pi)));
          });
        });
        firstStaffWritten = true;
      });
      if(bar === p.bars) out.push('<barline location="right"><bar-style>light-heavy</bar-style></barline>');
      out.push('</measure>');
    }
    out.push('</part>');
  });
  out.push('</score-partwise>');
  return out.join('\n');
}
function clefXML(clef, staffNo){
  var sign='G', line=2;
  if(clef==='F'){ sign='F'; line=4; }
  else if(clef && clef[0]==='C'){ sign='C'; line = parseInt(clef.slice(1),10)||3; }
  return '<clef'+(staffNo?' number="'+staffNo+'"':'')+'><sign>'+sign+'</sign><line>'+line+'</line></clef>';
}
function noteXML(ev, p, bar, DIV, voice, staffNo, staff, bw){
  var s=[];
  if(ev.type === 'mrest'){
    var d = Math.round(barDur(p,bar)*4*DIV);
    s.push('<note><rest measure="yes"/><duration>'+d+'</duration><voice>'+voice+'</voice>'+
           (staffNo?'<staff>'+staffNo+'</staff>':'')+'</note>');
    return s.join('');
  }
  var dur = Math.round(ev.d*4*DIV);
  var typ = XML_DUR[ev.di] || 'quarter';
  var tmod = '';
  if(ev.tup >= 0){
    var T = D.tuplets[ev.tup];
    tmod = '<time-modification><actual-notes>'+T[0]+'</actual-notes>'+
           '<normal-notes>'+T[1]+'</normal-notes></time-modification>';
  }
  if(ev.type === 'rest'){
    s.push('<note><rest/><duration>'+dur+'</duration><voice>'+voice+'</voice><type>'+typ+'</type>'+
           dots(ev.dots)+tmod+(staffNo?'<staff>'+staffNo+'</staff>':'')+'</note>');
    return s.join('');
  }
  ev.notes.forEach(function(n, i){
    var step = n[0], alter = n[1], colour = D.palette[n[2]] || '#000000';
    var letter = LETT[((step % 7) + 7) % 7];
    var octave = Math.floor(step/7);
    var ties='', notations=[];
    if(n[4] & 2){ ties += '<tie type="stop"/>'; notations.push('<tied type="stop"/>'); }
    if(n[4] & 1){ ties += '<tie type="start"/>'; notations.push('<tied type="start"/>'); }
    if(ev.art) notations.push('<articulations><staccato/></articulations>');
    if(ev.tup >= 0 && i===0){ /* tuplet brackets are optional; time-modification carries the maths */ }
    var body = '';
    body += (i>0 ? '<chord/>' : '');
    body += '<pitch><step>'+letter+'</step>'+
            (alter ? '<alter>'+alter+'</alter>' : '')+
            '<octave>'+octave+'</octave></pitch>';
    body += '<duration>'+dur+'</duration>';
    body += ties;
    body += '<voice>'+voice+'</voice>';
    body += '<type>'+typ+'</type>';
    body += dots(ev.dots);
    if(n[3]) body += '<accidental>'+ACC_XML[n[3]]+'</accidental>';
    body += tmod;
    if(staffNo) body += '<staff>'+staffNo+'</staff>';
    /* Colour on BOTH <note> and <notehead>. B/W parts carry no colour at all so
       they import as plain black. */
    if(!bw) body += '<notehead color="'+colour+'">normal</notehead>';
    if(notations.length) body += '<notations>'+notations.join('')+'</notations>';
    s.push('<note' + (bw ? '' : ' color="'+colour+'"') + '>'+body+'</note>');
  });
  return s.join('');
}
var ACC_XML = {1:'sharp',2:'flat',3:'natural',4:'double-sharp',5:'flat-flat'};
function dots(n){ var s=''; for(var i=0;i<(n||0);i++) s+='<dot/>'; return s; }

/* ---- print ---- */
function doPrint(){
  var p = piece();
  if(!scoreParts(p).length && !guideParts(p).length){ toast('Nothing selected.'); return; }
  buildPrintPages();
  setTimeout(function(){
    window.print();
    setTimeout(cleanupPrint, 800);
  }, 120);
}
var printHost = null;
function buildPrintPages(){
  cleanupPrint();
  var p = piece();
  /* A4 portrait at 96dpi minus margins */
  var PW = Math.round(210/25.4*96) - Math.round(20/25.4*96);
  var PH = Math.round(297/25.4*96) - Math.round(26/25.4*96);
  var SP = baseSP(PW) * 0.7;      /* print is independent of screen zoom */
  var L = layout(p, PW, SP);
  var headH = 150;
  var pages = paginate(L, PH - 22, headH);

  printHost = h('div','printonly');
  pages.forEach(function(pg, pi){
    var page = h('div','prpage');
    page.style.height = PH+'px';
    page.style.position='relative';
    if(pi === 0){
      var hd = h('div','schead');
      hd.style.marginBottom='14px';
      hd.innerHTML = document.getElementById('schead').innerHTML;
      page.appendChild(hd);
    }
    pg.forEach(function(si){
      var wrap = h('div','sys');
      wrap.appendChild(renderSystem(L, L.systems[si]));
      page.appendChild(wrap);
    });
    var foot = h('div','prfoot');
    foot.appendChild(h('span',null, p.title + ' — ' + (selectionTitle(p)||'')));
    foot.appendChild(h('span',null, (pi+1) + ' / ' + pages.length));
    page.appendChild(foot);
    printHost.appendChild(page);
  });
  document.getElementById('paper').appendChild(printHost);
  document.getElementById('sysbox').style.display='none';
  document.getElementById('schead').style.display='none';
}
function cleanupPrint(){
  if(printHost){ printHost.remove(); printHost=null; }
  var sb = document.getElementById('sysbox'); if(sb) sb.style.display='';
  var sh = document.getElementById('schead'); if(sh) sh.style.display='';
}

/* ==========================================================================
   PERFORMANCE MODE
   ========================================================================== */
var perf = { on:false, pages:[], page:0, L:null, wake:null };

function enterPerform(){
  var p = piece();
  if(!scoreParts(p).length && !guideParts(p).length){ toast('Nothing selected.'); return; }
  document.body.classList.add('performing');
  perf.on = true;
  perf.page = 0;
  var node = document.getElementById('perform');
  if(node.requestFullscreen){
    node.requestFullscreen().catch(function(){ /* fixed-position fallback already active */ });
  } else if(node.webkitRequestFullscreen){
    try{ node.webkitRequestFullscreen(); }catch(e){}
  }
  requestWakeLock();
  repaginatePerform();
  showIndicator();
}
function exitPerform(){
  perf.on = false;
  document.body.classList.remove('performing');
  if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
  else if(document.webkitFullscreenElement && document.webkitExitFullscreen){
    try{ document.webkitExitFullscreen(); }catch(e){}
  }
  releaseWakeLock();
  document.getElementById('pfpage').textContent='';
  /* the shell was display:none while performing, so lay the normal view out again */
  render();
}
function repaginatePerform(){
  if(!perf.on) return;
  var p = piece();
  var host = document.getElementById('pfpage');
  var W = window.innerWidth, H = window.innerHeight;
  var padX = Math.max(14, Math.round(W*0.035)), padY = Math.max(12, Math.round(H*0.025));
  var innerW = W - padX*2, innerH = H - padY*2;
  /* pick a staff size that gives a comfortable number of systems per page */
  /* Fit the page box, not just its width: a landscape iPad is short, so the
     width-derived staff size can leave a single system stranded on each page.
     Step the staff size down until at least two systems share a page. */
  var headH = 96;
  var wSP = baseSP(innerW) * (state.zoom / 100);
  var L = null;
  var TRIES = [1, 0.88, 0.78, 0.68, 0.6, 0.52, 0.45];
  for(var t = 0; t < TRIES.length; t++){
    L = layout(p, innerW, Math.max(3.6, wSP * TRIES[t]));
    var tallest = 0;
    L.systems.forEach(function(s){ tallest = Math.max(tallest, s.height); });
    if(!L.systems.length || tallest * 2 <= innerH - headH || t === TRIES.length - 1) break;
  }
  perf.L = L;
  migrateAnnots(L);
  perf.pages = paginate(L, innerH, headH);
  if(perf.page >= perf.pages.length) perf.page = Math.max(0, perf.pages.length-1);
  drawPerformPage();
}
function drawPerformPage(){
  var host = document.getElementById('pfpage');
  host.textContent='';
  if(!perf.L || !perf.pages.length) return;
  var p = piece();
  var W = window.innerWidth, H = window.innerHeight;
  var padX = Math.max(14, Math.round(W*0.035)), padY = Math.max(12, Math.round(H*0.025));
  var wrap = h('div');
  wrap.style.cssText='width:'+(W-padX*2)+'px;margin:'+padY+'px '+padX+'px;';
  /* perf.L already carries the fitted staff size chosen by repaginatePerform */
  if(perf.page === 0){
    var hd = h('div','schead');
    hd.style.marginBottom='10px';
    hd.innerHTML = document.getElementById('schead').innerHTML;
    wrap.appendChild(hd);
  }
  perf.pages[perf.page].forEach(function(si){
    var d = h('div','sys');
    d.appendChild(renderSystem(perf.L, perf.L.systems[si]));
    wrap.appendChild(d);
  });
  host.appendChild(wrap);
  showIndicator();
}
function turnPage(delta){
  if(!perf.on || !perf.pages.length) return;
  var n = perf.page + delta;
  if(n < 0 || n >= perf.pages.length) return;
  perf.page = n;
  drawPerformPage();
}
var indTimer=null;
function showIndicator(){
  var ind = document.getElementById('pfind');
  if(!perf.pages.length) return;
  ind.textContent = (perf.page+1) + ' / ' + perf.pages.length;
  ind.classList.add('show');
  clearTimeout(indTimer);
  indTimer = setTimeout(function(){ ind.classList.remove('show'); }, 1700);
}
/* wake lock */
function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(s){
    perf.wake = s;
    s.addEventListener('release', function(){ perf.wake = null; });
  }).catch(function(){ /* unsupported or denied — silent */ });
}
function releaseWakeLock(){
  if(perf.wake){ try{ perf.wake.release(); }catch(e){} perf.wake=null; }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && perf.on && !perf.wake) requestWakeLock();
});

/* touch / tap page turns */
(function performGestures(){
  var node = document.getElementById('perform');
  var sx=0, sy=0, moved=false;
  node.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
  }, {passive:true});
  node.addEventListener('touchmove', function(e){
    if(e.touches.length!==1) return;
    if(Math.abs(e.touches[0].clientX-sx) > 40) moved=true;
  }, {passive:true});
  node.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    /* where a finger is the pen (phone), a horizontal stroke is ink, not a swipe */
    if(touchDrawOK() && (ann.mode === 'draw' || ann.mode === 'text')) return;
    if(moved && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){
      turnPage(dx < 0 ? 1 : -1);
      return;
    }
    handleTap(t.clientX);
  });
  node.addEventListener('click', function(e){
    if(e.target.closest('.pfexit')) return;
    handleTap(e.clientX);
  });
  function handleTap(x){
    if(tapSuspended()) return;    /* draw / text / ear all suspend tap page turns */
    var w = window.innerWidth;
    if(x < w/3) turnPage(-1);
    else if(x > w*2/3) turnPage(1);
    else showIndicator();
  }
})();
/* Bluetooth page-turner pedals (AirTurn, PageFlip, iRig BlueTurn, Donner...) pair
   as HID keyboards and send plain keystrokes, not MIDI (Web MIDI does not exist on
   iPad Safari). Covering these keys handles every common pedal mode with no pairing
   UI and no configuration. */
var PEDAL_NEXT = {'PageDown':1, 'ArrowRight':1, 'ArrowDown':1, ' ':1, 'Spacebar':1};
var PEDAL_PREV = {'PageUp':1, 'ArrowLeft':1, 'ArrowUp':1};
document.addEventListener('keydown', function(e){
  /* never steal keys from the TEXT tool's input */
  var t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if(e.repeat) return;                    /* a held pedal turns exactly one page */
  if(perf.on){
    if(e.key === 'Escape'){ exitPerform(); return; }
    if(PEDAL_NEXT[e.key]){ e.preventDefault(); turnPage(1); return; }
    if(PEDAL_PREV[e.key]){ e.preventDefault(); turnPage(-1); return; }
    return;
  }
  /* Escape is the universal way out of anything that covers the score */
  if(e.key === 'Escape'){
    if(tuner.open){ toggleTuner(); return; }
    if(document.body.classList.contains('drawer')){ closeDrawer(); return; }
    if(document.body.classList.contains('menu')){
      document.body.classList.remove('menu'); return;
    }
    if(ann.mode){ setMode(''); return; }
  }
  /* normal view: the same pedal steps the scroll by a viewport page */
  if(PEDAL_NEXT[e.key]){
    e.preventDefault(); window.scrollBy({top: window.innerHeight*0.86, behavior:'smooth'});
  } else if(PEDAL_PREV[e.key]){
    e.preventDefault(); window.scrollBy({top: -window.innerHeight*0.86, behavior:'smooth'});
  }
});
document.addEventListener('fullscreenchange', function(){
  if(!document.fullscreenElement && perf.on){ exitPerform(); }
});

   the ONLY input, and that rule made draw mode a complete no-op there.

   The rule is therefore tied to the device-mode system:
     PHONE            one finger draws; two fingers pan the page (below).
     TABLET / DESKTOP unchanged - pen and mouse draw, touch scrolls.

      return;
    }
    /* ---- STAMP: tap empty paper to place, tap a stamp to select, drag to move */
    if(ann.mode === 'stamp'){
      if(ev.pointerType === 'touch' && !touchDrawOK()) return;
      if(!onPaper(ev)) return;
      var ssvg = inkTargetSvg(ev);
      if(!ssvg) return;
      var sxy = svgXY(ssvg, ev);
      if(!sxy) return;
      if(ann.erasing){ eraseAt(ssvg, sxy); ev.preventDefault(); return; }
      var SL = ssvg._layout, slist = state.annots[SL.piece.id] || [];

      /* a handle of the selected hairpin beats everything under it */
      var hitEl = document.elementFromPoint(ev.clientX, ev.clientY);
      if(hitEl && hitEl.dataset && hitEl.dataset.handle != null){
        var hIdx = +hitEl.dataset.stroke;
        stampDrag = {svg:ssvg, index:hIdx, handle:+hitEl.dataset.handle,
                     moved:false, sx:ev.clientX, sy:ev.clientY, geo:annGeoOp(hIdx)};
        ev.preventDefault();
        return;
      }
      /* topmost stamp under the point: select it and start a move */
      for(var qi = slist.length-1; qi >= 0; qi--){
        if(!isStamp(slist[qi])) continue;
        if(!stampHit(slist[qi], SL, ssvg._sysIdx, sxy)) continue;
        ann.selId = slist[qi].id;
        stampDrag = {svg:ssvg, index:qi, handle:null,
                     moved:false, sx:ev.clientX, sy:ev.clientY, geo:annGeoOp(qi)};
        refreshAnnotations();
        ev.preventDefault();
        return;
      }
      /* empty paper: queue a placement, committed on the pointer-up */
      var sa = anchorForInk(SL, ssvg._sysIdx, sxy.x, sxy.y);
      if(sa) stampPend = {svg:ssvg, a:sa, sx:ev.clientX, sy:ev.clientY};
      ev.preventDefault();
      return;
    }
    if(!ann.on) return;
    if(ev.pointerType === 'touch' && !touchDrawOK()) return;   /* see the rule above */
    if(!onPaper(ev)) return;
    var svg = inkTargetSvg(ev);
    if(!svg) return;
    ev.preventDefault();
    var xy = svgXY(svg, ev);
    if(!xy) return;
    if(ann.erasing){ eraseAt(svg, xy); return; }
    var a = anchorForInk(svg._layout, svg._sysIdx, xy.x, xy.y);
    if(!a) return;
    var base = pointFor(svg._layout, svg._sysIdx, a);
    if(!base) return;
    /* one anchor for the whole stroke; every later sample is a rigid offset
       measured in staff spaces, so replay can only translate + uniformly scale */
    drawing = {c:ann.colour, w:ann.width, a:a, sp:svg._layout.SP,
               o:[[0, 0, ev.pressure || 0.5]]};
    drawBase = base;
    curSvg = svg;
    /* capture on the SVG itself: a stable element for the whole stroke, so the
       pointer is never lost mid-draw (the "sticky" start/stop feel) */
    try{ svg.setPointerCapture && svg.setPointerCapture(ev.pointerId); curPointer = ev.pointerId; }catch(e){}
  }
  function move(ev){
    /* two-finger pan: touch-action is none while drawing, so scroll by hand */
    if(ev.pointerType === 'touch' && touchPts[ev.pointerId]){
      touchPts[ev.pointerId] = {x:ev.clientX, y:ev.clientY};
      if(panning){
        var mid = touchMid();
        if(mid){
          window.scrollBy(panning.x - mid.x, panning.y - mid.y);
          panning = touchMid();     /* re-read: the page moved under the fingers */
        }
        ev.preventDefault();
        return;
      }
    }
    if(stampDrag){
      if(Math.abs(ev.clientX-stampDrag.sx) > 3 || Math.abs(ev.clientY-stampDrag.sy) > 3)
        stampDrag.moved = true;
      if(stampDrag.moved){
        var mxy = svgXY(stampDrag.svg, ev);
        var ML = stampDrag.svg._layout;
        var mit = (state.annots[ML.piece.id] || [])[stampDrag.index];
        if(mxy && mit){
          if(stampDrag.handle == null){
            /* move: the anchor itself travels, so the item stays musically bound */
            var ma = anchorForInk(ML, stampDrag.svg._sysIdx, mxy.x, mxy.y);
            if(ma){ mit.a = ma; refreshAnnotations(); }
          } else {
            /* resize/reslope: one endpoint's offset changes, in staff spaces */
            var mb = pointFor(ML, stampDrag.svg._sysIdx, mit.a);
            if(mb){
              if(!mit.o || mit.o.length < 2) mit.o = [[0,0],[HAIRPIN_LEN,0]];
              mit.o[stampDrag.handle] = [
                Math.round((mxy.x - mb.x)/ML.SP*1000)/1000,
                Math.round((mxy.y - mb.y)/ML.SP*1000)/1000
              ];
              refreshAnnotations();
            }
          }
        }
        ev.preventDefault();
      }
      return;
    }
    if(textDrag){
      if(Math.abs(ev.clientX-textDrag.sx) > 3 || Math.abs(ev.clientY-textDrag.sy) > 3)
        textDrag.moved = true;
      if(textDrag.moved){
        var dxy = svgXY(textDrag.svg, ev);
        if(dxy){
          var na = anchorForInk(textDrag.svg._layout, textDrag.svg._sysIdx, dxy.x, dxy.y);
          var lst = state.annots[textDrag.svg._layout.piece.id] || [];
          if(na && lst[textDrag.index]){ lst[textDrag.index].a = na; refreshAnnotations(); }
        }
        ev.preventDefault();
      }
      return;
    }
    if(!ann.on) return;
    if(ev.pointerType === 'touch' && !touchDrawOK()) return;
    if(ann.erasing && (ev.buttons & 1 || ev.pointerType === 'touch')){
      var s2 = svgUnder(ev); if(!s2) return;
      var p2 = svgXY(s2, ev); if(p2) eraseAt(s2, p2);
      return;
    }
    if(!drawing || !curSvg) return;
    ev.preventDefault();
    /* consume every intermediate sample the browser buffered, so fast strokes
       keep their curvature instead of collapsing to a few straight segments */
    var samples = (ev.getCoalescedEvents ? ev.getCoalescedEvents() : null);
    if(!samples || !samples.length) samples = [ev];
    for(var i=0;i<samples.length;i++){
      var sev = samples[i];
      var xy = svgXY(curSvg, sev);
      if(!xy) continue;
      var SPn = curSvg._layout.SP;
      var dx = Math.round((xy.x - drawBase.x)/SPn*1000)/1000;
      var dy = Math.round((xy.y - drawBase.y)/SPn*1000)/1000;
      var last = drawing.o[drawing.o.length-1];
      /* drop exact duplicates only; never thin the stream */
      if(last && last[0]===dx && last[1]===dy) continue;
      drawing.o.push([dx, dy, sev.pressure || ev.pressure || 0.5]);
    }
    if(!rafPending){
      rafPending = true;
      requestAnimationFrame(function(){ rafPending = false; livePreview(); });
    }
  }
  function up(ev){
    if(ev.pointerType === 'touch' && touchPts[ev.pointerId]){
      delete touchPts[ev.pointerId];
      if(nTouch() < 2) panning = null;
      if(nTouch() > 0 || panning){ return; }   /* a pan gesture never lays ink */
    }
    if(stampDrag){
      var sd = stampDrag; stampDrag = null;
      if(sd.moved){ annPushGeo(sd.geo); refreshAnnotations(); }
      return;
    }
    if(stampPend){
      var sp0 = stampPend; stampPend = null;
      /* a tap, not a drag - a long swipe was the reader trying to move the page */
      if(Math.abs(ev.clientX-sp0.sx) < 8 && Math.abs(ev.clientY-sp0.sy) < 8){
        if(ann.selId){ ann.selId = null; refreshAnnotations(); }   /* deselect first */
        placeStamp(sp0.svg, sp0.a);
      }
      return;
    }
    if(textDrag){
      var td = textDrag; textDrag = null;
      if(td.moved){ saveAnnots(); refreshAnnotations(); }
      else openTextEditor(td.svg, (state.annots[td.svg._layout.piece.id]||[])[td.index].a, td.index);
      return;
    }
    if(curSvg && curPointer != null){
      try{ curSvg.releasePointerCapture && curSvg.releasePointerCapture(curPointer); }catch(e){}
    }
    curPointer = null;
    if(!drawing) return;
    if(drawing.o && drawing.o.length > 1) annPush(drawing);
    drawing = null; curSvg = null; drawBase = null;
    refreshAnnotations();
  }
  function livePreview(){
    if(!curSvg || !drawing) return;
    var L = curSvg._layout, g = curSvg._annotG;
    var tmp = g.querySelector('.live');
    if(!tmp){ tmp = el('path',{'class':'live', fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}); g.appendChild(tmp); }
    var pts = drawing.o.map(function(off){
      return {x: drawBase.x + off[0]*L.SP, y: drawBase.y + off[1]*L.SP};
    });
    tmp.setAttribute('d', smoothPath(pts));
    tmp.setAttribute('stroke', drawing.c);
    tmp.setAttribute('stroke-width', r2(Math.max(0.35, drawing.w*L.SP/7.2)));
  }
  function eraseAt(svg, xy){
    var L = svg._layout, list = state.annots[L.piece.id] || [];
    var tol = 1.4*L.SP;
    for(var i=list.length-1;i>=0;i--){
      if(list[i].txt != null){
        var tp = pointFor(L, svg._sysIdx, list[i].a);
        if(tp && Math.abs(tp.x - xy.x) < 4*L.SP && Math.abs(tp.y - xy.y) < 1.6*L.SP){
          annErase(i); return;
        }
        continue;
      }
      if(isStamp(list[i])){
        if(stampHit(list[i], L, svg._sysIdx, xy)){ annErase(i); return; }
        continue;
      }
      var it = list[i];
      if(!it.a || !it.o) continue;
      var b = pointFor(L, svg._sysIdx, it.a);
      if(!b) continue;
      for(var k=0;k<it.o.length;k++){
        var px = b.x + it.o[k][0]*L.SP, py = b.y + it.o[k][1]*L.SP;
        if(Math.abs(px-xy.x) < tol && Math.abs(py-xy.y) < tol){ annErase(i); return; }
      }
    }
  }
  document.addEventListener('pointerdown', down, {passive:false});
  document.addEventListener('pointermove', move, {passive:false});
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
})();

function setMode(m){
  /* Measure the real toolbar BEFORE hiding it: --bar-h is a 52px minimum, while the
     phone toolbar actually stands 57px, and the difference showed up as the score
     jumping when a mode was entered. The shell borrows the measured height back. */
  var tbNode = document.getElementById('topbar');
  if(tbNode && !ann.mode){
    var tbH = Math.round(tbNode.getBoundingClientRect().height);
    if(tbH) document.documentElement.style.setProperty('--modepad', tbH + 'px');
  }
  ann.mode = (ann.mode === m) ? '' : m;
  ann.on = (ann.mode === 'draw');
  if(ann.mode !== 'draw' && ann.mode !== 'stamp') ann.erasing = false;
  document.body.classList.toggle('drawing', ann.mode === 'draw');
  document.body.classList.toggle('texting', ann.mode === 'text');
  document.body.classList.toggle('earing', ann.mode === 'ear');
  document.body.classList.toggle('stamping', ann.mode === 'stamp');
  if(ann.mode !== 'stamp') ann.selId = null;      /* handles belong to STAMP mode */
  var showTools = (ann.mode === 'draw' || ann.mode === 'text' || ann.mode === 'stamp');
  var bar = document.getElementById('anntools');
  if(bar) bar.style.display = showTools ? 'flex' : 'none';
  var tray = document.getElementById('stamptray');
  if(tray) tray.style.display = (ann.mode === 'stamp') ? 'flex' : 'none';
  var pf = document.getElementById('pfann');
  if(pf) pf.style.display = (showTools && perf.on) ? 'flex' : 'none';
  /* phone: the mode owns the chrome via the bottom mode bar (see buildModeBar) */
  document.body.classList.toggle('modeon', !!ann.mode);
  if(ann.mode) document.body.classList.remove('menu');   /* the fold menu is going away */
  buildModeBar();
  if(ann.mode !== 'text') closeTextEditor();
  syncAnnUI();
  refreshAnnotations();      /* handles appear/disappear with the mode */
}
function setDrawMode(on){ if(on !== (ann.mode==='draw')) setMode('draw'); }
function syncAnnUI(){
  var b = document.getElementById('btnDraw');
  if(b) b.className = 'btn' + (ann.mode==='draw' ? ' on' : '');
  var bt = document.getElementById('btnText');
  if(bt) bt.className = 'btn' + (ann.mode==='text' ? ' on' : '');
  var be = document.getElementById('btnEar');
  if(be) be.className = 'btn' + (ann.mode==='ear' ? ' on' : '');
  var bs = document.getElementById('btnStamp');
  if(bs) bs.className = 'btn' + (ann.mode==='stamp' ? ' on' : '');
  document.querySelectorAll('.stampbtn').forEach(function(d){
    d.className = 'stampbtn' + (d.dataset.k === ann.stamp ? ' sel' : '');
  });
  var e = document.getElementById('btnErase');
  if(e) e.className = 'btn ghost' + (ann.erasing ? ' on' : '');
  var v = document.getElementById('btnEye');
  if(v) v.className = 'btn ghost' + (ann.visible ? '' : ' on');
  document.querySelectorAll('.inkdot').forEach(function(d){
    d.className = 'inkdot' + (d.dataset.c === ann.colour ? ' sel' : '');
  });
  document.querySelectorAll('.wbtn').forEach(function(d){
    d.className = 'wbtn' + (+d.dataset.w === ann.width ? ' sel' : '');
  });
  /* mode-bar toggles carry state, not a width, so they are synced after the loop */
  var me = document.getElementById('mbErase');
  if(me) me.className = 'wbtn' + (ann.erasing ? ' sel' : '');
  var mv = document.getElementById('mbEye');
  if(mv) mv.className = 'wbtn' + (ann.visible ? '' : ' sel');
}

/* ==========================================================================
   TEXT TOOL — place / edit / drag text on the annotation layer
   ========================================================================== */
var textEdit = null;   /* {svg, anchor, index|null} */
function closeTextEditor(){
  var box = document.getElementById('annedit');
  if(box) box.style.display = 'none';
  textEdit = null;
}
function openTextEditor(svg, anchor, index){
  var box = document.getElementById('annedit');
  if(!box) return;
  var L = svg._layout;
  var pt = pointFor(L, svg._sysIdx, anchor);
  if(!pt) return;
  var r = svg.getBoundingClientRect();
  var vb = svg.getAttribute('viewBox').split(' ').map(Number);
  var k = r.width / vb[2];
  var sys = L.systems[svg._sysIdx];
  box.style.display = 'block';
  box.style.left = (r.left + pt.x * k) + 'px';
  box.style.top  = (r.top + (pt.y + sys.topPad) * k - 14) + 'px';
  box.value = (index != null && state.annots[L.piece.id][index])
    ? state.annots[L.piece.id][index].txt : '';
  textEdit = {svg:svg, anchor:anchor, index:index};
  setTimeout(function(){ box.focus(); box.select(); }, 0);
}
function commitTextEditor(){
  if(!textEdit) return;
  var box = document.getElementById('annedit');
  var txt = (box.value || '').trim();
  var pid = textEdit.svg._layout.piece.id;
  var list = state.annots[pid] || (state.annots[pid] = []);
  if(textEdit.index != null){
    if(!txt){ annErase(textEdit.index); }
    else {
      var prev = list[textEdit.index];
      (ann.undo[pid] = ann.undo[pid] || []).push({t:'edit', i:textEdit.index, s:prev.txt});
      ann.redo[pid] = [];
      prev.txt = txt;
      saveAnnots();
    }
  } else if(txt){
    annPush({c:ann.colour, s:ann.textSize, a:textEdit.anchor,
             sp:textEdit.svg._layout.SP, txt:txt});
  }
  closeTextEditor();
  refreshAnnotations();
}

/* ==========================================================================
   MACRO TUNER OVERLAY — draggable floating panel over the score
   ========================================================================== */
var tuner = {open:false, x:null, y:null, op:1};
function loadTuner(){
  try{
    var t = JSON.parse(localStorage.getItem('ensembleTuner') || '{}');
    if(typeof t.x === 'number') tuner.x = t.x;
    if(typeof t.y === 'number') tuner.y = t.y;
    if(typeof t.op === 'number') tuner.op = t.op;
  }catch(e){}
}
function saveTuner(){
  try{ localStorage.setItem('ensembleTuner',
    JSON.stringify({x:tuner.x, y:tuner.y, op:tuner.op})); }catch(e){}
}
function toggleTuner(){
  var panel = document.getElementById('tunerpanel');
  tuner.open = !tuner.open;
  panel.style.display = tuner.open ? 'flex' : 'none';
  var b = document.getElementById('btnTuner');
  if(b) b.className = 'btn ghost' + (tuner.open ? ' on' : '');
  if(tuner.open){
    var frame = document.getElementById('tunerframe');
    if(!frame.getAttribute('src')){
      frame.setAttribute('src', '/tuner/');
      /* if it does not load (file://, offline, not deployed) say so plainly */
      var fallback = document.getElementById('tunerfail');
      var loaded = false;
      frame.addEventListener('load', function(){ loaded = true; fallback.style.display='none'; });
      setTimeout(function(){ if(!loaded) fallback.style.display='block'; }, 2500);
    }
    placeTuner();
  }
}
function placeTuner(){
  var panel = document.getElementById('tunerpanel');
  var w = Math.min(420, window.innerWidth * 0.9);
  panel.style.width = w + 'px';
  if(tuner.x == null){ tuner.x = Math.max(8, window.innerWidth - w - 24); tuner.y = 84; }
  /* Keep the WHOLE panel on screen horizontally. Clamping only the left edge let
     the title bar - and with it the close ✕ at its right end - hang off a narrow
     screen, so the tuner could not be shut. */
  tuner.x = Math.max(0, Math.min(tuner.x, window.innerWidth - w));
  tuner.y = Math.max(0, Math.min(tuner.y, window.innerHeight - 60));
  panel.style.left = Math.max(0, tuner.x) + 'px';
  panel.style.top  = Math.max(0, tuner.y) + 'px';
  panel.style.opacity = tuner.op;
}

   BOOT
   ========================================================================== */
function buildTabs(){
  var t = document.getElementById('tabs');
  t.textContent='';
  D.pieces.forEach(function(p, i){
    var b = h('button','tab' + (i===state.piece?' on':''), p.title);
    b.addEventListener('click', function(){
      state.piece = i;
      buildTabs(); registry.length=0; buildSidebar(); commit();
    });
    t.appendChild(b);
  });
}
/* ---------------------------------------------------------------- device mode */
var DEVICE_MODES = ['auto', 'phone', 'tablet', 'desktop'];
var DEVICE_LABEL = {auto:'Auto', phone:'Phone', tablet:'Tablet', desktop:'Desktop'};
/* Auto picks by viewport; an explicit choice always wins. */
function autoDevice(){
  /* innerWidth alone is unreliable: a mobile browser can report an expanded
     layout viewport before the page settles, which would hide phone mode on the
     device that needs it most. Take the smaller of the layout and hardware
     widths, and treat a coarse pointer as at least tablet. */
  var w = window.innerWidth || 1200;
  var sw = (window.screen && window.screen.width) ? window.screen.width : w;
  var eff = Math.min(w, sw);
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  if(eff < 700) return 'phone';
  if(eff < 1100 || coarse) return 'tablet';
  return 'desktop';
}
function effectiveDevice(){
  return state.device === 'auto' ? autoDevice() : state.device;
}
function applyDevice(rerender){
  var eff = effectiveDevice();
  var prev = document.body.getAttribute('data-dev');
  document.body.setAttribute('data-dev', eff);
  var b = document.getElementById('btnDevice');
  if(b) b.textContent = state.device === 'auto'
    ? ('Auto \u00b7 ' + DEVICE_LABEL[eff]) : DEVICE_LABEL[state.device];
  if(eff !== 'phone') document.body.classList.remove('menu');
  if(eff !== prev){
    /* leaving/entering an overlay-sidebar mode changes the score width */
    document.body.classList.remove('drawer');
    if(rerender !== false){ render(); if(perf.on) repaginatePerform(); }
  }
  return eff;
}
function cycleDevice(){
  var i = DEVICE_MODES.indexOf(state.device);
  state.device = DEVICE_MODES[(i + 1) % DEVICE_MODES.length];
  try{ localStorage.setItem('ensembleDevice', state.device); }catch(e){}
  applyDevice(true);
}
/* the overlay-sidebar modes, used wherever the old width media query was */
function isNarrowMode(){
  var d = effectiveDevice();
  return d === 'tablet' || d === 'phone';
}

/* ---------------------------------------------------------------- sheet exit
   The overlay sidebar hides the toolbar that opened it, and at phone width it is
   the full viewport, so the scrim behind it cannot be tapped. Every opened sheet
   must therefore close from inside itself: a sticky 44px Done button, a
   swipe-down on the header, and Escape. */
function closeDrawer(){ document.body.classList.remove('drawer'); }
function sheetHeader(){
  var head = h('div','sb-head');
  head.appendChild(h('div','sb-grab'));
  head.appendChild(h('span','sb-title','Parts'));
  var done = h('button','sb-done','Done');
  done.setAttribute('aria-label','Close parts panel');
  done.addEventListener('click', closeDrawer);
  head.appendChild(done);

  /* swipe down to dismiss - the same Pointer Events the ink layer uses */
  var sy = null;
  head.addEventListener('pointerdown', function(e){
    if(e.target.closest('.sb-done')) return;
    sy = e.clientY;
    try{ head.setPointerCapture(e.pointerId); }catch(err){}
  });
  head.addEventListener('pointermove', function(e){
    if(sy == null) return;
    if(e.clientY - sy > 60){ sy = null; closeDrawer(); }
  });
  function endSwipe(e){
    if(sy == null) return;
    sy = null;
    try{ head.releasePointerCapture(e.pointerId); }catch(err){}
  }
  head.addEventListener('pointerup', endSwipe);
  head.addEventListener('pointercancel', endSwipe);
  return head;
}

/* ---------------------------------------------------------------- sidebar resize */
var SB_MIN = 240;
function sbMax(){ return Math.round(window.innerWidth * 0.5); }
function setSidebarWidth(px, persist){
  var w = Math.max(SB_MIN, Math.min(sbMax(), Math.round(px)));
  state.sidebarW = w;
  document.documentElement.style.setProperty('--sbw', w + 'px');
  if(persist){ try{ localStorage.setItem('ensembleSidebarW', String(w)); }catch(e){} }
  return w;
}
function initSidebarResize(){
  var sb = document.getElementById('sidebar');
  if(!sb || sb.querySelector('.sb-resize')) return;
  var handle = h('div','sb-resize');
  handle.setAttribute('aria-label','Resize parts panel');
  sb.appendChild(handle);
  var dragging = false, pending = false;
  function apply(clientX){
    var left = sb.getBoundingClientRect().left;
    setSidebarWidth(clientX - left, false);
    /* fit-width (100% zoom) is derived from the score area, so relayout live */
    if(!pending){
      pending = true;
      requestAnimationFrame(function(){ pending = false; render(); });
    }
  }
  handle.addEventListener('pointerdown', function(e){
    if(isNarrowMode()) return;                       /* overlay sidebar: no resize */
    dragging = true;
    document.body.classList.add('sbdrag');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function(e){
    if(!dragging) return;
    apply(e.clientX);
    e.preventDefault();
  });
  function end(e){
    if(!dragging) return;
    dragging = false;
    document.body.classList.remove('sbdrag');
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
    setSidebarWidth(state.sidebarW, true);   /* persist the settled width */
    render();
  }
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
  /* keep the width legal when the window changes */
  window.addEventListener('resize', function(){
    if(state.sidebarW) setSidebarWidth(state.sidebarW, false);
  });
}

function setWarm(on){
  state.warm = !!on;
  document.body.classList.toggle('warm', state.warm);
  var b = document.getElementById('btnWarm');
  if(b) b.className = 'btn ghost' + (state.warm ? ' on' : '');
  try{ localStorage.setItem('ensembleWarm', state.warm ? '1' : '0'); }catch(e){}
}

function setZoom(pct){
  var best = ZOOM_STOPS[0];
  for(var i=0;i<ZOOM_STOPS.length;i++){
    if(Math.abs(ZOOM_STOPS[i]-pct) < Math.abs(best-pct)) best = ZOOM_STOPS[i];
  }
  state.zoom = best;
  document.getElementById('zoomVal').textContent = state.zoom + '%';
  saveLocal();
  render();
  if(perf.on) repaginatePerform();
}
function stepZoom(dir){
  var i = ZOOM_STOPS.indexOf(state.zoom);
  if(i < 0){ setZoom(state.zoom); i = ZOOM_STOPS.indexOf(state.zoom); }
  setZoom(ZOOM_STOPS[Math.max(0, Math.min(ZOOM_STOPS.length-1, i + dir))]);
}

function buildAnnToolbars(){
  [['anntools', false], ['pfann', true]].forEach(function(pair){
    var host = document.getElementById(pair[0]);
    if(!host) return;
    host.textContent = '';
    ANN_COLORS.forEach(function(c){
      var b = h('button','inkdot'); b.dataset.c = c;
      var sp = document.createElement('span'); sp.style.background = c; b.appendChild(sp);
      b.addEventListener('click', function(){ ann.colour = c; ann.erasing = false; syncAnnUI(); });
      host.appendChild(b);
    });
    [['Fine',1],['Med',1.9]].forEach(function(w){
      var b = h('button','wbtn',w[0]); b.dataset.w = w[1];
      b.addEventListener('click', function(){ ann.width = w[1]; syncAnnUI(); });
      host.appendChild(b);
    });
    var er = h('button', pair[1] ? 'wbtn' : 'btn ghost', 'Erase');
    if(!pair[1]) er.id = 'btnErase';
    er.addEventListener('click', function(){ ann.erasing = !ann.erasing; syncAnnUI(); });
    host.appendChild(er);
    var un = h('button', pair[1] ? 'wbtn' : 'btn ghost', 'Undo');
    un.addEventListener('click', annUndo); host.appendChild(un);
    var re = h('button', pair[1] ? 'wbtn' : 'btn ghost', 'Redo');
    re.addEventListener('click', annRedo); host.appendChild(re);
    var ey = h('button', pair[1] ? 'wbtn' : 'btn ghost', 'Hide ink');
    if(!pair[1]) ey.id = 'btnEye';
    ey.addEventListener('click', function(){
      ann.visible = !ann.visible; syncAnnUI(); refreshAnnotations();
    });
    host.appendChild(ey);
    /* markings exchange lives with the annotation tools, not with the score
       exports - it is the reader's layer travelling, not the music. Performance
       mode's floating strip stays minimal, so it is skipped there. */
    if(!pair[1]){
      var ex = h('button','btn ghost','Save marks');
      ex.title = 'Export these markings as a file';
      ex.addEventListener('click', exportMarkings);
      host.appendChild(ex);
      var im = h('button','btn ghost','Load marks');
      im.title = 'Import markings from a file';
      im.addEventListener('click', pickMarkingsFile);
      host.appendChild(im);
    }
  });
  syncAnnUI();
}

/* ==========================================================================
   STAMP TRAY — the palette, shown while STAMP mode is active.
   Each button previews its own glyph (drawn from the same outline the score is
   engraved with) rather than naming it, so the palette reads as music.
   ========================================================================== */
function stampIcon(spec){
  var BOX = 26, PAD = 2;
  var svg = el('svg', {width:BOX, height:BOX, viewBox:'0 0 '+BOX+' '+BOX,
                       'aria-hidden':'true', focusable:'false'});
  if(spec.gl){
    var gd = GL.g[spec.gl];
    if(!gd) return svg;
    var b = gd.b, w = b[2]-b[0], hgt = b[3]-b[1];
    var s = Math.min((BOX-2*PAD)/(w||1), (BOX-2*PAD)/(hgt||1));
    /* centre the outline in the box; -s on y flips the font's y-up outline */
    var tx = BOX/2 - ((b[0]+b[2])/2)*s;
    var ty = BOX/2 + ((b[1]+b[3])/2)*s;
    svg.appendChild(el('path', {d:gd.d, fill:'currentColor',
      transform:'translate('+r2(tx)+','+r2(ty)+') scale('+r4(s)+','+r4(-s)+')'}));
  } else {
    /* a miniature of the hairpin the button places */
    var y = BOX/2, x0 = PAD+1, x1 = BOX-PAD-1, ap = 4.5;
    var apx = (spec.hp > 0) ? x0 : x1, opx = (spec.hp > 0) ? x1 : x0;
    svg.appendChild(el('path', {
      d:'M '+opx+' '+(y-ap)+' L '+apx+' '+y+' L '+opx+' '+(y+ap),
      fill:'none', stroke:'currentColor', 'stroke-width':1.4,
      'stroke-linecap':'round', 'stroke-linejoin':'round'}));
  }
  return svg;
}
function stampButton(spec){
  var b = h('button','stampbtn');
  b.dataset.k = spec.k;
  b.title = spec.t;
  b.setAttribute('aria-label', spec.t);
  b.appendChild(stampIcon(spec));
  b.addEventListener('click', function(){
    ann.stamp = spec.k;
    ann.erasing = false;
    ann.selId = null;
    syncAnnUI();
    refreshAnnotations();
  });
  return b;
}
function buildStampTray(){
  var host = document.getElementById('stamptray');
  if(!host) return;
  host.textContent = '';
  host.appendChild(h('span','mb-label','Stamp'));
  STAMPS.forEach(function(s){ host.appendChild(stampButton(s)); });
}

/* PHONE mode bar: one compact, non-wrapping row of the active mode's tools plus a
   fixed EXIT at the end. Rebuilt per mode so the row stays short enough to need no
   wrapping - wrapping was what crushed the piece tabs and hid the DRAW toggle. */
function buildModeBar(){
  var host = document.getElementById('mbtools');
  if(!host) return;
  host.textContent = '';
  if(!ann.mode) return;
  var LABEL = {draw:'Draw', text:'Text', ear:'Ear · tap a notehead', stamp:'Stamp'};
  host.appendChild(h('span','mb-label', LABEL[ann.mode] || ''));
  if(ann.mode === 'ear') return;          /* EAR has no tools, only an exit */

  /* the palette leads the row: it is what the reader reaches for most */
  if(ann.mode === 'stamp') STAMPS.forEach(function(s){ host.appendChild(stampButton(s)); });

  ANN_COLORS.forEach(function(c){
    var b = h('button','inkdot'); b.dataset.c = c;
    var sp = document.createElement('span'); sp.style.background = c; b.appendChild(sp);
    b.addEventListener('click', function(){ ann.colour = c; ann.erasing = false; syncAnnUI(); });
    host.appendChild(b);
  });
  if(ann.mode === 'draw'){
    [['Fine',1],['Med',1.9]].forEach(function(w){
      var b = h('button','wbtn',w[0]); b.dataset.w = w[1];
      b.addEventListener('click', function(){ ann.width = w[1]; syncAnnUI(); });
      host.appendChild(b);
    });
  }
  var er = h('button','wbtn','Erase'); er.id = 'mbErase';
  er.addEventListener('click', function(){ ann.erasing = !ann.erasing; syncAnnUI(); });
  host.appendChild(er);
  var un = h('button','wbtn','Undo'); un.addEventListener('click', annUndo); host.appendChild(un);
  var re = h('button','wbtn','Redo'); re.addEventListener('click', annRedo); host.appendChild(re);
  var ey = h('button','wbtn','Hide ink'); ey.id = 'mbEye';
  ey.addEventListener('click', function(){
    ann.visible = !ann.visible; syncAnnUI(); refreshAnnotations();
  });
  host.appendChild(ey);
}

function boot(){
  loadLocal();
  loadAnnots();
  applyHash();
  buildTabs();
  buildSidebar();
  buildAnnToolbars();
  buildStampTray();
  setWarm(state.warm);
  setSidebarWidth(state.sidebarW, false);
  applyDevice(false);
  initSidebarResize();
  loadTuner();
  /* a mobile browser may correct its viewport just after load */
  setTimeout(function(){ if(state.device === 'auto') applyDevice(true); }, 350);
  document.getElementById('zoomVal').textContent = state.zoom+'%';
  render();

  document.getElementById('zoomIn').addEventListener('click', function(){ stepZoom(1); });
  document.getElementById('zoomOut').addEventListener('click', function(){ stepZoom(-1); });
  document.getElementById('btnPrint').addEventListener('click', doPrint);
  document.getElementById('btnSvg').addEventListener('click', exportSVG);
  document.getElementById('btnXml').addEventListener('click', exportMusicXML);
  document.getElementById('btnPerform').addEventListener('click', enterPerform);
  document.getElementById('pfexit').addEventListener('click', exitPerform);
  document.getElementById('btnWarm').addEventListener('click', function(){ setWarm(!state.warm); });
  document.getElementById('btnDevice').addEventListener('click', cycleDevice);
  document.getElementById('btnMenu').addEventListener('click', function(e){
    e.stopPropagation();
    document.body.classList.toggle('menu');
  });
  document.addEventListener('click', function(e){
    if(!document.body.classList.contains('menu')) return;
    if(e.target.closest('#tbfold') || e.target.closest('#btnMenu')) return;
    document.body.classList.remove('menu');
  });
  document.getElementById('btnDraw').addEventListener('click', function(){ setMode('draw'); });
  document.getElementById('btnText').addEventListener('click', function(){ setMode('text'); });
  document.getElementById('btnEar').addEventListener('click', function(){ earAC(); setMode('ear'); });
  document.getElementById('btnStamp').addEventListener('click', function(){ setMode('stamp'); });
  document.getElementById('btnExportMarks').addEventListener('click', exportMarkings);
  document.getElementById('btnImportMarks').addEventListener('click', pickMarkingsFile);
  document.getElementById('marksfile').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ importMarkings(String(rd.result)); };
    rd.onerror = function(){ toast('Could not read that file.'); };
    rd.readAsText(f);
  });
  document.getElementById('btnTuner').addEventListener('click', toggleTuner);
  document.getElementById('tunerclose').addEventListener('click', toggleTuner);
  document.getElementById('tuneropacity').addEventListener('input', function(){
    tuner.op = (+this.value)/100;
    document.getElementById('tunerpanel').style.opacity = tuner.op;
    saveTuner();
  });
  (function tunerDrag(){
    var bar = document.getElementById('tunerbar'), panel = document.getElementById('tunerpanel');
    var dx=0, dy=0, on=false;
    bar.addEventListener('pointerdown', function(e){
      if(e.target.closest('.tp-x') || e.target.closest('.tp-op')) return;
      on=true; dx=e.clientX-panel.offsetLeft; dy=e.clientY-panel.offsetTop;
      try{ bar.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    bar.addEventListener('pointermove', function(e){
      if(!on) return;
      tuner.x = e.clientX-dx; tuner.y = e.clientY-dy;
      placeTuner(); e.preventDefault();
    });
    bar.addEventListener('pointerup', function(){ if(on){ on=false; saveTuner(); } });
  })();
  var editBox = document.getElementById('annedit');
  editBox.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); commitTextEditor(); }
    else if(e.key === 'Escape'){ e.preventDefault(); closeTextEditor(); }
  });
  editBox.addEventListener('blur', commitTextEditor);
  document.getElementById('pfdraw').addEventListener('click', function(ev){
    ev.stopPropagation();
    setDrawMode(!ann.on);
    document.getElementById('pfdraw').className = 'pfdraw' + (ann.on ? ' on' : '');
  });
  document.getElementById('btnSidebar').addEventListener('click', function(){
    if(isNarrowMode()){
      /* the sheet covers the fold menu, so close the menu with it */
      document.body.classList.remove('menu');
      document.body.classList.toggle('drawer');
    } else {
      document.body.classList.toggle('nosidebar');
      setTimeout(render, 260);
    }
  });
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.getElementById('mbexit').addEventListener('click', function(){ setMode(''); });
  window.addEventListener('hashchange', function(){
    if(suppressHash) return;
    if(applyHash()){ buildTabs(); registry.length=0; buildSidebar(); render(); }
  });
  /* Resize handling. Mobile Safari collapses and expands its URL bar as the reader
     scrolls, firing resize with the WIDTH UNCHANGED. Fit-width cannot have changed,
     so re-rendering on those is pure loss: it rebuilds the score and costs the
     reader their place. Only genuine width (or device-mode) changes rebuild. */
  var rt=null, lastW = window.innerWidth;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      var w = window.innerWidth;
      var widthChanged = (w !== lastW);
      lastW = w;
      var prevDev = document.body.getAttribute('data-dev');
      if(state.device === 'auto') applyDevice(false);
      var devChanged = document.body.getAttribute('data-dev') !== prevDev;
      if(perf.on){ repaginatePerform(); return; }   /* perform fits the height too */
      if(!widthChanged && !devChanged){
        ensureRendered(); updatePageHint(); return;  /* height-only: hold position */
      }
      render();
    }, 200);
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ if(perf.on) repaginatePerform(); else render(); }, 260);
  });
  window.addEventListener('beforeprint', function(){ if(!printHost) buildPrintPages(); });
  window.addEventListener('afterprint', cleanupPrint);

  /* expose a tiny API for automated verification */
  window.ENSEMBLE = {
    state: state, D: D,
    layout: function(){ return currentLayout; },
    paginate: paginate,
    title: function(){ return selectionTitle(piece()); },
    select: function(map){
      var p = piece(); state.sel[p.id] = {};
      for(var k in map) state.sel[p.id][+k] = map[k];
      commit();
    },
    setPiece: function(i){ state.piece=i; buildTabs(); registry.length=0; buildSidebar(); commit(); },
    perform: enterPerform, exitPerform: exitPerform, turnPage: turnPage,
    perf: perf,
    ann: ann, annots: function(){ return state.annots; },
    setDrawMode: setDrawMode, setMode: setMode, annUndo: annUndo, annRedo: annRedo,
    setSidebarWidth: setSidebarWidth,
    cycleDevice: cycleDevice, applyDevice: applyDevice,
    effectiveDevice: effectiveDevice,
    closeDrawer: closeDrawer,
    touchDrawOK: touchDrawOK,
    penSeen: function(){ return PEN_SEEN; },
    render: render,
    setDevice: function(d){ state.device=d; try{localStorage.setItem('ensembleDevice',d);}catch(e){} return applyDevice(true); },
    earFreq: earFreq, earPlay: earPlay, toggleTuner: toggleTuner, tuner: tuner,
    soundingMidi: soundingMidi,
    anchorAt: anchorAt, pointFor: pointFor,
    addStroke: function(s){ annPush(s); refreshAnnotations(); },
    /* stamps + markings exchange */
    STAMPS: STAMPS,
    setStamp: function(k){ ann.stamp = k; syncAnnUI(); return ann.stamp; },
    placeStamp: placeStamp,
    stampHit: stampHit, hairpinGeom: hairpinGeom, stampBox: stampBox,
    exportMarkings: exportMarkings, importMarkings: importMarkings,
    marksString: function(){
      var p = piece();
      return JSON.stringify({format:MARKS_FORMAT, version:MARKS_VERSION, piece:p.id,
        pieceTitle:p.title, exported:new Date().toISOString(),
        items:JSON.parse(JSON.stringify(state.annots[p.id] || []))}, null, 2);
    },
    clearMarks: function(){
      var p = piece();
      state.annots[p.id] = []; ann.undo[p.id] = []; ann.redo[p.id] = [];
      saveAnnots(); refreshAnnotations();
    },
    renderAll: function(){ if(currentLayout) renderAllSync(currentLayout); },
    musicXMLString: buildMusicXML,
    svgString: buildSVG,
    fileBase: fileBase,
    buildPrintPages: buildPrintPages, cleanupPrint: cleanupPrint
  };
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
