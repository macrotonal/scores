<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Golden Hour - Saxophone Hocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{color-scheme:light;
  --bg:#014b4a;--text:#d4e8d8;
  --text-dim:rgba(212,232,216,0.48);--text-faint:rgba(212,232,216,0.22);
  --border:rgba(46,139,87,0.15);--card:rgba(10,16,12,0.96);
  --green:#2e8b57;--gl:#5fb88a;
  --red:#ff6b55;--yellow:#ffd84a;--green-note:#4ed87a;--blue:#5ab4ff;
  --ff:'Futura','Century Gothic','Trebuchet MS',sans-serif;
}
html,body{background:#014b4a!important;color:var(--text);
  font-family:var(--ff);
  min-height:100vh;overflow-x:hidden;}
body{padding:16px 12px 48px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:none;}
.frame{display:none}
.wrap{position:relative;max-width:660px;margin:0 auto;}

.header{text-align:center;margin-bottom:6px;}
.eyebrow{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:7px;text-transform:uppercase;color:rgba(46,139,87,0.45);margin-bottom:6px;display:block;}
h1{font-family:var(--ff);font-size:clamp(13px,2.8vw,18px);font-weight:300;letter-spacing:0.12em;color:#e8f5ec;text-transform:uppercase;}
.rule{display:none}

#circ-canvas{display:block;width:100%;max-width:460px;margin:0 auto;}

.transport{
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin:10px auto 0;max-width:620px;
}
.btn-skip{
  background:#fff;border:2px solid #111;color:#111;border-radius:4px;
  font-family:'Space Mono',monospace;cursor:pointer;transition:all 0.2s;
  width:80px;height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;flex-shrink:0;
}
.btn-skip .arrow{font-size:15px;line-height:1;color:#111;}
.btn-skip .label{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:#111;opacity:0.7;}
.btn-play{
  background:#fff;border:2px solid #111;color:#111;border-radius:4px;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;
  cursor:pointer;transition:all 0.2s;
  width:120px;height:52px;
  display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;
}
.btn-play.playing{background:#2e8b57;border-color:#2e8b57;color:#fff;}
@media(hover:hover){
  .btn-skip:hover{background:#acc6a1;border-color:#111;}
  .btn-play:hover{background:#2e8b57;border-color:#2e8b57;color:#fff;}
}
.btn-play .play-icon{font-size:18px;line-height:1;}

.controls{
  background:#fff;border:2px solid #111;border-radius:4px;
  padding:7px 12px;margin:8px auto 0;max-width:620px;
  display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
}
.ctrl-btn.sync-ok{background:#2e8b57;border-color:#2e8b57;color:#fff;}
.ctrl-btn.sync-err{background:#fff;border-color:#ff6b55;color:#ff6b55;}
.sync-lock{opacity:0.3;pointer-events:none;}
.ctrl-btn{
  background:#fff;border:2px solid #111;color:#111;padding:4px 12px;border-radius:4px;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
@media(hover:hover){.ctrl-btn:hover{background:#2e8b57;border-color:#2e8b57;color:#fff;}}
.ctrl-btn.on{background:#2e8b57;border-color:#2e8b57;color:#fff;}
.ctrl-group{display:flex;align-items:center;gap:5px;font-family:'Space Mono',monospace;font-size:9px;color:#111;letter-spacing:0.06em;text-transform:uppercase;}
.voice-sax{padding:4px 8px;}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:55px;height:2px;
  background:rgba(0,0,0,0.15);border-radius:1px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
  background:#2e8b57;cursor:pointer;
}
#tl-canvas{
  display:block;width:100%;max-width:620px;margin:8px auto 0;
  border:2px solid #111;border-radius:4px;background:#fff;cursor:pointer;
}
.progress-wrap{max-width:620px;margin:6px auto 0;height:3px;background:rgba(17,17,17,0.12);border-radius:2px;overflow:hidden;}
.progress-bar{height:100%;background:#2e8b57;width:0%;}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto 0;max-width:620px;}
.legend-item{display:flex;align-items:center;gap:5px;font-family:'Space Mono',monospace;font-size:8px;color:var(--text-faint);letter-spacing:0.08em;text-transform:uppercase;}
.ldot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* Footer home link */
.footer-nav{text-align:center;padding:24px 0 16px;}
.home-link{
  display:inline-block;background:#fff;border:2px solid #111;color:#111;
  padding:8px 20px;border-radius:4px;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;
  text-decoration:none;transition:all 0.2s;
}
@media(hover:hover){.home-link:hover{background:#2e8b57;border-color:#2e8b57;color:#fff;}}

</style>
</head>
<body>
<div class="frame"></div>
<div class="wrap">
  
<div class="header">
    <span class="eyebrow">Golden Hour</span>
    <h1>Saxophone Hocket</h1>
    <div class="rule"></div>
  </div>
  <canvas id="circ-canvas"></canvas>

  <!-- Primary transport -->
  <div class="transport">
    <button class="btn-skip" id="h-skip-back">
      <span class="arrow">&#171;</span>
      <span class="label">−1 Bar</span>
    </button>
    <button class="btn-play" id="h-play">
      <span class="play-icon">&#9654;</span>
      <span>Play</span>
    </button>
    <button class="btn-skip" id="h-skip-fwd">
      <span class="arrow">&#187;</span>
      <span class="label">+1 Bar</span>
    </button>
  </div>

  <!-- Secondary controls -->
  <div class="controls">
    <button class="ctrl-btn" id="h-reset">&#8635; Reset</button>
    <div class="ctrl-group">
      <label for="h-speed">Speed</label>
      <input type="range" id="h-speed" min="0.25" max="3" step="0.25" value="1">
      <span id="h-speed-out">1×</span>
    </div>
    <button class="ctrl-btn" id="metro-toggle">&#9688; Click</button>
    <div class="ctrl-group">
      <label for="h-vol">Vol</label>
      <input type="range" id="h-vol" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="ctrl-group">
      <label for="h-lookahead">Ahead</label>
      <input type="range" id="h-lookahead" min="1" max="6" step="0.5" value="3">
      <span id="h-lookahead-out">3 bars</span>
    </div>
    <button class="ctrl-btn" id="sync-toggle">&#9737; Sync</button>
    <div class="ctrl-group" id="voice-group">
      <label>Voice</label>
      <button class="ctrl-btn voice-sax" data-i="0">S1</button>
      <button class="ctrl-btn voice-sax" data-i="1">S2</button>
      <button class="ctrl-btn voice-sax" data-i="2">S3</button>
      <button class="ctrl-btn voice-sax" data-i="3">S4</button>
    </div>
    <button class="ctrl-btn" id="sync-sound" style="display:none">&#9836; Sound</button>
    <div class="ctrl-group" id="nudge-group" style="display:none">
      <label for="h-nudge">Nudge</label>
      <input type="range" id="h-nudge" min="-200" max="200" step="5" value="0">
      <span id="h-nudge-out">0ms</span>
    </div>
  </div>
  <canvas id="tl-canvas"></canvas>
  <div class="progress-wrap"><div class="progress-bar" id="h-bar"></div></div>
  <div class="legend">
    <div class="legend-item"><span class="ldot" style="background:var(--red);"></span>Red 0¢</div>
    <div class="legend-item"><span class="ldot" style="background:var(--blue);"></span>Blue −25¢</div>
    <div class="legend-item"><span class="ldot" style="background:var(--green);"></span>Green +25¢</div>
    <div class="legend-item"><span class="ldot" style="background:var(--yellow);"></span>Yellow −50¢</div>
  </div>
</div>
<script>
(function(){
  const BPM=95,TPB=96,TICK_MS=(60000/BPM)/TPB,MAX_TICK=71424;
  const BEATS_PER_BAR=4,TPB_BAR=TPB*BEATS_PER_BAR;
  const FF="'Futura','Century Gothic','Trebuchet MS',sans-serif";
  const FM="'Space Mono','Courier New',monospace";
  const COL={red:'#ff6b55',yellow:'#ffd84a',green:'#4ed87a',blue:'#5ab4ff'};
  const CENT_OFFSETS={[COL.red]:0,[COL.blue]:-25,[COL.green]:25,[COL.yellow]:-50};
  const NC={};
  [[45,COL.red],[46,COL.yellow],[48,COL.green],[49,COL.blue],
   [50,COL.red],[51,COL.yellow],[53,COL.green],[54,COL.blue],
   [55,COL.red],[56,COL.yellow],[58,COL.green],[59,COL.blue],
   [60,COL.red],[61,COL.yellow],[63,COL.green],[64,COL.blue]
  ].forEach(([p,c])=>NC[p]=c);
  const nc=p=>NC[p]||COL.red;
  const NN=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const nn=p=>NN[p%12]+(Math.floor(p/12)-1);
  const mhz=(m,c)=>440*Math.pow(2,(m-69+c/100)/12);

  const PARTS=[
    {name:'Sax 1',events:[
      {s:0,e:2304,n:45},{s:2304,e:3073,n:55},{s:3072,e:3840,n:54},{s:3840,e:5376,n:60},
      {s:5376,e:6144,n:55},{s:6144,e:8448,n:50},{s:8448,e:9216,n:55},{s:9216,e:11520,n:45},
      {s:11520,e:12288,n:55},{s:12288,e:14592,n:60},{s:14592,e:15360,n:55},{s:15360,e:17664,n:50},
      {s:17664,e:18432,n:55},{s:18432,e:20736,n:45},{s:20736,e:21504,n:55},{s:21504,e:23808,n:60},
      {s:23808,e:24576,n:55},{s:24576,e:26880,n:50},{s:26880,e:27648,n:55},{s:27648,e:29952,n:45},
      {s:29952,e:30720,n:55},{s:31488,e:33024,n:45},{s:33792,e:36864,n:50},{s:37632,e:40704,n:45},
      {s:41472,e:43776,n:54},{s:45312,e:49920,n:50},{s:55296,e:56064,n:54},{s:57600,e:58368,n:55},
      {s:60672,e:61440,n:55},{s:62208,e:71424,n:45}
    ]},
    {name:'Sax 2',events:[
      {s:0,e:1536,n:50},{s:1536,e:2304,n:54},{s:2304,e:4608,n:45},{s:4608,e:5376,n:54},
      {s:5376,e:7680,n:60},{s:7680,e:8448,n:54},{s:8448,e:10752,n:50},{s:10752,e:11520,n:54},
      {s:11520,e:13824,n:45},{s:13824,e:14592,n:54},{s:14592,e:16896,n:60},{s:16896,e:17664,n:54},
      {s:17664,e:19968,n:50},{s:19968,e:20736,n:54},{s:20736,e:23040,n:45},{s:23040,e:23808,n:54},
      {s:23808,e:26112,n:60},{s:26112,e:26880,n:54},{s:26880,e:29184,n:50},{s:29184,e:29952,n:54},
      {s:29952,e:31488,n:45},{s:32256,e:35328,n:54},{s:36864,e:39936,n:50},{s:43776,e:46848,n:54},
      {s:48384,e:54528,n:45},{s:54528,e:55296,n:55},{s:55296,e:56832,n:50},{s:56832,e:57600,n:54},
      {s:57600,e:59904,n:45},{s:59904,e:60672,n:54},{s:61440,e:62976,n:50},{s:62976,e:64512,n:54}
    ]},
    {name:'Sax 3',events:[
      {s:0,e:1536,n:55},{s:1536,e:3840,n:50},{s:3840,e:4608,n:55},{s:4608,e:6912,n:45},
      {s:6912,e:7680,n:55},{s:7680,e:9984,n:60},{s:9984,e:10752,n:55},{s:10752,e:13056,n:50},
      {s:13056,e:13824,n:55},{s:13824,e:16128,n:45},{s:16128,e:16896,n:55},{s:16896,e:19200,n:60},
      {s:19200,e:19968,n:55},{s:19968,e:22272,n:50},{s:22272,e:23040,n:55},{s:23040,e:25344,n:45},
      {s:25344,e:26112,n:55},{s:26112,e:28416,n:60},{s:28416,e:29184,n:55},{s:29184,e:33792,n:50},
      {s:34560,e:37632,n:45},{s:39936,e:45312,n:50},{s:46848,e:49920,n:54},{s:49920,e:54528,n:50},
      {s:54528,e:56064,n:45},{s:56064,e:56832,n:55},{s:56832,e:59136,n:50},{s:59136,e:59904,n:55},
      {s:59904,e:62208,n:45},{s:62208,e:62976,n:55}
    ]},
    {name:'Sax 4',events:[
      {s:0,e:3840,n:60},{s:3840,e:6144,n:50},{s:6144,e:6912,n:54},{s:6912,e:9216,n:45},
      {s:9216,e:9984,n:54},{s:9984,e:12288,n:60},{s:12288,e:13047,n:54},{s:13056,e:15360,n:50},
      {s:15360,e:16119,n:54},{s:16128,e:18432,n:45},{s:18432,e:19191,n:54},{s:19200,e:21504,n:60},
      {s:21504,e:22272,n:54},{s:22272,e:24576,n:50},{s:24576,e:25344,n:54},{s:25344,e:27648,n:45},
      {s:27648,e:28416,n:54},{s:30720,e:32256,n:54},{s:33024,e:34560,n:45},{s:35328,e:41472,n:54},
      {s:43008,e:48384,n:45},{s:49920,e:53760,n:55},{s:53760,e:54528,n:54},{s:54528,e:55296,n:50},
      {s:56064,e:57600,n:45},{s:58368,e:59136,n:54},{s:59136,e:61440,n:50},{s:61440,e:62208,n:54},
      {s:62592,e:71424,n:50}
    ]}
  ];

  const PNAMES=['Sax 1','Sax 2','Sax 3','Sax 4'];
  let tick=0,playing=false,lastTime=null,speed=1,raf=null;
  let audioCtx=null,masterGain=null;
  let oscNodes=[null,null,null,null],gainNodes=[null,null,null,null],activeNotes=[null,null,null,null];
  let soloState=[false,false,false,false];
  let metroOn=false,lastBeat=-1,lookahead=3;

  function initAudio(){
    if(audioCtx)return;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=parseFloat(document.getElementById('h-vol').value);
    masterGain.connect(audioCtx.destination);
  }
  function getPartGain(i){return(soloState.some(Boolean)&&!soloState[i])?0:0.18;}
  function startNote(i,midi){
    stopNote(i);
    const col=nc(midi),cents=CENT_OFFSETS[col]||0;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type='sine';osc.frequency.value=mhz(midi,cents);
    const now=audioCtx.currentTime;
    gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(getPartGain(i),now+0.04);
    osc.connect(gain);gain.connect(masterGain);osc.start();
    oscNodes[i]=osc;gainNodes[i]=gain;
  }
  function stopNote(i){
    if(!oscNodes[i])return;
    const now=audioCtx.currentTime;
    gainNodes[i].gain.setValueAtTime(gainNodes[i].gain.value,now);
    gainNodes[i].gain.linearRampToValueAtTime(0,now+0.06);
    const o=oscNodes[i];setTimeout(()=>{try{o.stop();}catch(e){}},120);
    oscNodes[i]=null;gainNodes[i]=null;
  }
  function stopAllNotes(){for(let i=0;i<4;i++)stopNote(i);activeNotes=[null,null,null,null];}
  function refreshGains(){
    for(let i=0;i<4;i++){
      if(gainNodes[i]){
        const now=audioCtx.currentTime;
        gainNodes[i].gain.cancelScheduledValues(now);
        gainNodes[i].gain.setValueAtTime(gainNodes[i].gain.value,now);
        gainNodes[i].gain.linearRampToValueAtTime(getPartGain(i),now+0.05);
      }
    }
  }
  function playMetroClick(beat,when){
    if(!audioCtx||!metroOn)return;
    const down=((beat%BEATS_PER_BAR)+BEATS_PER_BAR)%BEATS_PER_BAR===0;
    const t=Math.max(when||audioCtx.currentTime,audioCtx.currentTime);
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.type='sine';osc.frequency.value=down?1320:880;
    g.gain.setValueAtTime(down?0.4:0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(g);g.connect(masterGain);osc.start(t);osc.stop(t+0.09);
  }

  function getActive(part,t){for(let ev of part.events)if(t>=ev.s&&t<ev.e)return ev;return null;}
  function getNext(part,t){let n=null,d=Infinity;for(let ev of part.events)if(ev.s>t&&ev.s-t<d){d=ev.s-t;n=ev.n;}return n;}

  // Returns ticks until this part's current note ends (or until next note starts if resting)
  function ticksUntilChange(part,t){
    const ev=getActive(part,t);
    if(ev)return ev.e-t;
    // resting - find next note start
    let d=Infinity;
    for(let e of part.events)if(e.s>t&&e.s-t<d)d=e.s-t;
    return d;
  }

  function updateAudio(t,withClick){
    if(!audioCtx)return;
    PARTS.forEach((part,i)=>{
      const ev=getActive(part,t),midi=ev?ev.n:null;
      if(midi!==activeNotes[i]){activeNotes[i]=midi;midi!==null?startNote(i,midi):stopNote(i);}
    });
    if(withClick===false)return;
    const beat=Math.floor(t/TPB);
    if(beat!==lastBeat){lastBeat=beat;playMetroClick(beat);}
  }

  // ── CIRCLE CANVAS ──────────────────────────────────────────────
  const ccan=document.getElementById('circ-canvas'),cctx=ccan.getContext('2d');
  const angles=[-Math.PI/2,0,Math.PI/2,Math.PI];

  function resizeCircle(){
    const maxW=Math.min(460,window.innerWidth-24);
    ccan.width=maxW;ccan.height=Math.round(maxW*0.82);
    drawCircle(tick);
  }

  function drawCircle(t){
    const S=ccan.width,CX=S/2,CY=ccan.height/2;
    const RING_R=S*0.25;
    const NODE_R=S*0.088;
    const ARC_R=NODE_R+S*0.03;

    cctx.clearRect(0,0,S,ccan.height);

    // Beat pulse - always present but subtle
    const beatPos=t%TPB;
    const beatDecay=Math.max(0,1-(beatPos/(TPB*0.3)));
    const isDown=(Math.floor(t/TPB)%BEATS_PER_BAR)===0;
    const globalPulse=isDown?beatDecay*0.6:beatDecay*0.3;

    const inCI=t<0;
    const barNum=Math.floor(t/TPB_BAR)+1;
    const beatInBar=((Math.floor(t/TPB)%BEATS_PER_BAR)+BEATS_PER_BAR)%BEATS_PER_BAR+1;
    const COUNT_IN_TICKS=TPB_BAR*1; // 1 bar (4 beats) countdown

    // Guide circle
    cctx.save();
    cctx.strokeStyle=`rgba(74,158,104,${0.07+globalPulse*0.08})`;
    cctx.lineWidth=0.5+globalPulse;cctx.setLineDash([3,7]);
    cctx.beginPath();cctx.arc(CX,CY,RING_R,0,Math.PI*2);cctx.stroke();
    cctx.setLineDash([]);cctx.restore();

    PARTS.forEach((part,i)=>{
      const ang=angles[i];
      const px=CX+RING_R*Math.cos(ang),py=CY+RING_R*Math.sin(ang);
      const ev=getActive(part,t);
      const active=ev?ev.n:null;
      const noteC=active!==null?nc(active):null;
      const muted=soloState.some(Boolean)&&!soloState[i];

      // Count-in pulse: only fires in last 2 bars before note ends/starts
      const tuc=ticksUntilChange(part,t);
      const inCountIn=tuc<=COUNT_IN_TICKS;
      const countInProgress=inCountIn?Math.max(0,1-(tuc/COUNT_IN_TICKS)):0;
      // Beat pulse only active during count-in window
      const ringPulse=inCountIn?(isDown?beatDecay:beatDecay*0.5):0;
      const pulseW=inCountIn?(S*0.02+ringPulse*S*0.01):S*0.02;

      if(ev!==null){
        const remaining=Math.max(0,1-((t-ev.s)/(ev.e-ev.s)));

        // Track ring
        cctx.save();
        cctx.strokeStyle=`rgba(212,232,216,${0.06+ringPulse*0.06})`;
        cctx.lineWidth=pulseW;
        cctx.beginPath();cctx.arc(px,py,ARC_R,0,Math.PI*2);cctx.stroke();
        cctx.restore();

        // Countdown arc
        cctx.save();
        cctx.strokeStyle=muted?'rgba(212,232,216,0.07)':noteC;
        cctx.lineWidth=pulseW;cctx.lineCap='round';
        cctx.globalAlpha=muted?0.12:(0.82+ringPulse*0.18);
        cctx.beginPath();
        cctx.arc(px,py,ARC_R,-Math.PI/2,-Math.PI/2+Math.PI*2*remaining);
        cctx.stroke();cctx.restore();

        // Tip dot
        if(!muted){
          const tipAng=-Math.PI/2+Math.PI*2*remaining;
          cctx.save();
          cctx.fillStyle='rgba(212,232,216,0.85)';
          cctx.beginPath();cctx.arc(
            px+ARC_R*Math.cos(tipAng),py+ARC_R*Math.sin(tipAng),
            S*0.006+ringPulse*S*0.004,0,Math.PI*2
          );cctx.fill();cctx.restore();
        }

        // Count-in glow on ring - intensifies as change approaches
        if(inCountIn&&!muted){
          cctx.save();
          cctx.strokeStyle=noteC;
          cctx.lineWidth=S*0.005;
          cctx.globalAlpha=countInProgress*0.3*Math.max(0,1-(beatPos/(TPB*0.5)));
          cctx.beginPath();cctx.arc(px,py,ARC_R+S*0.01,0,Math.PI*2);cctx.stroke();
          cctx.restore();
        }

      } else {
        // Idle ring
        cctx.save();
        cctx.strokeStyle=`rgba(74,158,104,${0.05+ringPulse*0.12})`;
        cctx.lineWidth=inCountIn?(S*0.004+ringPulse*S*0.006):S*0.003;
        cctx.beginPath();cctx.arc(px,py,ARC_R,0,Math.PI*2);cctx.stroke();
        cctx.restore();
      }

      // Node fill
      cctx.save();
      if(active!==null&&!muted){
        cctx.shadowColor=noteC;
        cctx.shadowBlur=S*0.025+ringPulse*S*0.02;
      }
      cctx.beginPath();cctx.arc(px,py,NODE_R,0,Math.PI*2);
      cctx.fillStyle=active!==null?(muted?'rgba(18,26,20,0.9)':noteC):'rgba(10,16,12,0.95)';
      cctx.fill();
      cctx.strokeStyle=active!==null&&!muted?noteC:'rgba(74,158,104,0.14)';
      cctx.lineWidth=active!==null?1.5:0.5;cctx.stroke();cctx.restore();

      // Note name + player name + cents - all inside node
      if(active!==null){
        const isY=noteC===COL.yellow;
        const cents=CENT_OFFSETS[noteC]||0;
        const textCol=muted?'rgba(212,232,216,0.1)':(isY?'rgba(10,10,8,0.9)':'rgba(7,10,8,0.92)');
        const noteSize=Math.max(12,S*0.058);
        const nameSize=Math.max(9,S*0.026);
        cctx.save();cctx.textAlign='center';cctx.textBaseline='middle';
        // Note name - upper portion of node
        cctx.font=`700 ${noteSize}px ${FF}`;
        cctx.fillStyle=textCol;
        cctx.fillText(nn(active),px,py-noteSize*0.22);
        // Cents - below note name
        if(cents!==0&&!muted){
          cctx.font=`400 ${Math.max(7,S*0.017)}px ${FF}`;
          cctx.fillStyle=isY?'rgba(10,10,8,0.5)':'rgba(7,10,8,0.45)';
          cctx.fillText((cents>0?'+':'')+cents+'¢',px,py+noteSize*0.38);
        }
        // Player name - bottom of node
        cctx.font=`700 ${nameSize}px ${FM}`;
        cctx.fillStyle=soloState[i]?'rgba(255,255,255,0.95)':(isY?'rgba(10,10,8,0.75)':'rgba(255,255,255,0.9)');
        cctx.fillText(part.name,px,py+noteSize*0.75+(cents!==0?nameSize*0.6:0));
        cctx.restore();
      }

      // Idle - next note hint + player name inside node
      if(active===null){
        const nxt=getNext(part,t);
        const nameSize=Math.max(9,S*0.026);
        cctx.save();cctx.textAlign='center';cctx.textBaseline='middle';
        if(nxt!==null){
          cctx.font=`400 ${Math.max(8,S*0.02)}px ${FF}`;
          cctx.fillStyle='rgba(255,255,255,0.35)';
          cctx.fillText('→ '+nn(nxt),px,py-nameSize*0.6);
        }
        // Player name always visible even when idle
        cctx.font=`700 ${nameSize}px ${FM}`;
        cctx.fillStyle=soloState[i]?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.75)';
        cctx.fillText(part.name,px,py+(nxt!==null?nameSize*0.9:0));
        cctx.restore();
      }
    });

    // Centre - bar number + beat dots (or count-in)
    cctx.save();cctx.textAlign='center';cctx.textBaseline='middle';
    cctx.font=`400 ${S*0.016}px ${FF}`;
    if(inCI){
      const beatsLeft=Math.ceil(-t/TPB);
      cctx.fillStyle='rgba(255,216,74,0.8)';
      cctx.fillText('COUNT-IN',CX,CY-S*0.09);
      cctx.font=`300 ${S*0.13}px ${FF}`;
      cctx.fillStyle=`rgba(255,216,74,${0.75+globalPulse*0.25})`;
      cctx.fillText(beatsLeft,CX,CY-S*0.016);
    } else {
      cctx.fillStyle='rgba(255,255,255,0.45)';
      cctx.fillText('BAR',CX,CY-S*0.09);
      cctx.font=`300 ${S*0.105}px ${FF}`;
      cctx.fillStyle=`rgba(255,255,255,${0.7+globalPulse*0.3})`;
      cctx.fillText(barNum,CX,CY-S*0.016);
    }
    const dotSp=S*0.026,dotY=CY+S*0.05,dotR=S*0.0065;
    for(let d=0;d<4;d++){
      const dx=CX+(d-1.5)*dotSp;
      const isA=d===(beatInBar-1);
      const dc=inCI?'255,216,74':'255,255,255';
      cctx.save();
      if(isA){cctx.shadowColor=`rgba(${dc},0.6)`;cctx.shadowBlur=S*0.01+globalPulse*S*0.016;}
      cctx.beginPath();cctx.arc(dx,dotY,isA?dotR+S*0.002+globalPulse*S*0.003:dotR-S*0.001,0,Math.PI*2);
      cctx.fillStyle=isA?`rgba(${dc},${0.7+globalPulse*0.3})`:`rgba(${dc},0.18)`;
      cctx.fill();cctx.restore();
    }
    cctx.restore();

    document.getElementById('h-bar').style.width=(Math.max(0,t/MAX_TICK)*100).toFixed(1)+'%';
  }

  // ── TIMELINE CANVAS ────────────────────────────────────────────
  const tlcan=document.getElementById('tl-canvas'),tlctx=tlcan.getContext('2d');
  const LANE_H=46,LANE_GAP=7,TL_TOP=10;
  const SOLO_W=52,NAME_W=56,LABEL_W=SOLO_W+NAME_W+6;
  const LANES_B=TL_TOP+4*(LANE_H+LANE_GAP)-LANE_GAP;
  const TL_H=LANES_B+20;
  const soloZones=[];

  function resizeTimeline(){
    const maxW=Math.min(620,window.innerWidth-24);
    tlcan.width=maxW;tlcan.height=TL_H;drawTimeline(tick);
  }

  function rr(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
  }

  function drawTimeline(t){
    const TLW=tlcan.width;
    tlctx.clearRect(0,0,TLW,TL_H);
    soloZones.length=0;
    const laT=lookahead*TPB_BAR;
    const trkW=TLW-LABEL_W;
    const toX=tk=>LABEL_W+(tk-t)/laT*trkW;

    for(let i=0;i<4;i++){
      const ly=TL_TOP+i*(LANE_H+LANE_GAP);
      const muted=soloState.some(Boolean)&&!soloState[i];
      tlctx.fillStyle='rgba(17,17,17,0.05)';
      tlctx.fillRect(LABEL_W,ly,trkW,LANE_H);

      const sx=2,sy=ly+7,sw=SOLO_W-2,sh=LANE_H-14;
      soloZones.push({x:sx,y:sy,w:sw,h:sh,i});
      tlctx.save();
      // Solo button: white bg + black border, green fill when active
      rr(tlctx,sx,sy,sw,sh,4);
      tlctx.fillStyle=soloState[i]?'#2e8b57':'#fff';
      tlctx.fill();
      tlctx.strokeStyle='#111';
      tlctx.lineWidth=2;rr(tlctx,sx,sy,sw,sh,4);tlctx.stroke();
      tlctx.textAlign='center';tlctx.textBaseline='middle';
      tlctx.font=`700 10px ${FM}`;
      tlctx.fillStyle=soloState[i]?'#fff':'#111';
      tlctx.fillText('SOLO',sx+sw/2,sy+sh/2);
      tlctx.restore();

      // Part name — dark on white canvas
      tlctx.save();tlctx.textAlign='right';tlctx.textBaseline='middle';
      tlctx.font=`700 12px ${FM}`;
      tlctx.fillStyle=soloState[i]?'#2e8b57':'#111';
      tlctx.fillText(PNAMES[i],LABEL_W-5,ly+LANE_H/2);tlctx.restore();

      PARTS[i].events.forEach(ev=>{
        if(ev.e<t||ev.s>t+laT)return;
        const x1=Math.max(toX(ev.s),LABEL_W),x2=Math.min(toX(ev.e),TLW);
        if(x2<=x1)return;
        const col=nc(ev.n);
        const sounding=ev.s<=t&&t<ev.e;
        tlctx.save();
        rr(tlctx,x1,ly+2,Math.max(x2-x1-1.5,2),LANE_H-4,4);
        tlctx.fillStyle=muted?'rgba(74,158,104,0.08)':col;
        tlctx.globalAlpha=muted?1:(sounding?1:0.8);
        tlctx.fill();
        if(!muted){
          tlctx.globalAlpha=1;
          tlctx.strokeStyle=sounding?'#111':'rgba(17,17,17,0.25)';
          tlctx.lineWidth=sounding?2:1;
          rr(tlctx,x1,ly+2,Math.max(x2-x1-1.5,2),LANE_H-4,4);tlctx.stroke();
        }
        if(x2-x1>36){
          tlctx.textAlign='center';tlctx.textBaseline='middle';
          const cents=CENT_OFFSETS[col]||0;
          const cx=Math.max(Math.min((x1+x2)/2,x2-24),x1+24);
          tlctx.fillStyle=muted?'rgba(17,17,17,0.15)':'rgba(7,10,8,0.9)';
          if(cents){
            tlctx.font=`700 15px ${FM}`;
            tlctx.fillText(nn(ev.n),cx,ly+LANE_H/2-7);
            tlctx.font=`700 10px ${FM}`;
            tlctx.fillStyle=muted?'rgba(17,17,17,0.12)':'rgba(7,10,8,0.6)';
            tlctx.fillText((cents>0?'+':'')+cents+'¢',cx,ly+LANE_H/2+9);
          } else {
            tlctx.font=`700 15px ${FM}`;
            tlctx.fillText(nn(ev.n),cx,ly+LANE_H/2);
          }
        }
        tlctx.restore();
      });
    }

    const fb=Math.floor(t/TPB_BAR),lb=Math.ceil((t+laT)/TPB_BAR);
    for(let b=fb;b<=lb;b++){
      const bx=toX(b*TPB_BAR);
      if(bx<LABEL_W||bx>TLW)continue;
      tlctx.save();
      tlctx.strokeStyle='rgba(17,17,17,0.22)';tlctx.lineWidth=1;
      tlctx.beginPath();tlctx.moveTo(bx,TL_TOP);tlctx.lineTo(bx,LANES_B);tlctx.stroke();
      if(b>=0){
        tlctx.textAlign='center';tlctx.textBaseline='top';
        tlctx.font=`700 10px ${FM}`;
        tlctx.fillStyle='rgba(17,17,17,0.55)';
        tlctx.fillText('BAR '+(b+1),bx,LANES_B+4);
      }
      tlctx.restore();
    }
    for(let beat=Math.floor(t/TPB);beat<=Math.ceil((t+laT)/TPB);beat++){
      if(beat%BEATS_PER_BAR===0)continue;
      const bx=toX(beat*TPB);
      if(bx<LABEL_W||bx>TLW)continue;
      tlctx.save();
      tlctx.strokeStyle='rgba(17,17,17,0.08)';tlctx.lineWidth=1;tlctx.setLineDash([2,5]);
      tlctx.beginPath();tlctx.moveTo(bx,TL_TOP);tlctx.lineTo(bx,LANES_B);tlctx.stroke();
      tlctx.setLineDash([]);tlctx.restore();
    }
    // Playhead: bold line + triangle cap
    const px=toX(t);
    tlctx.save();tlctx.strokeStyle='#2e8b57';tlctx.lineWidth=3;
    tlctx.beginPath();tlctx.moveTo(px,TL_TOP-2);tlctx.lineTo(px,LANES_B+2);tlctx.stroke();
    tlctx.fillStyle='#2e8b57';
    tlctx.beginPath();tlctx.moveTo(px-6,0);tlctx.lineTo(px+6,0);tlctx.lineTo(px,TL_TOP-1);tlctx.closePath();tlctx.fill();
    tlctx.restore();
  }

  tlcan.addEventListener('click',function(e){
    const rect=tlcan.getBoundingClientRect();
    const sx=tlcan.width/rect.width,sy=tlcan.height/rect.height;
    const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
    for(const z of soloZones){
      if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){
        soloState[z.i]=!soloState[z.i];
        if(audioCtx)refreshGains();
        drawTimeline(tick);drawCircle(tick);break;
      }
    }
  });

  document.getElementById('h-vol').addEventListener('input',function(){if(masterGain)masterGain.gain.value=parseFloat(this.value);});
  document.getElementById('h-lookahead').addEventListener('input',function(){
    lookahead=parseFloat(this.value);
    document.getElementById('h-lookahead-out').textContent=lookahead+' bars';
    drawTimeline(tick);
  });
  document.getElementById('metro-toggle').addEventListener('click',function(){
    metroOn=!metroOn;this.classList.toggle('on',metroOn);
    if(metroOn){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();}
  });

  function frame(ts){
    if(!playing)return;
    if(lastTime===null)lastTime=ts;
    const dt=ts-lastTime;lastTime=ts;
    tick+=(dt/TICK_MS)*speed;
    if(tick>=MAX_TICK){
      tick=MAX_TICK;playing=false;stopAllNotes();
      document.getElementById('h-play').innerHTML='<span class="play-icon">&#9654;</span><span>Play</span>';
    }
    updateAudio(tick);checkVoiceCues(tick);drawCircle(tick);drawTimeline(tick);
    if(playing)raf=requestAnimationFrame(frame);
  }

  document.getElementById('h-play').addEventListener('click',function(){
    initAudio();if(audioCtx.state==='suspended')audioCtx.resume();
    if(tick>=MAX_TICK)tick=0;
    playing=!playing;
    if(playing){
      lastTime=null;
      this.innerHTML='<span class="play-icon">&#9646;&#9646;</span><span>Pause</span>';
      raf=requestAnimationFrame(frame);
    } else {
      stopAllNotes();
      this.innerHTML='<span class="play-icon">&#9654;</span><span>Play</span>';
    }
  });
  document.getElementById('h-skip-back').addEventListener('click',function(){
    tick=Math.max(0,tick-TPB_BAR);
    stopAllNotes();activeNotes=[null,null,null,null];lastBeat=-1;
    drawCircle(tick);drawTimeline(tick);
  });
  document.getElementById('h-skip-fwd').addEventListener('click',function(){
    tick=Math.min(MAX_TICK,tick+TPB_BAR);
    stopAllNotes();activeNotes=[null,null,null,null];lastBeat=-1;
    drawCircle(tick);drawTimeline(tick);
  });
  document.getElementById('h-reset').addEventListener('click',function(){
    playing=false;stopAllNotes();tick=0;lastTime=null;lastBeat=-1;
    document.getElementById('h-play').innerHTML='<span class="play-icon">&#9654;</span><span>Play</span>';
    drawCircle(0);drawTimeline(0);
  });
  document.getElementById('h-speed').addEventListener('input',function(){
    speed=parseFloat(this.value);document.getElementById('h-speed-out').textContent=speed+'×';
  });

  window.addEventListener('resize',()=>{resizeCircle();resizeTimeline();});
  resizeCircle();resizeTimeline();

  // ── EXTERNAL SYNC (Ableton → bridge → WebSocket) ───────────────
  // The bridge (hocket-bridge.js) follows MIDI clock from Ableton and
  // broadcasts {t:'s', tick, playing, bpm}. All connected devices chase
  // the same clock, so 4 iPads on one Wi-Fi network stay locked.
  const SYNC={on:false,ws:null,last:null,bpm:BPM,url:null,retry:null,sound:false,raf:null,wasPlaying:false,
              rtt:null,ping:null,schedBeat:null,offMs:parseFloat(localStorage.getItem('hocketNudge')||'0')};
  const syncBtn=document.getElementById('sync-toggle');
  const soundBtn=document.getElementById('sync-sound');
  const nudgeGroup=document.getElementById('nudge-group');
  const nudgeIn=document.getElementById('h-nudge'),nudgeOut=document.getElementById('h-nudge-out');
  nudgeIn.value=SYNC.offMs;nudgeOut.textContent=(SYNC.offMs>0?'+':'')+SYNC.offMs+'ms';
  nudgeIn.addEventListener('input',function(){
    SYNC.offMs=parseFloat(this.value);
    localStorage.setItem('hocketNudge',SYNC.offMs);
    nudgeOut.textContent=(SYNC.offMs>0?'+':'')+SYNC.offMs+'ms';
  });
  const lockEls=['h-play','h-skip-back','h-skip-fwd','h-reset','h-speed'].map(id=>document.getElementById(id));

  function setSyncUI(state){ // 'off' | 'ok' | 'err'
    syncBtn.classList.toggle('sync-ok',state==='ok');
    syncBtn.classList.toggle('sync-err',state==='err');
    syncBtn.innerHTML=state==='ok'?'&#9737; Synced':(state==='err'?'&#9737; Sync&hellip;':'&#9737; Sync');
    lockEls.forEach(el=>el.classList.toggle('sync-lock',state!=='off'));
    soundBtn.style.display=state==='off'?'none':'';
    nudgeGroup.style.display=state==='off'?'none':'';
  }

  function syncConnect(url){
    SYNC.url=url;SYNC.on=true;
    if(SYNC.ws){try{SYNC.ws.close();}catch(e){}}
    setSyncUI('err');
    let ws;
    try{ws=new WebSocket(url);}catch(e){scheduleRetry();return;}
    SYNC.ws=ws;
    ws.onopen=()=>{
      setSyncUI('ok');
      if(!SYNC.raf)SYNC.raf=requestAnimationFrame(syncFrame);
      clearInterval(SYNC.ping);
      SYNC.ping=setInterval(()=>{
        if(ws.readyState===1)ws.send(JSON.stringify({t:'p',c:performance.now()}));
      },2000);
      ws.send(JSON.stringify({t:'p',c:performance.now()}));
    };
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      if(m.t==='p'){
        const r=performance.now()-m.c;
        SYNC.rtt=SYNC.rtt===null?r:SYNC.rtt*0.7+r*0.3;
        return;
      }
      if(m.t==='s'||m.t==='hi'){
        m.rx=performance.now();
        if(m.bpm>20&&m.bpm<400)SYNC.bpm=m.bpm;
        if(SYNC.wasPlaying&&!m.playing){stopAllNotes();activeNotes=[null,null,null,null];lastBeat=-1;SYNC.schedBeat=null;resyncCues(tick);}
        SYNC.wasPlaying=!!m.playing;
        SYNC.last=m;
      }
    };
    ws.onclose=()=>{clearInterval(SYNC.ping);if(SYNC.on){setSyncUI('err');scheduleRetry();}};
    ws.onerror=()=>{try{ws.close();}catch(e){}};
  }
  function scheduleRetry(){
    clearTimeout(SYNC.retry);
    SYNC.retry=setTimeout(()=>{if(SYNC.on)syncConnect(SYNC.url);},2000);
  }
  function syncStop(){
    SYNC.on=false;clearTimeout(SYNC.retry);clearInterval(SYNC.ping);
    if(SYNC.ws){try{SYNC.ws.close();}catch(e){}}
    SYNC.ws=null;SYNC.last=null;SYNC.rtt=null;
    if(SYNC.raf){cancelAnimationFrame(SYNC.raf);SYNC.raf=null;}
    stopAllNotes();activeNotes=[null,null,null,null];lastBeat=-1;
    tick=Math.max(0,tick);
    setSyncUI('off');drawCircle(tick);drawTimeline(tick);
  }

  // Beat-accurate click: derive upcoming beat times from the raw network
  // estimate and schedule them ahead on the Web Audio clock. Once a click is
  // booked its timing never moves, so beats stay rock-steady even while the
  // sync estimate wobbles a few ms between messages.
  function scheduleClicks(m){
    if(!audioCtx||!metroOn)return;
    const LOOK_MS=180;
    const tickMs=(60000/SYNC.bpm)/TPB;
    const compMs=(SYNC.rtt!==null?SYNC.rtt/2:0)+SYNC.offMs;
    const pn=performance.now();
    const tickNow=m.tick+(pn-m.rx+compMs)/tickMs;
    const GRACE=40/tickMs; // beats up to 40ms in the past still fire (clamped to now)
    let nextBeat=Math.floor((tickNow-GRACE)/TPB)+1;
    if(SYNC.schedBeat!==null){
      // stale after a locate the snap-guard didn't catch
      if(SYNC.schedBeat<nextBeat-2||SYNC.schedBeat>nextBeat+4)SYNC.schedBeat=null;
      else nextBeat=Math.max(nextBeat,SYNC.schedBeat+1);
    }
    while(true){
      const dtMs=(nextBeat*TPB-tickNow)*tickMs;
      if(dtMs>LOOK_MS)break;
      if(nextBeat*TPB>MAX_TICK)break;
      playMetroClick(nextBeat,audioCtx.currentTime+Math.max(dtMs,1)/1000);
      SYNC.schedBeat=nextBeat;
      nextBeat++;
    }
  }

  function syncFrame(){
    if(!SYNC.on){SYNC.raf=null;return;}
    const m=SYNC.last;
    if(m){
      let target=m.tick;
      if(m.playing){
        const tickMs=(60000/SYNC.bpm)/TPB;
        const compMs=(SYNC.rtt!==null?SYNC.rtt/2:0)+SYNC.offMs;
        target=m.tick+(performance.now()-m.rx+compMs)/tickMs;
      }
      target=Math.min(MAX_TICK,target); // negative allowed: count-in runs before bar 1
      // Chase the bridge clock: snap on big jumps, glide on jitter.
      // The GLIDED tick drives visuals only; clicks are scheduled from the
      // raw network estimate on the sample-accurate audio clock below.
      if(Math.abs(target-tick)>TPB_BAR){tick=target;stopAllNotes();activeNotes=[null,null,null,null];lastBeat=-1;SYNC.schedBeat=null;resyncCues(tick);}
      else tick+=(target-tick)*0.35;
      if(m.playing&&SYNC.sound&&audioCtx)updateAudio(tick,false);
      if(m.playing){scheduleClicks(m);checkVoiceCues(tick);}
      drawCircle(tick);drawTimeline(tick);
    }
    SYNC.raf=requestAnimationFrame(syncFrame);
  }

  syncBtn.addEventListener('click',function(){
    if(SYNC.on){syncStop();return;}
    if(playing)document.getElementById('h-play').click();
    let def=localStorage.getItem('hocketBridge')||(location.protocol==='http:'?location.host:'');
    const addr=prompt('Bridge address (laptop IP:port)',def);
    if(!addr)return;
    localStorage.setItem('hocketBridge',addr);
    syncConnect(addr.startsWith('ws')?addr:'ws://'+addr);
  });
  soundBtn.addEventListener('click',function(){
    SYNC.sound=!SYNC.sound;this.classList.toggle('on',SYNC.sound);
    if(SYNC.sound){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();}
    else{stopAllNotes();activeNotes=[null,null,null,null];}
  });

  // ── VOICE CUES ─────────────────────────────────────────────────
  // Per-device spoken guide for ONE part: two bars before each change it
  // announces the note ("Change to: F sharp, blue"), then counts "1 2 3 4"
  // on the last four beats, landing the change on the next beat. Uses the
  // built-in speech synthesiser; the click remains the precision reference,
  // the voice is the instruction.
  const VOICE={part:parseInt(localStorage.getItem('hocketVoicePart')||'-1',10),cues:[],idx:0};
  if(!(VOICE.part>=0&&VOICE.part<=3))VOICE.part=-1;
  localStorage.removeItem('hocketVoice'); // clear old pre-toggle storage key, if present
  const voiceBtns=[...document.querySelectorAll('.voice-sax')];
  const COLOUR_WORD={[COL.red]:'red',[COL.yellow]:'yellow',[COL.green]:'green',[COL.blue]:'blue'};
  const ACC_WORD={'C#':'C sharp','Eb':'E flat','F#':'F sharp','Ab':'A flat','Bb':'B flat'};

  function spokenNote(midi){
    const base=NN[midi%12];
    return (ACC_WORD[base]||base)+', '+(COLOUR_WORD[nc(midi)]||'');
  }

  function buildCues(pi){
    const evs=PARTS[pi].events;
    // Announcement lands 2 bars out when there's room; in fast sections it
    // slides later (just after the previous change) so the note name is
    // never dropped. Needs >=2 beats clear of the count-in digits.
    const annT=evs.map((ev,k)=>{
      let at=ev.s-8*TPB;
      if(k>0)at=Math.max(at,evs[k-1].s+TPB);
      return at<=ev.s-6*TPB?at:null;
    });
    const cues=[];
    evs.forEach((ev,k)=>{
      const prev=k>0?evs[k-1]:null;
      const entry=prev&&ev.s-prev.e>0;
      const verb=entry?'Come in: ':(prev?'Change to: ':'Starting on: ');
      if(annT[k]!==null)cues.push({t:annT[k],text:verb+spokenNote(ev.n),digit:false});
      // Counted lead-in on the last 4 beats
      for(let d=1;d<=4;d++)cues.push({t:ev.s-(5-d)*TPB,text:String(d),digit:true});
      // Spoken "rest" at note end when a real gap follows and it won't
      // scramble the order of the next announcement
      const nxt=evs[k+1];
      if(nxt&&nxt.s-ev.e>=4*TPB&&(annT[k+1]===null||annT[k+1]>ev.e+TPB))
        cues.push({t:ev.e,text:'rest',digit:true});
    });
    cues.sort((a,b)=>a.t-b.t);
    return cues;
  }

  function speakCue(c){
    if(!('speechSynthesis' in window))return;
    if(c.digit)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(c.text);
    u.rate=c.digit?1.15:1.0;u.volume=1;
    speechSynthesis.speak(u);
  }

  function resyncCues(t){
    if('speechSynthesis' in window)speechSynthesis.cancel();
    VOICE.idx=0;
    while(VOICE.idx<VOICE.cues.length&&VOICE.cues[VOICE.idx].t<=t)VOICE.idx++;
  }

  function checkVoiceCues(t){
    if(VOICE.part<0||!VOICE.cues.length)return;
    const bpmEff=SYNC.on?SYNC.bpm:BPM*speed;
    const leadTicks=0.12*TPB*bpmEff/60; // fire ~120ms early to swallow TTS latency
    while(VOICE.idx<VOICE.cues.length&&VOICE.cues[VOICE.idx].t<=t+leadTicks){
      const c=VOICE.cues[VOICE.idx++];
      if(c.t>=t-TPB)speakCue(c); // skip anything more than a beat stale
    }
  }

  function setVoiceUI(){
    voiceBtns.forEach(b=>b.classList.toggle('on',parseInt(b.dataset.i,10)===VOICE.part));
  }
  voiceBtns.forEach(btn=>btn.addEventListener('click',function(){
    const i=parseInt(this.dataset.i,10);
    VOICE.part=(VOICE.part===i)?-1:i;
    localStorage.setItem('hocketVoicePart',VOICE.part);
    VOICE.cues=VOICE.part>=0?buildCues(VOICE.part):[];
    resyncCues(tick);setVoiceUI();
    if('speechSynthesis' in window){
      // Spoken confirmation for BOTH states (also unlocks TTS on iOS)
      const u=new SpeechSynthesisUtterance(
        VOICE.part>=0?'Voice cues: saxophone '+(VOICE.part+1):'Voice cues off');
      speechSynthesis.speak(u);
    }
  }));
  if(VOICE.part>=0){VOICE.cues=buildCues(VOICE.part);resyncCues(tick);}
  setVoiceUI();

  // Keep the cue pointer honest across local transport moves
  ['h-play','h-skip-back','h-skip-fwd','h-reset'].forEach(id=>{
    document.getElementById(id).addEventListener('click',()=>resyncCues(tick));
  });

  // Auto-connect when served by the bridge, or via ?sync=host:port
  (function(){
    const p=new URLSearchParams(location.search).get('sync');
    if(p){syncConnect(p.startsWith('ws')?p:'ws://'+p);return;}
    if(location.protocol==='http:'&&location.host){
      // Probe quietly: only stay in sync mode if the bridge answers
      const probe=new WebSocket('ws://'+location.host);
      probe.onopen=()=>{probe.close();syncConnect('ws://'+location.host);};
      probe.onerror=()=>{try{probe.close();}catch(e){}};
    }
  })();
})();


</script>
